                      public void onStartTrackingTouch(
                              SeekBar s) {}

                      public void onProgressChanged(
                              SeekBar s,
                              int value,
                              boolean user
                      ) {
                          if(user) {
                              filterIntensity=value;

                              intensityLabel.setText(
                                      "Filter Intensity    "
                                      +value
                              );

                              schedulePreview();
                          }
                      }

                      public void onStopTrackingTouch(
                              SeekBar s) {}
