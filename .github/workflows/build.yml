              void choosePhoto() {

                  Intent intent =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                          );

                  intent.setType("image/*");

                  intent.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          intent,
                          100
                  );
              }

              @Override
              protected void onActivityResult(
                      int request,
                      int result,
                      Intent data
              ) {

                  super.onActivityResult(
                          request,
                          result,
                          data
                  );

                  if (
                          request == 100
                          && result == RESULT_OK
                          && data != null
                          && data.getData() != null
                  ) {

                      uri =
                              data.getData();

                      loadPhoto();
                  }
              }

              void loadPhoto() {

                  try {

                      BitmapFactory.Options bounds =
                              new BitmapFactory.Options();

                      bounds.inJustDecodeBounds =
                              true;

                      InputStream first =
                              getContentResolver()
                                      .openInputStream(uri);

                      BitmapFactory.decodeStream(
                              first,
                              null,
                              bounds
                      );

                      if (first != null)
                          first.close();

                      int longest =
                              Math.max(
                                      bounds.outWidth,
                                      bounds.outHeight
                              );

                      int sample = 1;

                      while (
                              longest / sample > 1600
                      ) {

                          sample *= 2;
                      }

                      BitmapFactory.Options options =
                              new BitmapFactory.Options();

                      options.inSampleSize =
                              sample;

                      options.inPreferredConfig =
                              Bitmap.Config.ARGB_8888;

                      InputStream second =
                              getContentResolver()
                                      .openInputStream(uri);

                      original =
                              BitmapFactory.decodeStream(
                                      second,
                                      null,
                                      options
                              );

                      if (second != null)
                          second.close();

                      Arrays.fill(
                              values,
                              0
                      );

                      selectedFilter = 0;
                      filterIntensity = 100;

                      undoStack.clear();
                      redoStack.clear();

                      beforeMode = false;

                      preview.clearColorFilter();

                      preview.setImageBitmap(
                              original
                      );

                      Button choose =
                              findViewById(9001);

                      if (choose != null) {

                          choose.setText(
                                  "🔄  CHANGE PHOTO"
                          );
                      }

                      toast("Photo loaded");

                  } catch (Exception e) {

                      toast(
                              "Photo load failed"
                      );
                  }
              }

              void pushUndo() {

                  if (original == null)
                      return;

                  undoStack.push(
                          new EditState(
                                  values.clone(),
                                  selectedFilter,
                                  filterIntensity
                          )
                  );

                  while (
                          undoStack.size() > 15
                  ) {

                      undoStack.removeLast();
                  }

                  redoStack.clear();
              }

              void undo() {

                  if (undoStack.isEmpty())
                      return;

                  redoStack.push(
                          new EditState(
                                  values.clone(),
                                  selectedFilter,
                                  filterIntensity
                          )
                  );

                  EditState state =
                          undoStack.pop();

                  restore(state);
              }

              void redo() {

                  if (redoStack.isEmpty())
                      return;

                  undoStack.push(
                          new EditState(
                                  values.clone(),
                                  selectedFilter,
                                  filterIntensity
                          )
                  );

                  EditState state =
                          redoStack.pop();

                  restore(state);
              }

              void restore(EditState state) {

                  values =
                          state.values.clone();

                  selectedFilter =
                          state.filter;

                  filterIntensity =
                          state.intensity;

                  beforeMode = false;

                  render();
              }

              void reset() {

                  if (original == null)
                      return;

                  pushUndo();

                  Arrays.fill(
                          values,
                          0
                  );

                  selectedFilter = 0;
                  filterIntensity = 100;

                  beforeMode = false;

                  render();
              }

              void beforeAfter() {

                  if (original == null)
                      return;

                  beforeMode =
                          !beforeMode;

                  if (beforeMode) {

                      if (pendingRender != null) {

                          handler.removeCallbacks(
                                  pendingRender
                          );
                      }

                      preview.clearColorFilter();

                      preview.setImageBitmap(
                              original
                      );

                  } else {

                      render();
                  }
              }

              void scheduleRender() {

                  if (
                          original == null
                          || beforeMode
                  )
                      return;

                  if (pendingRender != null) {

                      handler.removeCallbacks(
                              pendingRender
                      );
                  }

                  pendingRender =
                          this::render;

                  handler.postDelayed(
                          pendingRender,
                          70
                  );
              }

              void render() {

                  if (
                          original == null
                          || beforeMode
                  )
                      return;

                  ColorMatrix matrix =
                          buildMatrix();

                  preview.setImageBitmap(
                          original
                  );

                  preview.setColorFilter(
                          new ColorMatrixColorFilter(
                                  matrix
                          )
                  );
              }

              ColorMatrix buildMatrix() {

                  ColorMatrix cm =
                          new ColorMatrix();

                  float brightness =
                          values[0] * 2.2f
                          + values[1] * 1.8f
                          + values[2] * 1.2f;

                  float contrast =
                          1f
                          + values[3] / 100f;

                  float saturation =
                          Math.max(
                                  0f,
                                  1f
                                  + values[7] / 100f
                                  + values[8] / 200f
                          );

                  cm.setSaturation(
                          saturation
                  );

                  cm.postConcat(
                          new ColorMatrix(
                                  new float[]{

                                          contrast,0,0,0,brightness,
                                          0,contrast,0,0,brightness,
                                          0,0,contrast,0,brightness,
                                          0,0,0,1,0
                                  }
                          )
                  );

                  float warmth =
                          values[9] * 0.55f;

                  float tint =
                          values[10] * 0.35f;

                  cm.postConcat(
                          new ColorMatrix(
                                  new float[]{

                                          1,0,0,0,
                                          warmth + tint,

                                          0,1,0,0,0,

                                          0,0,1,0,
                                          -warmth + tint,

                                          0,0,0,1,0
                                  }
                          )
                  );

                  if (values[15] > 0) {

                      float fade =
                              values[15] / 100f;

                      cm.postConcat(
                              new ColorMatrix(
                                      new float[]{

                                              1-fade,0,0,0,
                                              128*fade,

                                              0,1-fade,0,0,
                                              128*fade,

                                              0,0,1-fade,0,
                                              128*fade,

                                              0,0,0,1,0
                                      }
                              )
                      );
                  }

                  ColorMatrix fm =
                          filterMatrix(
                                  selectedFilter
                          );

                  float amount =
                          filterIntensity / 100f;

                  if (
                          selectedFilter != 0
                          && amount < 1f
                  ) {

                      float[] a =
                              fm.getArray();

                      for (
                              int i = 0;
                              i < 20;
                              i++
                      ) {

                          float identity =
                                  (i % 6 == 0)
                                          ? 1f
                                          : 0f;

                          a[i] =
                                  identity
                                  + (
                                          a[i]
                                          - identity
                                  ) * amount;
                      }

                      fm.set(a);
                  }

                  cm.postConcat(fm);

                  return cm;
              }

              ColorMatrix filterMatrix(int f) {

                  ColorMatrix m =
                          new ColorMatrix();

                  switch (f) {

                      case 1:

                          m.set(
                                  new float[]{

                                          1.15f,0,0,0,0,
                                          0,1.15f,0,0,0,
                                          0,0,1.15f,0,0,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 2:

                          m.set(
                                  new float[]{

                                          1.18f,0,0,0,8,
                                          0,1.10f,0,0,0,
                                          0,0,1.02f,0,0,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 3:

                          m.set(
                                  new float[]{

                                          1.02f,0,0,0,0,
                                          0,1.08f,0,0,0,
                                          0,0,1.18f,0,0,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 4:

                          m.set(
                                  new float[]{

                                          1.25f,0,0,0,-20,
                                          0,1.25f,0,0,-20,
                                          0,0,1.25f,0,-20,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 5:

                          m.set(
                                  new float[]{

                                          1.28f,0,0,0,-18,
                                          0,1.22f,0,0,-10,
                                          0,0,1.08f,0,0,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 6:

                          m.set(
                                  new float[]{

                                          1.08f,0,0,0,0,
                                          0,1.18f,0,0,0,
                                          0,0,1.28f,0,0,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 7:

                          m.setSaturation(0);

                          break;

                      case 8:

                          m.set(
                                  new float[]{

                                          .90f,.10f,.10f,0,8,
                                          .10f,.90f,.10f,0,8,
                                          .10f,.10f,.90f,0,8,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 9:

                          m.set(
                                  new float[]{

                                          .75f,.75f,.75f,0,-45,
                                          .75f,.75f,.75f,0,-45,
                                          .75f,.75f,.75f,0,-45,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 10:

                          m.set(
                                  new float[]{

                                          1.12f,0,0,0,5,
                                          0,1.02f,0,0,0,
                                          0,0,.90f,0,-4,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 11:

                          m.set(
                                  new float[]{

                                          .92f,0,0,0,0,
                                          0,1.02f,0,0,0,
                                          0,0,1.12f,0,0,
                                          0,0,0,1,0
                                  }
                          );

                          break;

                      case 12:

                          m.set(
                                  new float[]{

                                          .92f,.08f,0,0,12,
                                          .08f,.92f,0,0,12,
                                          0,.08f,.92f,0,12,
                                          0,0,0,1,0
                                  }
                          );

                          break;
                  }

                  return m;
              }

              void rotate() {

                  if (original == null)
                      return;

                  pushUndo();

                  Matrix matrix =
                          new Matrix();

                  matrix.postRotate(90);

                  Bitmap old =
                          original;

                  original =
                          Bitmap.createBitmap(
                                  old,
                                  0,
                                  0,
                                  old.getWidth(),
                                  old.getHeight(),
                                  matrix,
                                  true
                          );

                  if (
                          old != original
                          && !old.isRecycled()
                  ) {
                      old.recycle();
                  }

                  render();
              }

              void flip() {

                  if (original == null)
                      return;

                  pushUndo();

                  Matrix matrix =
                          new Matrix();

                  matrix.postScale(-1, 1);

                  Bitmap old =
                          original;

                  original =
                          Bitmap.createBitmap(
                                  old,
                                  0,
                                  0,
                                  old.getWidth(),
                                  old.getHeight(),
                                  matrix,
                                  true
                          );

                  if (
                          old != original
                          && !old.isRecycled()
                  ) {
                      old.recycle();
                  }

                  render();
              }

              void crop() {

                  if (original == null)
                      return;

                  pushUndo();

                  int width =
                          original.getWidth();

                  int height =
                          original.getHeight();

                  int side =
                          Math.min(
                                  width,
                                  height
                          );

                  Bitmap old =
                          original;

                  original =
                          Bitmap.createBitmap(
                                  old,
                                  (width - side) / 2,
                                  (height - side) / 2,
                                  side,
                                  side
                          );

                  if (
                          old != original
                          && !old.isRecycled()
                  ) {
                      old.recycle();
                  }

                  render();
              }

              void save() {

                  if (original == null) {

                      toast(
                              "Pehle photo choose karo"
                      );

                      return;
                  }

                  toast("Saving...");

                  new Thread(
                          () -> {

                              try {

                                  Bitmap output =
                                          Bitmap.createBitmap(
                                                  original.getWidth(),
                                                  original.getHeight(),
                                                  Bitmap.Config.ARGB_8888
                                          );

                                  Canvas canvas =
                                          new Canvas(output);

                                  Paint paint =
                                          new Paint(
                                                  Paint.ANTI_ALIAS_FLAG
                                          );

                                  paint.setColorFilter(
                                          new ColorMatrixColorFilter(
                                                  buildMatrix()
                                          )
                                  );

                                  canvas.drawBitmap(
                                          original,
                                          0,
                                          0,
                                          paint
                                  );

                                  ContentValues values =
                                          new ContentValues();

                                  values.put(
                                          MediaStore.Images.Media.DISPLAY_NAME,
                                          "RCINSTAEDIT_"
                                                  + System.currentTimeMillis()
                                                  + ".jpg"
                                  );

                                  values.put(
                                          MediaStore.Images.Media.MIME_TYPE,
                                          "image/jpeg"
                                  );

                                  if (
                                          Build.VERSION.SDK_INT >= 29
                                  ) {

                                      values.put(
                                              MediaStore.Images.Media.RELATIVE_PATH,
                                              "Pictures/RCINSTAEDIT"
                                      );
                                  }

                                  Uri saved =
                                          getContentResolver()
                                              .insert(
                                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                                  values
                                              );

                                  if (saved == null)
                                      throw new Exception();

                                  OutputStream stream =
                                          getContentResolver()
                                              .openOutputStream(
                                                  saved
                                              );

                                  if (stream == null)
                                      throw new Exception();

                                  output.compress(
                                          Bitmap.CompressFormat.JPEG,
                                          96,
                                          stream
                                  );

                                  stream.close();

                                  output.recycle();

                                  runOnUiThread(
                                          () ->
                                              toast(
                                                  "Saved in Pictures/RCINSTAEDIT"
                                              )
                                  );

                              } catch (Exception e) {

                                  runOnUiThread(
                                          () ->
                                              toast(
                                                  "Save failed"
                                              )
                                  );
                              }

                          }
                  ).start();
              }

              @Override
              protected void onDestroy() {

                  if (pendingRender != null) {

                      handler.removeCallbacks(
                              pendingRender
                      );
                  }

                  super.onDestroy();
              }

              static class EditState {

                  float[] values;

                  int filter;

                  int intensity;

                  EditState(
                          float[] values,
                          int filter,
                          int intensity
                  ) {

                      this.values =
                              values;

                      this.filter =
                              filter;

                      this.intensity =
                              intensity;
                  }
              }

              void toast(String s) {

                  Toast.makeText(
                          this,
                          s,
                          Toast.LENGTH_SHORT
                  ).show();
              }
          }
