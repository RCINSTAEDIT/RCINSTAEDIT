                                  exposure = 0;
                                  contrast = 0;
                                  saturation = 0;
                                  temperature = 0;
                                  fade = 0;

                                  updatePreview();

                                  toast(
                                          "Adjustments reset"
                                  );
                              }
                          }
                  );

                  scroll.addView(controls);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
