                                  20
                          )
                  );

                  root.setClipToPadding(
                          false
                  );

                  return root;
              }

              private void setContentViewWithInsets(
                      final View root
              ) {

                  root.setOnApplyWindowInsetsListener(
                          new View.OnApplyWindowInsetsListener() {

                              @Override
                              public WindowInsets
                              onApplyWindowInsets(
                                      View v,
                                      WindowInsets insets
                              ) {

                                  int top = 0;
                                  int bottom = 0;
                                  int left = 0;
                                  int right = 0;

                                  if (Build.VERSION.SDK_INT >= 30) {

                                      android.graphics.Insets system =
                                              insets.getInsets(
                                                      WindowInsets.Type.systemBars()
                                                              |
                                                      WindowInsets.Type.displayCutout()
                                              );

                                      top =
                                              system.top;

                                      bottom =
                                              system.bottom;

                                      left =
                                              system.left;

                                      right =
                                              system.right;

                                  } else {

                                      top =
                                              insets.getSystemWindowInsetTop();

                                      bottom =
                                              insets.getSystemWindowInsetBottom();

                                      left =
                                              insets.getSystemWindowInsetLeft();

                                      right =
                                              insets.getSystemWindowInsetRight();
                                  }

                                  root.setPadding(
                                          left,
                                          top,
                                          right,
                                          bottom
                                  );

                                  return insets;
                              }
                          }
                  );

                  setContentView(root);

                  root.requestApplyInsets();
              }

