              private LinearLayout.LayoutParams lp(
                      int width,
                      int height
              ) {

                  return new LinearLayout.LayoutParams(
                          width,
                          height
                  );
              }

              private void addSpace(
                      LinearLayout root,
                      int height
              ) {

                  root.addView(
                          new View(this),
                          lp(1, dp(height))
                  );
              }

              private int dp(int value) {

                  return (int) (
                          value *
                                  getResources()
                                          .getDisplayMetrics()
                                          .density
                  );
              }

              private void toast(
                      String message
              ) {

                  Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_SHORT
                  ).show();
              }
