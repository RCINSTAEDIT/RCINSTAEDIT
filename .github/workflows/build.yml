                                  updatePreview();
                              }
                          }
                  );

                  TextView before =
                          makeButton("HOLD: BEFORE");

                  before.setTextSize(13);

                  before.setOnTouchListener(
                          new View.OnTouchListener() {
                              @Override
                              public boolean onTouch(
                                      View v,
                                      MotionEvent e
                              ) {

                                  if (e.getAction() ==
                                          MotionEvent.ACTION_DOWN) {

                                      beforePressed = true;
                                      showBefore();
                                      return true;
                                  }

                                  if (e.getAction() ==
                                          MotionEvent.ACTION_UP ||
                                          e.getAction() ==
                                                  MotionEvent.ACTION_CANCEL) {

                                      beforePressed = false;
                                      updatePreview();
                                      return true;
                                  }

                                  return true;
                              }
                          }
                  );

                  quick.addView(
                          before,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(48),
                                  1
                          )
                  );

                  root.addView(
                          quick,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(58)
                          )
                  );

                  ScrollView scroll =
                          new ScrollView(this);

                  LinearLayout tools =
                          new LinearLayout(this);

                  tools.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  tools.setPadding(
                          dp(12),
                          dp(5),
                          dp(12),
                          dp(25)
                  );

                  addTool(
                          tools,
                          "🎚  ADJUST",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {

                                  if (!hasPhoto()) return;

                                  openScreen("adjust");
                              }
                          }
                  );

                  addTool(
                          tools,
                          "🎨  FILTERS",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {

                                  if (!hasPhoto()) return;

                                  openScreen("filters");
                              }
                          }
                  );

                  addTool(
                          tools,
                          "↪  ROTATE 90°",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  rotate90();
                              }
                          }
                  );

                  addTool(
                          tools,
                          "↔  FLIP HORIZONTAL",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  flipHorizontal();
                              }
                          }
                  );

                  addTool(
                          tools,
                          "↕  FLIP VERTICAL",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  flipVertical();
                              }
                          }
                  );

                  addTool(
                          tools,
                          "✂  CENTER CROP",
                          new View.OnClickListener() {
                              @Override
