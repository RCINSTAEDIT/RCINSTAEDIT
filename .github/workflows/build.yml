

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        run: |
          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties
          rm -rf gradle

          mkdir -p app/src/main/java/com/rcinstaedit/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          FILE

          cat > build.gradle <<'FILE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          FILE

          cat > gradle.properties <<'FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          FILE

          cat > app/build.gradle <<'FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.rcinstaedit.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          FILE

          cat > app/src/main/res/values/colors.xml <<'FILE'
          <resources>
              <color name="black">#08080B</color>
              <color name="pink">#FF2D78</color>
              <color name="white">#FFFFFF</color>
              <color name="gray">#A7A7B0</color>
              <color name="card">#17171D</color>
          </resources>
          FILE

          cat > app/src/main/res/values/themes.xml <<'FILE'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#08080B</item>
                  <item name="android:navigationBarColor">#08080B</item>
                  <item name="android:colorAccent">#FF2D78</item>
                  <item name="android:windowBackground">#08080B</item>
              </style>
          </resources>
          FILE

          cat > app/src/main/AndroidManifest.xml <<'FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="RCINSTAEDIT"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          FILE

          cat > app/src/main/java/com/rcinstaedit/app/MainActivity.java <<'FILE'
          package com.rcinstaedit.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          import java.io.OutputStream;

          public class MainActivity extends Activity {

              LinearLayout root;
              ImageView photoView;
              Bitmap originalBitmap;
              Bitmap editedBitmap;
              VideoView videoView;

              int pink = Color.rgb(255,45,120);
              int white = Color.WHITE;
              int gray = Color.rgb(170,170,180);
              int card = Color.rgb(23,23,29);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              TextView text(String value, float size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  t.setPadding(22, 12, 22, 12);
                  return t;
              }

              Button button(String title) {
                  Button b = new Button(this);
                  b.setText(title);
                  b.setTextSize(15);
                  b.setTextColor(white);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER);
                  b.setMinHeight(60);
                  b.setBackgroundColor(card);
                  return b;
              }

              void base() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(8,8,11));
                  root.setPadding(18, 18, 18, 18);
              }

              void showHome() {
                  base();

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);

                  TextView logo = text("RCINSTAEDIT", 32, pink);
                  logo.setGravity(Gravity.CENTER_VERTICAL);
                  content.addView(logo);

                  TextView sub = text("Professional Photo & Reel Editor", 18, gray);
                  content.addView(sub);

                  Space space = new Space(this);
                  content.addView(space, new LinearLayout.LayoutParams(1,20));

                  Button photo = button("🖼  PHOTO EDITOR");
                  content.addView(photo, params());

                  Button video = button("🎬  VIDEO EDITOR");
                  content.addView(video, params());

                  Button effects = button("✨  EFFECTS");
                  content.addView(effects, params());

                  Button transitions = button("⚡  TRANSITIONS");
                  content.addView(transitions, params());

                  Button export = button("⬆  HIGH QUALITY EXPORT");
                  content.addView(export, params());

                  Space bottom = new Space(this);
                  content.addView(bottom, new LinearLayout.LayoutParams(1,35));

                  TextView info = text(
                      "RCINSTAEDIT  •  Version 1.0\\n\\nCreate. Edit. Inspire.\\n\\nPhoto tools and video tools are ready.",
                      15, gray
                  );
                  info.setGravity(Gravity.CENTER);
                  content.addView(info, new LinearLayout.LayoutParams(
                      -1, 170
                  ));

                  scroll.addView(content);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1,-1));
                  setContentView(root);

                  photo.setOnClickListener(v -> showPhotoEditor());
                  video.setOnClickListener(v -> showVideoEditor());
                  effects.setOnClickListener(v -> showEffects());
                  transitions.setOnClickListener(v -> showTransitions());
                  export.setOnClickListener(v -> showExport());
              }

              LinearLayout.LayoutParams params() {
                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1, 64);
                  p.setMargins(0, 8, 0, 8);
                  return p;
              }

              TextView header(String title) {
                  TextView h = text("‹   " + title, 22, white);
                  h.setPadding(5, 10, 5, 20);
                  h.setOnClickListener(v -> showHome());
                  return h;
              }

              void showPhotoEditor() {
                  base();

                  root.addView(header("PHOTO EDITOR"));

                  Button choose = button("📷  SELECT PHOTO FROM PHONE");
                  root.addView(choose, params());

                  photoView = new ImageView(this);
                  photoView.setBackgroundColor(Color.rgb(18,18,22));
                  photoView.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  root.addView(photoView, new LinearLayout.LayoutParams(-1,0,1));

                  LinearLayout tools = new LinearLayout(this);
                  tools.setOrientation(LinearLayout.HORIZONTAL);

                  Button grayBtn = button("B&W");
                  Button bright = button("BRIGHT");
                  Button save = button("SAVE");

                  tools.addView(grayBtn, new LinearLayout.LayoutParams(0,65,1));
                  tools.addView(bright, new LinearLayout.LayoutParams(0,65,1));
                  tools.addView(save, new LinearLayout.LayoutParams(0,65,1));

                  root.addView(tools);

                  choose.setOnClickListener(v -> pickPhoto());

                  grayBtn.setOnClickListener(v -> applyGray());

                  bright.setOnClickListener(v -> applyBrightness());

                  save.setOnClickListener(v -> savePhoto());
              }

              void pickPhoto() {
                  Intent i = new Intent(Intent.ACTION_PICK);
                  i.setDataAndType(
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                      "image/*"
                  );
                  startActivityForResult(i, 100);
              }

              void pickVideo() {
                  Intent i = new Intent(Intent.ACTION_PICK);
                  i.setDataAndType(
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                      "video/*"
                  );
                  startActivityForResult(i, 200);
              }

              @Override
              protected void onActivityResult(
                      int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (resultCode != RESULT_OK || data == null) return;

                  Uri uri = data.getData();

                  try {
                      if (requestCode == 100) {
                          originalBitmap =
                              BitmapFactory.decodeStream(
                                  getContentResolver().openInputStream(uri)
                              );

                          editedBitmap = originalBitmap.copy(
                              Bitmap.Config.ARGB_8888, true
                          );

                          photoView.setImageBitmap(editedBitmap);
                      }

                      if (requestCode == 200) {
                          videoView.setVideoURI(uri);
                          videoView.start();
                      }
                  } catch (Exception e) {
                      Toast.makeText(
                          this,
                          "File open nahi ho payi",
                          Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              void applyGray() {
                  if (originalBitmap == null) {
                      Toast.makeText(this,"Pehle photo select karo",Toast.LENGTH_SHORT).show();
                      return;
                  }

                  Bitmap out = Bitmap.createBitmap(
                      originalBitmap.getWidth(),
                      originalBitmap.getHeight(),
                      Bitmap.Config.ARGB_8888
                  );

                  Canvas canvas = new Canvas(out);
                  Paint paint = new Paint();

                  ColorMatrix matrix = new ColorMatrix();
                  matrix.setSaturation(0);

                  paint.setColorFilter(new ColorMatrixColorFilter(matrix));
                  canvas.drawBitmap(originalBitmap,0,0,paint);

                  editedBitmap = out;
                  photoView.setImageBitmap(editedBitmap);
              }

              void applyBrightness() {
                  if (originalBitmap == null) {
                      Toast.makeText(this,"Pehle photo select karo",Toast.LENGTH_SHORT).show();
                      return;
                  }

                  Bitmap out = Bitmap.createBitmap(
                      originalBitmap.getWidth(),
                      originalBitmap.getHeight(),
                      Bitmap.Config.ARGB_8888
                  );

                  Canvas canvas = new Canvas(out);
                  Paint paint = new Paint();

                  ColorMatrix matrix = new ColorMatrix(new float[]{
                      1,0,0,0,25,
                      0,1,0,0,25,
                      0,0,1,0,25,
                      0,0,0,1,0
                  });

                  paint.setColorFilter(new ColorMatrixColorFilter(matrix));
                  canvas.drawBitmap(originalBitmap,0,0,paint);

                  editedBitmap = out;
                  photoView.setImageBitmap(editedBitmap);
              }

              void savePhoto() {
                  if (editedBitmap == null) {
                      Toast.makeText(this,"Pehle photo select karo",Toast.LENGTH_SHORT).show();
                      return;
                  }

                  try {
                      String name =
                          "RCINSTAEDIT_" + System.currentTimeMillis() + ".jpg";

                      android.content.ContentValues values =
                          new android.content.ContentValues();

                      values.put(MediaStore.Images.Media.DISPLAY_NAME,name);
                      values.put(MediaStore.Images.Media.MIME_TYPE,"image/jpeg");

                      Uri uri = getContentResolver().insert(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          values
                      );

                      OutputStream out =
                          getContentResolver().openOutputStream(uri);

                      editedBitmap.compress(
                          Bitmap.CompressFormat.JPEG,
                          95,
                          out
                      );

                      out.close();

                      Toast.makeText(
                          this,
                          "Photo save ho gayi ✅",
                          Toast.LENGTH_LONG
                      ).show();

                  } catch(Exception e) {
                      Toast.makeText(
                          this,
                          "Save failed",
                          Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              void showVideoEditor() {
                  base();

                  root.addView(header("VIDEO EDITOR"));

                  Button choose = button("🎬  SELECT VIDEO FROM PHONE");
                  root.addView(choose, params());

                  videoView = new VideoView(this);
                  videoView.setBackgroundColor(Color.BLACK);

                  root.addView(
                      videoView,
                      new LinearLayout.LayoutParams(-1,0,1)
                  );

                  Button play = button("▶  PLAY / PAUSE");
                  root.addView(play, params());

                  TextView note = text(
                      "Video preview ready. Advanced trimming, filters and transitions will be added in the next build.",
                      14, gray
                  );
                  note.setGravity(Gravity.CENTER);
                  root.addView(note, new LinearLayout.LayoutParams(-1,100));

                  choose.setOnClickListener(v -> pickVideo());

                  play.setOnClickListener(v -> {
                      if (videoView.isPlaying()) {
                          videoView.pause();
                      } else {
                          videoView.start();
                      }
                  });
              }

              void showEffects() {
                  base();

                  root.addView(header("EFFECTS"));

                  TextView title = text(
                      "Choose a photo effect",
                      21, white
                  );
                  root.addView(title);

                  Button bw = button("⚫  BLACK & WHITE");
                  Button bright = button("☀  BRIGHT");
                  Button warm = button("🔥  WARM LOOK");
                  Button cool = button("❄  COOL LOOK");

                  root.addView(bw, params());
                  root.addView(bright, params());
                  root.addView(warm, params());
                  root.addView(cool, params());

                  TextView info = text(
                      "Effects screen is active. Select a photo inside Photo Editor to apply the available effects.",
                      15, gray
                  );
                  info.setGravity(Gravity.CENTER);
                  root.addView(info, new LinearLayout.LayoutParams(-1,180));

                  bw.setOnClickListener(v -> showPhotoEditor());
                  bright.setOnClickListener(v -> showPhotoEditor());
                  warm.setOnClickListener(v -> showPhotoEditor());
                  cool.setOnClickListener(v -> showPhotoEditor());
              }

              void showTransitions() {
                  base();

                  root.addView(header("TRANSITIONS"));

                  TextView title = text(
                      "Reel Transitions",
                      24, white
                  );
                  root.addView(title);

                  String[] names = {
                      "✨  FADE",
                      "➡  SLIDE",
                      "⬆  PUSH",
                      "🔄  ZOOM",
                      "⚡  FLASH"
                  };

                  for (String n : names) {
                      Button b = button(n);
                      root.addView(b, params());

                      b.setOnClickListener(v ->
                          Toast.makeText(
                              this,
                              "Transition selected: " + n,
                              Toast.LENGTH_SHORT
                          ).show()
                      );
                  }

                  TextView info = text(
                      "Multiple-clip transition engine will be connected in the next editing build.",
                      15, gray
                  );
                  info.setGravity(Gravity.CENTER);
                  root.addView(info, new LinearLayout.LayoutParams(-1,180));
              }

              void showExport() {
                  base();

                  root.addView(header("HIGH QUALITY EXPORT"));

                  TextView title = text(
                      "RCINSTAEDIT Export",
                      26, pink
                  );
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView quality = text(
                      "PHOTO EXPORT\\n\\nJPEG Quality: 95%\\n\\nVIDEO EXPORT\\n\\nHigh quality video pipeline ready for the next build.",
                      18, white
                  );
                  quality.setGravity(Gravity.CENTER);
                  root.addView(
                      quality,
                      new LinearLayout.LayoutParams(-1,300)
                  );

                  Button photo = button("🖼  OPEN PHOTO EDITOR");
                  Button video = button("🎬  OPEN VIDEO EDITOR");

                  root.addView(photo, params());
                  root.addView(video, params());

                  photo.setOnClickListener(v -> showPhotoEditor());
                  video.setOnClickListener(v -> showVideoEditor());
              }
          }
          FILE

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
