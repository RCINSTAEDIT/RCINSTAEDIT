name: RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/rcinstaedit/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#0B0B0F</item>
                  <item name="android:navigationBarColor">#0B0B0F</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="RCINSTAEDIT"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/app/MainActivity.java <<'EOF'
          package com.rcinstaedit.app;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.*;
          import android.widget.*;
          import java.io.OutputStream;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              LinearLayout root;
              ImageView image;
              Bitmap original;
              Bitmap edited;

              float brightness = 0;
              float contrast = 1f;
              float saturation = 1f;
              float warmth = 0;

              int BG = Color.rgb(12,12,16);
              int CARD = Color.rgb(30,30,38);

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  home();
              }

              TextView txt(String s, int size) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  t.setPadding(18,14,18,14);
                  return t;
              }

              Button btn(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setBackgroundColor(CARD);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1,60);

                  p.setMargins(12,6,12,6);
                  b.setLayoutParams(p);
                  return b;
              }

              void page() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);
              }

              void home() {
                  page();

                  TextView logo = txt("RCINSTAEDIT",30);
                  logo.setGravity(Gravity.CENTER);
                  root.addView(logo);

                  TextView sub = txt(
                      "PHOTO  •  VIDEO  •  CREATE",14);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  root.addView(txt("CREATE",19));

                  Button photo = btn("📷  Photo Editor");
                  Button video = btn("🎬  Video Editor");
                  Button effects = btn("✨  Filters & Effects");
                  Button trans = btn("↔  Transitions");

                  root.addView(photo);
                  root.addView(video);
                  root.addView(effects);
                  root.addView(trans);

                  photo.setOnClickListener(v -> pick("image/*",10));
                  video.setOnClickListener(v -> pick("video/*",20));
                  effects.setOnClickListener(v -> filters());
                  trans.setOnClickListener(v -> transitions());
              }

              void pick(String type, int code) {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType(type);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i,code);
              }

              @Override
              protected void onActivityResult(
                  int request, int result, Intent data) {

                  super.onActivityResult(request,result,data);

                  if(result != RESULT_OK || data == null) return;

                  Uri uri = data.getData();

                  if(request == 10) {
                      try {
                          original =
                              MediaStore.Images.Media.getBitmap(
                                  getContentResolver(),uri);

                          edited = original.copy(
                              Bitmap.Config.ARGB_8888,true);

                          homePhoto();

                      } catch(Exception e) {
                          toast("Photo open failed");
                      }
                  }

                  if(request == 20) {
                      video(uri);
                  }
              }

              void homePhoto() {
                  page();

                  root.addView(txt("PHOTO EDITOR",25));

                  image = new ImageView(this);
                  image.setImageBitmap(edited);
                  image.setAdjustViewBounds(true);
                  image.setScaleType(
                      ImageView.ScaleType.FIT_CENTER);

                  root.addView(image,
                      new LinearLayout.LayoutParams(-1,420));

                  Button a = btn("🎚  Adjust");
                  Button f = btn("✨  Filters");
                  Button t = btn("✂  Crop / Rotate / Flip");
                  Button r = btn("↶  Reset");
                  Button s = btn("💾  Save Photo");

                  root.addView(a);
                  root.addView(f);
                  root.addView(t);
                  root.addView(r);
                  root.addView(s);

                  a.setOnClickListener(v -> adjust());
                  f.setOnClickListener(v -> filters());
                  t.setOnClickListener(v -> transform());

                  r.setOnClickListener(v -> {
                      brightness=0;
                      contrast=1;
                      saturation=1;
                      warmth=0;
                      edited=original.copy(
                          Bitmap.Config.ARGB_8888,true);
                      image.setImageBitmap(edited);
                  });

                  s.setOnClickListener(v -> save());
              }

              void adjust() {
                  page();

                  root.addView(txt("ADJUST",25));

                  slider("Brightness",-100,100,0,
                      v -> {
                          brightness=v;
                          apply();
                      });

                  slider("Contrast",50,150,100,
                      v -> {
                          contrast=v/100f;
                          apply();
                      });

                  slider("Saturation",0,200,100,
                      v -> {
                          saturation=v/100f;
                          apply();
                      });

                  slider("Warmth",-100,100,0,
                      v -> {
                          warmth=v;
                          apply();
                      });

                  slider("Exposure",-100,100,0,
                      v -> {
                          brightness=v;
                          apply();
                      });

                  slider("Highlights",-100,100,0,v -> {});
                  slider("Shadows",-100,100,0,v -> {});
                  slider("Sharpness",0,100,0,v -> {});
                  slider("Vignette",0,100,0,v -> {});
                  slider("Fade",0,100,0,v -> {});

                  root.addView(back());
              }

              interface Change {
                  void value(int v);
              }

              void slider(
                  String name,
                  int min,
                  int max,
                  int start,
                  Change change) {

                  root.addView(txt(name,15));

                  SeekBar bar = new SeekBar(this);
                  bar.setMax(max-min);
                  bar.setProgress(start-min);
                  bar.setTag(min);

                  bar.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {

                          public void onProgressChanged(
                              SeekBar s,int p,boolean user) {

                              int m = (Integer)s.getTag();
                              change.value(p+m);
                          }

                          public void onStartTrackingTouch(
                              SeekBar s) {}

                          public void onStopTrackingTouch(
                              SeekBar s) {}
                      });

                  root.addView(bar);
              }

              void apply() {

                  if(original == null) return;

                  ColorMatrix cm = new ColorMatrix();

                  ColorMatrix sat = new ColorMatrix();
                  sat.setSaturation(saturation);
                  cm.postConcat(sat);

                  float c = contrast;
                  float b = brightness;
                  float shift = 128*(1-c)+b;

                  ColorMatrix con = new ColorMatrix(
                      new float[] {
                          c,0,0,0,shift,
                          0,c,0,0,shift,
                          0,0,c,0,shift,
                          0,0,0,1,0
                      });

                  cm.postConcat(con);

                  float w = warmth;

                  ColorMatrix warm = new ColorMatrix(
                      new float[] {
                          1,0,0,0,w,
                          0,1,0,0,0,
                          0,0,1,0,-w,
                          0,0,0,1,0
                      });

                  cm.postConcat(warm);

                  edited = Bitmap.createBitmap(
                      original.getWidth(),
                      original.getHeight(),
                      Bitmap.Config.ARGB_8888);

                  Canvas cvas = new Canvas(edited);
                  Paint p = new Paint();

                  p.setColorFilter(
                      new ColorMatrixColorFilter(cm));

                  cvas.drawBitmap(original,0,0,p);
                  image.setImageBitmap(edited);
              }

              void filters() {
                  page();

                  root.addView(txt(
                      "FILTERS & EFFECTS",25));

                  String[] names = {
                      "Original",
                      "Black & White",
                      "Cinematic",
                      "Vintage",
                      "Cool",
                      "Warm",
                      "Dramatic",
                      "Fade",
                      "Glow",
                      "HDR Style"
                  };

                  for(String n:names) {
                      Button b=btn(n);
                      root.addView(b);
                      b.setOnClickListener(
                          v -> filter(n));
                  }

                  root.addView(back());
              }

              void filter(String name) {

                  if(original == null) return;

                  ColorMatrix cm = new ColorMatrix();

                  if(name.equals("Black & White"))
                      cm.setSaturation(0);

                  else if(name.equals("Cool"))
                      cm.set(new float[]{
                          1,0,0,0,-5,
                          0,1,0,0,0,
                          0,0,1,0,18,
                          0,0,0,1,0});

                  else if(name.equals("Warm"))
                      cm.set(new float[]{
                          1,0,0,0,18,
                          0,1,0,0,5,
                          0,0,1,0,-8,
                          0,0,0,1,0});

                  else if(name.equals("Vintage"))
                      cm.set(new float[]{
                          .9f,0,0,0,20,
                          0,.84f,0,0,15,
                          0,0,.72f,0,5,
                          0,0,0,1,0});

                  else if(name.equals("Dramatic"))
                      cm.set(new float[]{
                          1.25f,0,0,0,-30,
                          0,1.25f,0,0,-30,
                          0,0,1.25f,0,-30,
                          0,0,0,1,0});

                  else if(name.equals("Fade"))
                      cm.set(new float[]{
                          .85f,0,0,0,25,
                          0,.85f,0,0,25,
                          0,0,.85f,0,25,
                          0,0,0,1,0});

                  edited = Bitmap.createBitmap(
                      original.getWidth(),
                      original.getHeight(),
                      Bitmap.Config.ARGB_8888);

                  Canvas c = new Canvas(edited);
                  Paint p = new Paint();

                  p.setColorFilter(
                      new ColorMatrixColorFilter(cm));

                  c.drawBitmap(original,0,0,p);

                  if(image != null)
                      image.setImageBitmap(edited);
              }

              void transform() {
                  page();

                  root.addView(txt(
                      "TRANSFORM",25));

                  Button rotate=btn("↻  Rotate 90°");
                  Button fh=btn("↔  Flip Horizontal");
                  Button fv=btn("↕  Flip Vertical");
                  Button crop=btn("✂  Crop");

                  root.addView(rotate);
                  root.addView(fh);
                  root.addView(fv);
                  root.addView(crop);
                  root.addView(back());

                  rotate.setOnClickListener(
                      v -> rotate());

                  fh.setOnClickListener(
                      v -> flip(true));

                  fv.setOnClickListener(
                      v -> flip(false));

                  crop.setOnClickListener(
                      v -> toast(
                          "Crop engine next stage mein"));
              }

              void rotate() {
                  Matrix m=new Matrix();
                  m.postRotate(90);

                  edited=Bitmap.createBitmap(
                      edited,0,0,
                      edited.getWidth(),
                      edited.getHeight(),
                      m,true);

                  image.setImageBitmap(edited);
              }

              void flip(boolean horizontal) {
                  Matrix m=new Matrix();

                  if(horizontal)
                      m.setScale(-1,1);
                  else
                      m.setScale(1,-1);

                  edited=Bitmap.createBitmap(
                      edited,0,0,
                      edited.getWidth(),
                      edited.getHeight(),
                      m,true);

                  image.setImageBitmap(edited);
              }

              void save() {
                  try {
                      ContentValues v=new ContentValues();

                      v.put(
                          MediaStore.Images.Media.DISPLAY_NAME,
                          "RCINSTAEDIT_"+
                          System.currentTimeMillis()+".jpg");

                      v.put(
                          MediaStore.Images.Media.MIME_TYPE,
                          "image/jpeg");

                      if(Build.VERSION.SDK_INT>=29)
                          v.put(
                              MediaStore.Images.Media.RELATIVE_PATH,
                              "Pictures/RCINSTAEDIT");

                      Uri u=getContentResolver().insert(
                          MediaStore.Images.Media
                              .EXTERNAL_CONTENT_URI,v);

                      OutputStream out=
                          getContentResolver()
                              .openOutputStream(u);

                      edited.compress(
                          Bitmap.CompressFormat.JPEG,
                          95,out);

                      out.close();

                      toast("Photo saved ✓");

                  } catch(Exception e) {
                      toast("Save failed");
                  }
              }

              void video(Uri uri) {
                  page();

                  root.addView(
                      txt("VIDEO EDITOR",25));

                  VideoView vv=new VideoView(this);
                  vv.setVideoURI(uri);

                  MediaController mc=
                      new MediaController(this);

                  vv.setMediaController(mc);
                  mc.setAnchorView(vv);

                  root.addView(vv,
                      new LinearLayout.LayoutParams(-1,420));

                  vv.start();

                  String[] tools={
                      "✂  Trim",
                      "✂  Split",
                      "⚡  Speed",
                      "▣  Crop",
                      "↻  Rotate",
                      "↔  Reverse",
                      "✨  Filters",
                      "🎚  Adjust",
                      "↔  Transitions",
                      "🎬  Export 1080p"
                  };

                  for(String n:tools) {
                      Button b=btn(n);
                      root.addView(b);
                      b.setOnClickListener(
                          v -> videoTool(n));
                  }

                  root.addView(back());
              }

              void videoTool(String name) {
                  new AlertDialog.Builder(this)
                      .setTitle(name)
                      .setMessage(
                          name+
                          " selected.\n\n"+
                          "Actual video processing engine next stage mein connect hoga.")
                      .setPositiveButton("OK",null)
                      .show();
              }

              void transitions() {
                  page();

                  root.addView(
                      txt("TRANSITIONS",25));

                  String[] a={
                      "Fade",
                      "Slide Left",
                      "Slide Right",
                      "Zoom",
                      "Flash",
                      "Blur",
                      "Wipe"
                  };

                  for(String n:a) {
                      Button b=btn(n);
                      root.addView(b);
                      b.setOnClickListener(
                          v -> toast(
                              n+" selected"));
                  }

                  root.addView(back());
              }

              Button back() {
                  Button b=btn("←  Back");
                  b.setOnClickListener(
                      v -> home());
                  return b;
              }

              void toast(String s) {
                  Toast.makeText(
                      this,s,
                      Toast.LENGTH_SHORT).show();
              }
          }
          EOF

      - name: Build
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
