name: RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf app build .gradle gradle
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/rcinstaedit
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "4.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0E0F14</item>
                  <item name="android:navigationBarColor">#0E0F14</item>
                  <item name="android:colorAccent">#7C4DFF</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="RCINSTAEDIT"
                  android:theme="@style/AppTheme"
                  android:enableOnBackInvokedCallback="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/MainActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.content.ContentValues;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.window.OnBackInvokedCallback;
          import android.window.OnBackInvokedDispatcher;

          import java.io.OutputStream;
          import java.util.ArrayDeque;

          public class MainActivity extends Activity {

              private static final int PICK_IMAGE = 1001;
              private static final int PICK_AUDIO = 1002;

              private final ArrayDeque<String> screenStack =
                      new ArrayDeque<>();

              private String currentScreen = "home";

              private Bitmap originalBitmap;
              private Bitmap editedBitmap;

              private ImageView previewImage;

              private float zoom = 1f;
              private float dragX = 0f;
              private float dragY = 0f;
              private float lastX;
              private float lastY;

              private boolean beforePressed = false;

              private String selectedFilter = "Original";
              private int filterIntensity = 100;

              private int brightness = 0;
              private int exposure = 0;
              private int contrast = 0;
              private int saturation = 0;
              private int temperature = 0;
              private int fade = 0;

              interface SliderCallback {
                  void onChanged(int value);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(
                          Color.rgb(14, 15, 20)
                  );
                  window.setNavigationBarColor(
                          Color.rgb(14, 15, 20)
                  );

                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher()
                              .registerOnBackInvokedCallback(
                                      OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                                      new OnBackInvokedCallback() {
                                          @Override
                                          public void onBackInvoked() {
                                              goBack();
                                          }
                                      }
                              );
                  }

                  renderScreen();
              }

              @Override
              public void onBackPressed() {
                  if (Build.VERSION.SDK_INT < 33) {
                      goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private void goBack() {
                  if (!screenStack.isEmpty()) {
                      currentScreen = screenStack.pop();
                      renderScreen();
                  } else {
                      finish();
                  }
              }

              private void openScreen(String screen) {
                  screenStack.push(currentScreen);
                  currentScreen = screen;
                  renderScreen();
              }

              private void renderScreen() {

                  if ("home".equals(currentScreen)) {
                      showHome();

                  } else if ("photo".equals(currentScreen)) {
                      showPhotoEditor();

                  } else if ("filters".equals(currentScreen)) {
                      showFilters();

                  } else if ("adjust".equals(currentScreen)) {
                      showAdjust();
                  }
              }

              private void showHome() {

                  LinearLayout root = baseColumn();

                  TextView logo =
                          text(
                                  "RCINSTAEDIT",
                                  30,
                                  Color.WHITE
                          );

                  logo.setGravity(Gravity.CENTER);

                  root.addView(
                          logo,
                          lp(-1, 70)
                  );

                  TextView sub =
                          text(
                                  "Photo & Reel Editor",
                                  16,
                                  Color.LTGRAY
                          );

                  sub.setGravity(Gravity.CENTER);

                  root.addView(
                          sub,
                          lp(-1, 45)
                  );

                  addSpace(root, 18);

                  addTool(
                          root,
                          "📷  PHOTO EDITOR",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  openScreen("photo");
                              }
                          }
                  );

                  addTool(
                          root,
                          "🎬  VIDEO EDITOR",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  toast(
                                          "Video editor next stage mein"
                                  );
                              }
                          }
                  );

                  addTool(
                          root,
                          "🎵  ADD AUDIO FROM PHONE",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  pickAudio();
                              }
                          }
                  );

                  addTool(
                          root,
                          "✨  HIGH QUALITY EXPORT",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  toast(
                                          "Photo Editor → Save Photo use karo"
