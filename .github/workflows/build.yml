name: RCINSTAEDIT Full Editor

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/rcinstaedit
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit'
                  minSdk 23
                  targetSdk 35
                  versionCode 10
                  versionName '1.1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">RCINSTAEDIT</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#08080D</item>
                  <item name="android:navigationBarColor">#08080D</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="RCINSTAEDIT"
                  android:theme="@style/AppTheme"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".VideoEditorActivity"
                      android:screenOrientation="portrait"
                      android:exported="false" />

                  <activity
                      android:name=".PhotoEditorActivity"
                      android:screenOrientation="portrait"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/MainActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Insets;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowInsets;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              int dp(int n) {
                  return (int)(
                      n * getResources()
                          .getDisplayMetrics().density + .5f
                  );
              }

              TextView tv(
                      String s,
                      float size,
                      int color
              ) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  t.setIncludeFontPadding(true);
                  return t;
              }

              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  home();
              }

              void home() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(8,8,13));
                  setContentView(root);

                  if (Build.VERSION.SDK_INT >= 30) {
                      root.setOnApplyWindowInsetsListener((v,i) -> {
                          Insets x = i.getInsets(
                              WindowInsets.Type.systemBars()
                          );
                          v.setPadding(0,x.top,0,x.bottom);
                          return i;
                      });
                  }

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(
                      dp(16),dp(16),dp(16),dp(28)
                  );

                  scroll.addView(box);

                  root.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,0,1
                      )
                  );

                  TextView title =
                      tv("RCINSTAEDIT",28,Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(null,1);

                  box.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          -1,dp(64)
                      )
                  );

                  TextView sub =
                      tv(
                          "Edit • Create • Inspire",
                          15,
                          Color.rgb(180,155,255)
                      );
                  sub.setGravity(Gravity.CENTER);

                  box.addView(
                      sub,
                      new LinearLayout.LayoutParams(
                          -1,dp(42)
                      )
                  );

                  section(box,"EDITORS");

                  card(
                      box,
                      "📷  PHOTO EDITOR",
                      "Adjust • Filters • Crop • Tools",
                      v -> startActivity(
                          new Intent(
                              this,
                              PhotoEditorActivity.class
                          )
                      )
                  );

                  card(
                      box,
                      "🎬  VIDEO EDITOR",
                      "Trim • Speed • Audio • Timeline",
                      v -> startActivity(
                          new Intent(
                              this,
                              VideoEditorActivity.class
                          )
                      )
                  );

                  section(box,"TOOLS");

                  card(
                      box,
                      "✨  EFFECTS",
                      "Creative video & photo effects",
                      v -> toast(
                          "Effects next stage mein"
                      )
                  );

                  card(
                      box,
                      "🔀  TRANSITIONS",
                      "Smooth reel transitions",
                      v -> toast(
                          "Transitions next stage mein"
                      )
                  );

                  card(
                      box,
                      "🎵  ADD AUDIO FROM PHONE",
                      "Add music/audio to your project",
                      v -> toast(
                          "Audio tool video editor mein available hai"
                      )
                  );

                  card(
                      box,
                      "💾  HIGH QUALITY EXPORT",
                      "High quality photo & video export",
                      v -> toast(
                          "Export editor ke andar available hai"
                      )
                  );
              }

              void section(
                      LinearLayout p,
                      String s
              ) {

                  TextView t =
                      tv(
                          s,
                          14,
                          Color.rgb(180,155,255)
                      );

                  t.setTypeface(null,1);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  t.setPadding(
                      0,dp(5),0,dp(5)
                  );

                  LinearLayout.LayoutParams q =
                      new LinearLayout.LayoutParams(
                          -1,dp(52)
                      );

                  q.setMargins(
                      0,dp(18),0,dp(5)
                  );

                  p.addView(t,q);
              }

              void card(
                      LinearLayout p,
                      String a,
                      String b,
                      View.OnClickListener click
              ) {

                  LinearLayout c =
                      new LinearLayout(this);

                  c.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  c.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  c.setPadding(
                      dp(18),dp(8),
                      dp(18),dp(8)
                  );

                  c.setBackgroundColor(
                      Color.rgb(20,19,27)
                  );

                  TextView x =
                      tv(a,17,Color.WHITE);
                  x.setTypeface(null,1);

                  TextView y =
                      tv(
                          b,
                          13,
                          Color.rgb(190,190,200)
                      );

                  y.setMaxLines(2);

                  c.addView(
                      x,
                      new LinearLayout.LayoutParams(
                          -1,dp(34)
                      )
                  );

                  c.addView(
                      y,
                      new LinearLayout.LayoutParams(
                          -1,dp(40)
                      )
                  );

                  c.setOnClickListener(click);

                  LinearLayout.LayoutParams q =
                      new LinearLayout.LayoutParams(
                          -1,dp(88)
                      );

                  q.setMargins(
                      0,dp(6),0,dp(6)
                  );

                  p.addView(c,q);
              }

              void toast(String s) {
                  Toast.makeText(
                      this,
                      s,
                      Toast.LENGTH_SHORT
                  ).show();
              }
          }
          EOF

          cat > app/src/main/java/com/rcinstaedit/PhotoEditorActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.util.*;

          public class PhotoEditorActivity extends Activity {

              LinearLayout root,controls;
              ImageView preview;
              Uri uri;
              Bitmap original;

              Handler h =
                  new Handler(Looper.getMainLooper());

              Runnable pending;

              float[] vals = new float[17];

              int filter = 0;
              int filterIntensity = 100;

              ArrayDeque<EditState> undo =
                  new ArrayDeque<>();

              ArrayDeque<EditState> redo =
                  new ArrayDeque<>();

              boolean showingBefore = false;

              final String[] names = {
                  "Brightness",
                  "Exposure",
                  "Brilliance",
                  "Contrast",
                  "Highlights",
                  "Shadows",
                  "Black Point",
                  "Saturation",
                  "Vibrance",
                  "Warmth",
                  "Tint",
                  "Hue",
                  "Sharpness",
                  "Definition",
                  "Noise Reduction",
                  "Fade",
                  "Vignette"
              };

              int dp(int n) {
                  return (int)(
                      n *
                      getResources()
                          .getDisplayMetrics().density
                      + .5f
                  );
              }

              TextView tv(
                      String s,
                      float z,
                      int c
              ) {
                  TextView t =
                      new TextView(this);
                  t.setText(s);
                  t.setTextSize(z);
                  t.setTextColor(c);
                  t.setGravity(
                      Gravity.CENTER_VERTICAL
                  );
                  t.setIncludeFontPadding(true);
                  return t;
              }

              Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  return b;
              }

              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  build();
              }

              void build() {

                  root =
                      new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                      Color.rgb(8,8,13)
                  );

                  setContentView(root);

                  if (Build.VERSION.SDK_INT >= 30) {
                      root.setOnApplyWindowInsetsListener(
                          (v,i) -> {
                              Insets x =
                                  i.getInsets(
                                      WindowInsets.Type.systemBars()
                                  );
                              v.setPadding(
                                  0,x.top,0,x.bottom
                              );
                              return i;
                          }
                      );
                  }

                  LinearLayout top =
                      new LinearLayout(this);

                  top.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  Button back =
                      button("‹ Back");

                  back.setOnClickListener(
                      v -> finish()
                  );

                  top.addView(
                      back,
                      new LinearLayout.LayoutParams(
                          dp(84),dp(54)
                      )
                  );

                  TextView title =
                      tv(
                          "Photo Editor",
                          20,
                          Color.WHITE
                      );

                  title.setTypeface(null,1);

                  top.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          0,dp(54),1
                      )
                  );

                  root.addView(top);

                  Button choose =
                      button(
                          "📷  CHOOSE PHOTO"
                      );

                  choose.setId(9001);

                  choose.setOnClickListener(
                      v -> choosePhoto()
                  );

                  root.addView(
                      choose,
                      new LinearLayout.LayoutParams(
                          -1,dp(52)
                      )
                  );

                  /*
                   * FIXED PREVIEW
                   * ScrollView ke bahar hai.
                   */
                  preview =
                      new ImageView(this);

                  preview.setBackgroundColor(
                      Color.BLACK
                  );

                  preview.setScaleType(
                      ImageView.ScaleType.FIT_CENTER
                  );

                  root.addView(
                      preview,
                      new LinearLayout.LayoutParams(
                          -1,dp(270)
                      )
                  );

                  LinearLayout bar =
                      new LinearLayout(this);

                  bar.setGravity(
                      Gravity.CENTER
                  );

                  Button undoB =
                      button("↶");

                  undoB.setOnClickListener(
                      v -> undo()
                  );

                  Button redoB =
                      button("↷");

                  redoB.setOnClickListener(
                      v -> redo()
                  );

                  Button before =
                      button("BEFORE");

                  before.setOnClickListener(
                      v -> beforeAfter()
                  );

                  Button reset =
                      button("RESET");

                  reset.setOnClickListener(
                      v -> reset()
                  );

                  bar.addView(
                      undoB,
                      new LinearLayout.LayoutParams(
                          0,dp(48),1
                      )
                  );

                  bar.addView(
                      redoB,
                      new LinearLayout.LayoutParams(
                          0,dp(48),1
                      )
                  );

                  bar.addView(
                      before,
                      new LinearLayout.LayoutParams(
                          0,dp(48),1
                      )
                  );

                  bar.addView(
                      reset,
                      new LinearLayout.LayoutParams(
                          0,dp(48),1
                      )
                  );

                  root.addView(bar);

                  ScrollView sc =
                      new ScrollView(this);

                  controls =
                      new LinearLayout(this);

                  controls.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  controls.setPadding(
                      dp(16),dp(5),
                      dp(16),dp(24)
                  );

                  sc.addView(controls);

                  root.addView(
                      sc,
                      new LinearLayout.LayoutParams(
                          -1,0,1
                      )
                  );

                  section("LIGHT");

                  for(int i=0;i<=6;i++)
                      addSlider(i,-100,100);

                  section("COLOR");

                  for(int i=7;i<=11;i++)
                      addSlider(i,-100,100);

                  section("DETAIL");

                  addSlider(12,0,100);
                  addSlider(13,0,100);
                  addSlider(14,0,100);

                  section("EFFECTS");

                  addSlider(15,0,100);
                  addSlider(16,0,100);

                  section("FILTERS");

                  addFilters();

                  Button crop =
                      button(
                          "✂  CENTER CROP"
                      );

                  crop.setOnClickListener(
                      v -> crop()
                  );

                  controls.addView(
                      crop,
                      new LinearLayout.LayoutParams(
                          -1,dp(52)
                      )
                  );

                  Button rot =
                      button(
                          "⟳  ROTATE 90°"
                      );

                  rot.setOnClickListener(
                      v -> rotate()
                  );

                  controls.addView(
                      rot,
                      new LinearLayout.LayoutParams(
                          -1,dp(52)
                      )
                  );

                  Button flip =
                      button(
                          "↔  FLIP HORIZONTAL"
                      );

                  flip.setOnClickListener(
                      v -> flip()
                  );

                  controls.addView(
                      flip,
                      new LinearLayout.LayoutParams(
                          -1,dp(52)
                      )
                  );

                  Button save =
                      button(
                          "💾  SAVE PHOTO"
                      );

                  save.setOnClickListener(
                      v -> save()
                  );

                  controls.addView(
                      save,
                      new LinearLayout.LayoutParams(
                          -1,dp(58)
                      )
                  );
              }

              void section(String s) {

                  TextView t =
                      tv(
                          s,
                          14,
                          Color.rgb(180,155,255)
                      );

                  t.setTypeface(null,1);
                  t.setGravity(
                      Gravity.CENTER_VERTICAL
                  );
                  t.setIncludeFontPadding(true);
                  t.setPadding(
                      0,dp(5),0,dp(5)
                  );

                  LinearLayout.LayoutParams q =
                      new LinearLayout.LayoutParams(
                          -1,dp(54)
                      );

                  q.setMargins(
                      0,dp(12),0,dp(3)
                  );

                  controls.addView(t,q);
              }

              void addSlider(
                      int index,
                      int min,
                      int max
              ) {

                  LinearLayout row =
                      new LinearLayout(this);

                  row.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  TextView label =
                      tv(
                          names[index]
                              + "  "
                              + Math.round(vals[index]),
                          14,
                          Color.WHITE
                      );

                  SeekBar seek =
                      new SeekBar(this);

                  seek.setMax(max-min);

                  seek.setProgress(
                      (int)vals[index]-min
                  );

                  seek.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener(){

                          public void onProgressChanged(
                                  SeekBar b,
                                  int p,
                                  boolean user
                          ) {

                              vals[index] =
                                  p+min;

                              label.setText(
                                  names[index]
                                      + "  "
                                      + Math.round(
                                          vals[index]
                                      )
                              );

                              scheduleRender();
                          }

                          public void onStartTrackingTouch(
                                  SeekBar b
                          ) {}

                          public void onStopTrackingTouch(
                                  SeekBar b
                          ) {
                              pushUndo();
                          }
                      }
                  );

                  row.addView(
                      label,
                      new LinearLayout.LayoutParams(
                          -1,dp(32)
                      )
                  );

                  row.addView(
                      seek,
                      new LinearLayout.LayoutParams(
                          -1,dp(46)
                      )
                  );

                  controls.addView(row);
              }

              void addFilters() {

                  String[] f = {
                      "Original",
                      "Vivid",
                      "Vivid Warm",
                      "Vivid Cool",
                      "Dramatic",
                      "Dramatic Warm",
                      "Dramatic Cool",
                      "Mono",
                      "Silvertone",
                      "Noir",
                      "Warm",
                      "Cool",
                      "Fade"
                  };

                  for(int i=0;i<f.length;i++){

                      final int k=i;

                      Button b =
                          button(f[i]);

                      b.setOnClickListener(
                          v -> {
                              pushUndo();
                              filter=k;
                              scheduleRender();
                          }
                      );

                      controls.addView(
                          b,
                          new LinearLayout.LayoutParams(
                              -1,dp(48)
                          )
                      );
                  }

                  TextView lab =
                      tv(
                          "Filter Intensity  "
                              + filterIntensity,
                          14,
                          Color.WHITE
                      );

                  SeekBar sb =
                      new SeekBar(this);

                  sb.setMax(100);
                  sb.setProgress(100);

                  sb.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener(){

                          public void onProgressChanged(
                                  SeekBar b,
                                  int p,
                                  boolean user
                          ) {

                              filterIntensity=p;

                              lab.setText(
                                  "Filter Intensity  "
                                      + p
                              );

                              scheduleRender();
                          }

                          public void onStartTrackingTouch(
                                  SeekBar b
                          ) {}

                          public void onStopTrackingTouch(
                                  SeekBar b
                          ) {
                              pushUndo();
                          }
                      }
                  );

                  controls.addView(
                      lab,
                      new LinearLayout.LayoutParams(
                          -1,dp(32)
                      )
                  );

                  controls.addView(
                      sb,
                      new LinearLayout.LayoutParams(
                          -1,dp(46)
                      )
                  );
              }

              void choosePhoto(){

                  Intent i =
                      new Intent(
                          Intent.ACTION_OPEN_DOCUMENT
                      );

                  i.setType("image/*");

                  i.addCategory(
                      Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(i,100);
              }

              protected void onActivityResult(
                      int r,
                      int c,
                      Intent d
              ){

                  super.onActivityResult(
                      r,c,d
                  );

                  if(
                      r==100 &&
                      c==RESULT_OK &&
                      d!=null &&
                      d.getData()!=null
                  ){

                      uri=d.getData();
                      load();
                  }
              }

              void load(){

                  try{

                      BitmapFactory.Options o =
                          new BitmapFactory.Options();

                      o.inJustDecodeBounds=true;

                      InputStream a =
                          getContentResolver()
                              .openInputStream(uri);

                      BitmapFactory.decodeStream(
                          a,null,o
                      );

                      if(a!=null)a.close();

                      int longest =
                          Math.max(
                              o.outWidth,
                              o.outHeight
                          );

                      int sample=1;

                      while(
                          longest/sample>1600
                      )
                          sample*=2;

                      o =
                          new BitmapFactory.Options();

                      o.inSampleSize=sample;
                      o.inPreferredConfig =
                          Bitmap.Config.ARGB_8888;

                      InputStream b =
                          getContentResolver()
                              .openInputStream(uri);

                      original =
                          BitmapFactory.decodeStream(
                              b,null,o
                          );

                      if(b!=null)b.close();

                      Arrays.fill(vals,0);

                      filter=0;
                      filterIntensity=100;

                      undo.clear();
                      redo.clear();

                      showingBefore=false;

                      render();

                      Button x =
                          findViewById(9001);

                      if(x!=null)
                          x.setText(
                              "🔄  CHANGE PHOTO"
                          );

                      toast("Photo loaded");

                  }catch(Exception e){

                      toast(
                          "Photo load failed"
                      );
                  }
              }

              void pushUndo(){

                  if(original==null)return;

                  undo.push(
                      new EditState(
                          vals.clone(),
                          filter,
                          filterIntensity
                      )
                  );

                  while(undo.size()>15)
                      undo.removeLast();

                  redo.clear();
              }

              void undo(){

                  if(undo.isEmpty())return;

                  redo.push(
                      new EditState(
                          vals.clone(),
                          filter,
                          filterIntensity
                      )
                  );

                  restore(undo.pop());
              }

              void redo(){

                  if(redo.isEmpty())return;

                  undo.push(
                      new EditState(
                          vals.clone(),
                          filter,
                          filterIntensity
                      )
                  );

                  restore(redo.pop());
              }

              void restore(EditState s){

                  vals=s.v.clone();
                  filter=s.filter;
                  filterIntensity=s.intensity;
                  showingBefore=false;

                  render();
              }

              void reset(){

                  if(original==null)return;

                  pushUndo();

                  Arrays.fill(vals,0);

                  filter=0;
                  filterIntensity=100;

                  render();
              }

              void beforeAfter(){

                  if(original==null)return;

                  showingBefore=!showingBefore;

                  if(showingBefore){

                      preview.clearColorFilter();
                      preview.setImageBitmap(
                          original
                      );

                  }else{

                      render();
                  }
              }

              void scheduleRender(){

                  if(
                      original==null ||
                      showingBefore
                  )
                      return;

                  if(pending!=null)
                      h.removeCallbacks(
                          pending
                      );

                  pending=this::render;

                  h.postDelayed(
                      pending,
                      55
                  );
              }

              void render(){

                  if(original==null)return;

                  ColorMatrix cm =
                      buildMatrix();

                  preview.setImageBitmap(
                      original
                  );

                  preview.setColorFilter(
                      new ColorMatrixColorFilter(cm)
                  );
              }

              ColorMatrix buildMatrix(){

                  ColorMatrix cm =
                      new ColorMatrix();

                  float brightness =
                      vals[0]*2.2f
                      +vals[1]*1.8f
                      +vals[2]*1.2f;

                  float contrast =
                      1f+vals[3]/100f;

                  float saturation =
                      Math.max(
                          0,
                          1f
                          +vals[7]/100f
                          +vals[8]/200f
                      );

                  cm.setSaturation(
