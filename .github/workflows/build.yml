                  preview.setColorFilter(
                          new ColorMatrixColorFilter(
                                  matrix()
                          )
                  );
              }

              ColorMatrix matrix() {

                  ColorMatrix m =
                          new ColorMatrix();

                  float brightness =
                          values[0] * 2.2f
                          + values[1] * 1.8f
                          + values[2] * 1.2f;

                  float contrast =
                          1f
                          + values[3] / 100f;

                  float saturation =
                          Math.max(
                                  0f,
                                  1f
                                  + values[7] / 100f
                                  + values[8] / 200f
                          );

                  m.setSaturation(
                          saturation
                  );

                  m.postConcat(
                          new ColorMatrix(
                                  new float[]{

                                          contrast,0,0,0,brightness,
                                          0,contrast,0,0,brightness,
                                          0,0,contrast,0,brightness,
                                          0,0,0,1,0
                                  }
                          )
                  );

                  float warm =
                          values[9] * 0.55f;

                  float tint =
                          values[10] * 0.35f;

                  m.postConcat(
                          new ColorMatrix(
                                  new float[]{

                                          1,0,0,0,
                                          warm + tint,

                                          0,1,0,0,0,

                                          0,0,1,0,
                                          -warm + tint,

                                          0,0,0,1,0
                                  }
                          )
                  );

                  if (values[15] > 0) {

                      float fade =
                              values[15] / 100f;

                      m.postConcat(
                              new ColorMatrix(
                                      new float[]{

                                              1-fade,0,0,0,
                                              128*fade,

                                              0,1-fade,0,0,
                                              128*fade,

                                              0,0,1-fade,0,
                                              128*fade,

                                              0,0,0,1,0
                                      }
                              )
                      );
                  }

                  ColorMatrix f =
                          filterMatrix(
                                  filter
                          );

                  float amount =
                          intensity / 100f;

                  if (
                          filter != 0
                          && amount < 1f
                  ) {

                      float[] a =
                              f.getArray();

                      for (
                              int i = 0;
                              i < 20;
                              i++
                      ) {

                          float id =
                                  (i % 6 == 0)
                                          ? 1f
                                          : 0f;

                          a[i] =
                                  id
                                  + (
                                          a[i]
                                          - id
                                  ) * amount;
                      }

                      f.set(a);
                  }

                  m.postConcat(f);

                  return m;
              }

