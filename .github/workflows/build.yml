                  SeekBar seek =
                          new SeekBar(this);

                  seek.setMax(
                          max - min
                  );

                  seek.setProgress(
                          (int)values[index] - min
                  );

                  seek.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar bar,
                                      int progress,
                                      boolean fromUser
                              ) {

                                  values[index] =
                                          progress + min;

                                  label.setText(
                                          names[index]
                                                  + "  "
                                                  + Math.round(
                                                          values[index]
                                                  )
                                  );

                                  scheduleRender();
                              }

                              public void onStartTrackingTouch(
                                      SeekBar bar
                              ) {

                                  pushUndo();
                              }

                              public void onStopTrackingTouch(
                                      SeekBar bar
                              ) {
                              }
                          }
                  );

                  row.addView(
                          label,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(32)
