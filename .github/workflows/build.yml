          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/rcinstaedit/MainActivity.java

          echo "Project verification passed."

