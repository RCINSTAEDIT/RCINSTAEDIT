                              speedButton,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(46)
                              )
                      );
                  }

                  section("TOOLS");

                  Button rotate =
                          button(
                                  "⟳  ROTATE 90°"
                          );

                  rotate.setOnClickListener(
                          v -> toast(
                                  "Rotation export next stage mein"
                          )
                  );

                  controls.addView(
                          rotate,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(50)
                          )
                  );

                  Button export =
                          button(
                                  "💾  EXPORT VIDEO"
                          );

                  export.setOnClickListener(
                          v -> exportVideo()
                  );

                  controls.addView(
                          export,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(58)
                          )
                  );
              }

              String speedName(float s) {

                  if (s == 1.0f) {

                      return "1×  NORMAL";
                  }

                  return s + "×";
              }

              void section(String s) {

                  TextView t =
                          text(
                                  s,
                                  14,
                                  Color.rgb(
                                          180,
                                          155,
                                          255
                                  )
                          );

                  t.setTypeface(
                          null,
                          1
                  );

                  t.setPadding(
                          0,
                          dp(5),
                          0,
                          dp(5)
                  );

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52)
                          );

                  p.setMargins(
                          0,
                          dp(12),
                          0,
                          dp(3)
                  );

                  controls.addView(
                          t,
                          p
                  );
              }

              void chooseVideo() {

                  Intent i =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                          );

                  i.setType(
                          "video/*"
                  );

                  i.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          i,
                          200
                  );
              }

              @Override
              protected void onActivityResult(
                      int request,
                      int result,
                      Intent data
              ) {

                  super.onActivityResult(
                          request,
                          result,
                          data
                  );

                  if (
                          request == 200
                          && result == RESULT_OK
                          && data != null
                          && data.getData() != null
                  ) {

                      videoUri =
                              data.getData();

                      video.setVideoURI(
                              videoUri
                      );

                      video.setOnPreparedListener(
                              mp -> {

                                  duration =
                                          video.getDuration();

                                  timeline.setProgress(0);

                                  video.seekTo(1);

                                  toast(
                                          "Video loaded"
                                  );
                              }
                      );
                  }
              }

              void setSpeed(
                      float value
              ) {

                  speed = value;

                  if (
                          Build.VERSION.SDK_INT >= 23
                  ) {

                      try {

                          android.media.PlaybackParams params =
                                  video.getPlaybackParams();

                          params.setSpeed(
                                  value
                          );

                          video.setPlaybackParams(
                                  params
                          );

                      } catch (Exception e) {

                          toast(
                                  "Speed preview unavailable"
                          );
                      }
                  }
              }

              void exportVideo() {

                  if (videoUri == null) {

                      toast(
                              "Pehle video choose karo"
                      );

                      return;
                  }

                  if (duration <= 0) {

                      toast(
                              "Video ready nahi hai"
                      );

                      return;
                  }

                  toast(
                          "Exporting..."
                  );

                  new Thread(
                          () -> {

                              File input = null;
                              File output = null;

                              try {

                                  input =
                                          copyToCache(
                                                  videoUri
                                          );

                                  output =
                                          new File(
                                                  getCacheDir(),
                                                  "rcinsta_output.mp4"
                                          );

                                  if (
                                          output.exists()
                                  ) {

                                      output.delete();
                                  }

                                  long startUs =
                                          (long)(
                                                  duration
                                                  * trimStart
                                                  / 100f
                                                  * 1000L
                                          );

                                  long endUs =
                                          (long)(
                                                  duration
                                                  * trimEnd
                                                  / 100f
                                                  * 1000L
                                          );

                                  muxTrim(
                                          input,
                                          output,
                                          startUs,
                                          endUs
                                  );

                                  saveVideo(
                                          output
                                  );

                                  runOnUiThread(
                                          () -> toast(
                                                  "Video saved"
                                          )
                                  );

                              } catch (Exception e) {

                                  runOnUiThread(
                                          () -> toast(
                                                  "Export failed"
                                          )
                                  );

                              } finally {

                                  if (
                                          input != null
                                  ) {
                                      input.delete();
                                  }

                                  if (
                                          output != null
                                  ) {
                                      output.delete();
                                  }
                              }

                          }
                  ).start();
              }

              File copyToCache(
                      Uri uri
              ) throws Exception {

                  File file =
                          new File(
                                  getCacheDir(),
                                  "rcinsta_input.mp4"
                          );

                  InputStream in =
                          getContentResolver()
                                  .openInputStream(
                                          uri
                                  );

                  if (in == null)
                      throw new Exception();

                  FileOutputStream out =
                          new FileOutputStream(
                                  file
                          );

                  byte[] buffer =
                          new byte[65536];

                  int n;

                  while (
                          (n = in.read(buffer))
                                  != -1
                  ) {

                      out.write(
                              buffer,
                              0,
                              n
                      );
                  }

                  out.flush();
                  out.close();
                  in.close();

                  return file;
              }

              void muxTrim(
                      File input,
                      File output,
                      long startUs,
                      long endUs
              ) throws Exception {

                  MediaExtractor extractor =
                          new MediaExtractor();

                  extractor.setDataSource(
                          input.getAbsolutePath()
                  );

                  MediaMuxer muxer =
                          new MediaMuxer(
                                  output.getAbsolutePath(),
                                  MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4
                          );

                  int count =
                          extractor.getTrackCount();

                  int[] map =
                          new int[count];

                  for (
                          int i = 0;
                          i < count;
                          i++
                  ) {

                      MediaFormat format =
                              extractor.getTrackFormat(i);

                      String mime =
                              format.getString(
                                      MediaFormat.KEY_MIME
                              );

                      map[i] = -1;

                      if (
                              mime != null
                              && (
                                      mime.startsWith("video/")
                                      || (
                                              !muted
                                              && mime.startsWith("audio/")
                                      )
                              )
                      ) {

                          map[i] =
                                  muxer.addTrack(
                                          format
                                  );

                          extractor.selectTrack(i);
                      }
                  }

                  muxer.start();

                  ByteBuffer buffer =
                          ByteBuffer.allocate(
                                  1024 * 1024
                          );

                  android.media.MediaCodec.BufferInfo info =
                          new android.media.MediaCodec.BufferInfo();

                  while (true) {

                      int track =
                              extractor
                                      .getSampleTrackIndex();

                      if (track < 0)
                          break;

                      long time =
                              extractor.getSampleTime();

                      if (time < 0)
                          break;

                      if (time > endUs)
                          break;

                      if (time >= startUs) {

                          buffer.clear();

                          int size =
                                  extractor.readSampleData(
                                          buffer,
                                          0
                                  );

                          if (size < 0)
                              break;

                          info.offset = 0;
                          info.size = size;

                          info.presentationTimeUs =
                                  time - startUs;

                          info.flags =
                                  extractor
                                          .getSampleFlags();

                          if (
                                  map[track] >= 0
                          ) {

                              muxer.writeSampleData(
                                      map[track],
                                      buffer,
                                      info
                              );
                          }
                      }

                      extractor.advance();
                  }

                  muxer.stop();
                  muxer.release();
                  extractor.release();
              }

              void saveVideo(
                      File file
              ) throws Exception {

                  ContentValues values =
                          new ContentValues();

                  values.put(
                          MediaStore.Video.Media.DISPLAY_NAME,
                          "RCINSTAEDIT_"
                                  + System.currentTimeMillis()
                                  + ".mp4"
                  );

                  values.put(
                          MediaStore.Video.Media.MIME_TYPE,
                          "video/mp4"
                  );

                  if (
                          Build.VERSION.SDK_INT >= 29
                  ) {

                      values.put(
                              MediaStore.Video.Media.RELATIVE_PATH,
                              "Movies/RCINSTAEDIT"
                      );

                      values.put(
                              MediaStore.Video.Media.IS_PENDING,
                              1
                      );
                  }

                  Uri uri =
                          getContentResolver()
                                  .insert(
                                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                                          values
                                  );

                  if (uri == null)
                      throw new Exception();

                  OutputStream out =
                          getContentResolver()
                                  .openOutputStream(
                                          uri
                                  );

                  if (out == null)
                      throw new Exception();

                  InputStream in =
                          new FileInputStream(
                                  file
                          );

                  byte[] buffer =
                          new byte[65536];

                  int n;

                  while (
                          (n = in.read(buffer))
                                  != -1
                  ) {

                      out.write(
                              buffer,
                              0,
                              n
                      );
                  }

                  out.flush();
                  out.close();
                  in.close();

                  if (
                          Build.VERSION.SDK_INT >= 29
                  ) {

                      ContentValues done =
                              new ContentValues();

                      done.put(
                              MediaStore.Video.Media.IS_PENDING,
                              0
                      );

                      getContentResolver()
                              .update(
                                      uri,
                                      done,
                                      null,
                                      null
                              );
                  }
              }

              void toast(String s) {

                  Toast.makeText(
                          this,
                          s,
                          Toast.LENGTH_SHORT
                  ).show();
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
