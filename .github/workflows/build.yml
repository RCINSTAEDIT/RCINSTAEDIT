                  );

                  addSlider(
                          controls,
                          "Sharpness",
                          0,
                          100,
                          sharpness,
                          new SliderCallback() {
                              @Override
                              public void onChanged(int value) {
                                  sharpness = value;
                                  updatePreview();
                              }
                          }
                  );

                  addSlider(
                          controls,
                          "Definition",
                          0,
                          100,
                          definition,
