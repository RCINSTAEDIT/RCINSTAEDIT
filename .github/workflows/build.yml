              private void addSlider(
                      LinearLayout p,
                      int index
              ) {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  TextView label =
                          txt(
                                  names[index]+"    0",
                                  13,
                                  Color.WHITE
                          );

                  SeekBar seek =
                          new SeekBar(this);

                  seek.setMax(200);
                  seek.setProgress(100);

                  labels[index]=label;
                  bars[index]=seek;

                  box.addView(
                          label,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(29)
                          )
                  );

                  box.addView(
                          seek,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(42)
                          )
                  );

                  p.addView(
                          box,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(73)
                          )
                  );

                  seek.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                      @Override
                      public void onStartTrackingTouch(
                              SeekBar s
                      ) {
                          dragSnapshot =
                                  makeSnapshot();
                      }

                      @Override
                      public void onProgressChanged(
                              SeekBar s,
                              int progress,
                              boolean user
                      ) {

                          if(!user) return;

                          adjust[index] =
                                  progress - 100;

                          label.setText(
                                  names[index]
                                  +"    "
                                  +String.format(
                                          Locale.US,
                                          "%.0f",
                                          adjust[index]
                                  )
                          );

                          schedulePreview();
                      }

                      @Override
                      public void onStopTrackingTouch(
                              SeekBar s
                      ) {

                          if(dragSnapshot!=null) {
                              undo.push(
                                      dragSnapshot
                              );
                              redo.clear();
                              dragSnapshot=null;
                          }

                          schedulePreview();
                      }
                  });
              }

              private void addFilters(
                      LinearLayout p
