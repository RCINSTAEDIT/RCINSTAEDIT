name: RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/rcinstaedit
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit'
                  minSdk 23
                  targetSdk 35
                  versionCode 6
                  versionName '1.0.6'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#08080D</color>
              <color name="white">#FFFFFF</color>
              <color name="purple">#AA91FF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">RCINSTAEDIT</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="RCINSTAEDIT"
                  android:theme="@style/AppTheme"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".VideoEditorActivity"
                      android:screenOrientation="portrait"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#08080D</item>
                  <item name="android:navigationBarColor">#08080D</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/rcinstaedit/MainActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Matrix;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowInsets;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayDeque;
          import java.util.Arrays;

          public class MainActivity extends Activity {

              private final ArrayDeque<String> stack = new ArrayDeque<>();
              private String current = "home";

              private LinearLayout root;
              private ImageView preview;

              private Bitmap originalBitmap;
              private Bitmap workingBitmap;

              private float brightness = 0;
              private float exposure = 0;
              private float brilliance = 0;
              private float contrast = 0;
              private float highlights = 0;
              private float shadows = 0;
              private float blackPoint = 0;
              private float saturation = 0;
              private float vibrance = 0;
              private float warmth = 0;
              private float tint = 0;
              private float hue = 0;
              private float sharpness = 0;
              private float definition = 0;
              private float noise = 0;
              private float fade = 0;
              private float vignette = 0;

              private String selectedFilter = "Original";
              private float filterIntensity = 1f;

              private int rotation = 0;
              private boolean flipH = false;
              private boolean flipV = false;

              private final int BG = Color.rgb(8,8,13);
              private final int CARD = Color.rgb(20,19,27);
              private final int WHITE = Color.WHITE;
              private final int PURPLE = Color.rgb(170,145,255);
              private final int GRAY = Color.rgb(175,175,185);

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  show("home");
              }

              private int dp(int v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String s, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  t.setIncludeFontPadding(true);
                  return t;
              }

              private void base() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  setContentView(root);

                  if (Build.VERSION.SDK_INT >= 23) {
                      root.setOnApplyWindowInsetsListener((v, insets) -> {
                          int top = insets.getSystemWindowInsetTop();
                          int bottom = insets.getSystemWindowInsetBottom();
                          v.setPadding(0, top, 0, bottom);
                          return insets;
                      });
                  }
              }

              private LinearLayout scrollContent() {
                  ScrollView sv = new ScrollView(this);
                  sv.setFillViewport(true);

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(16), dp(12), dp(16), dp(24));

                  sv.addView(box);

                  root.addView(
                      sv,
                      new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1
                      )
                  );

                  return box;
              }

              private void header(
                      LinearLayout parent,
                      String title
              ) {
                  LinearLayout bar = new LinearLayout(this);
                  bar.setGravity(Gravity.CENTER_VERTICAL);

                  TextView back = text("‹ Back",16,WHITE);
                  back.setPadding(0,0,dp(12),0);

                  back.setOnClickListener(v -> goBack());

                  TextView name = text(title,20,WHITE);
                  name.setTypeface(null,android.graphics.Typeface.BOLD);

                  bar.addView(
                      back,
                      new LinearLayout.LayoutParams(
                          dp(80),
                          dp(54)
                      )
                  );

                  bar.addView(
                      name,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(54),
                          1
                      )
                  );

                  parent.addView(bar);
              }

              private void addSection(
                      LinearLayout parent,
                      String title
              ) {
                  TextView section = text(
                      title,
                      14,
                      PURPLE
                  );

                  section.setTypeface(
                      null,
                      android.graphics.Typeface.BOLD
                  );

                  section.setIncludeFontPadding(true);

                  section.setGravity(
                      Gravity.CENTER_VERTICAL
                  );

                  section.setPadding(
                      0,
                      dp(4),
                      0,
                      dp(4)
                  );

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(52)
                      );

                  p.setMargins(
                      0,
                      dp(16),
                      0,
                      dp(4)
                  );

                  parent.addView(section,p);
              }

              private void card(
                      LinearLayout parent,
                      String title,
                      String sub,
                      View.OnClickListener click
              ) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(18),dp(14),dp(18),dp(14));
                  c.setBackgroundColor(CARD);

                  TextView a = text(title,17,WHITE);
                  a.setTypeface(null,android.graphics.Typeface.BOLD);

                  TextView b = text(sub,13,GRAY);

                  c.addView(a,new LinearLayout.LayoutParams(-1,dp(30)));
                  c.addView(b,new LinearLayout.LayoutParams(-1,dp(30)));

                  c.setOnClickListener(click);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1,dp(76));

                  p.setMargins(0,dp(7),0,dp(7));

                  parent.addView(c,p);
              }

              private void show(String screen) {
                  current = screen;
                  base();

                  if (screen.equals("home")) {
                      home();
                  } else if (screen.equals("photo")) {
                      photo();
                  } else if (screen.equals("adjust")) {
                      adjust();
                  } else if (screen.equals("filters")) {
                      filters();
                  }
              }

              private void home() {
                  LinearLayout box = scrollContent();

                  TextView title = text(
                      "RCINSTAEDIT",
                      28,
                      WHITE
                  );

                  title.setTypeface(
                      null,
                      android.graphics.Typeface.BOLD
                  );

                  title.setGravity(Gravity.CENTER);
                  box.addView(
                      title,
                      new LinearLayout.LayoutParams(-1,dp(80))
                  );

                  TextView sub = text(
                      "Edit • Create • Inspire",
                      15,
                      PURPLE
                  );

                  sub.setGravity(Gravity.CENTER);
                  box.addView(
                      sub,
                      new LinearLayout.LayoutParams(-1,dp(40))
                  );

                  addSection(box,"EDITORS");

                  card(
                      box,
                      "📷  PHOTO EDITOR",
                      "Professional photo editing tools",
                      v -> {
                          stack.push(current);
                          show("photo");
                      }
                  );

                  card(
                      box,
                      "🎬  VIDEO EDITOR",
                      "Trim • Speed • Rotate • Mute • Export",
                      v -> {
                          startActivity(
                              new Intent(
                                  MainActivity.this,
                                  VideoEditorActivity.class
                              )
                          );
                      }
                  );

                  addSection(box,"TOOLS");

                  card(
                      box,
                      "✨  EFFECTS",
                      "Creative effects and looks",
                      v -> toast("Effects next stage mein")
                  );

                  card(
                      box,
                      "🔀  TRANSITIONS",
                      "Smooth reel transitions",
                      v -> toast("Transitions next stage mein")
                  );

                  card(
                      box,
                      "🎵  ADD AUDIO FROM PHONE",
                      "Use your own audio files",
                      v -> chooseAudio()
                  );

                  card(
                      box,
                      "💾  HIGH QUALITY EXPORT",
                      "Photo editor → Save Photo",
                      v -> toast("Photo Editor mein Save Photo use karo")
                  );
              }

              private void photo() {
                  LinearLayout box = scrollContent();

                  header(box,"Photo Editor");

                  Button choose = new Button(this);

                  choose.setText(
                      originalBitmap == null
                          ? "📷  CHOOSE PHOTO"
                          : "🔄  CHANGE PHOTO"
                  );

                  choose.setOnClickListener(v -> choosePhoto());

                  box.addView(
                      choose,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(52)
                      )
                  );

                  preview = new ImageView(this);
                  preview.setBackgroundColor(Color.BLACK);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  box.addView(
                      preview,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(310)
                      )
                  );

                  addSection(box,"EDIT");

                  card(
                      box,
                      "☀  ADJUST",
                      "Light • Color • Detail • Effects",
                      v -> {
                          stack.push(current);
                          show("adjust");
                      }
                  );

                  card(
                      box,
                      "🎨  FILTERS",
                      "Original • Vivid • Dramatic • Mono • Warm",
                      v -> {
                          stack.push(current);
                          show("filters");
                      }
                  );

                  LinearLayout tools = new LinearLayout(this);
                  tools.setOrientation(LinearLayout.HORIZONTAL);

                  Button rotate = new Button(this);
                  rotate.setText("ROTATE");

                  rotate.setOnClickListener(v -> {
                      rotation = (rotation + 90) % 360;
                      updatePreview();
                  });

                  Button fh = new Button(this);
                  fh.setText("FLIP H");

                  fh.setOnClickListener(v -> {
                      flipH = !flipH;
                      updatePreview();
                  });

                  Button fv = new Button(this);
                  fv.setText("FLIP V");

                  fv.setOnClickListener(v -> {
                      flipV = !flipV;
                      updatePreview();
                  });

                  tools.addView(
                      rotate,
                      new LinearLayout.LayoutParams(
                          0,dp(52),1
                      )
                  );

                  tools.addView(
                      fh,
                      new LinearLayout.LayoutParams(
                          0,dp(52),1
                      )
                  );

                  tools.addView(
                      fv,
                      new LinearLayout.LayoutParams(
                          0,dp(52),1
                      )
                  );

                  box.addView(tools);

                  Button crop = new Button(this);
                  crop.setText("✂  CENTER CROP");

                  crop.setOnClickListener(v -> centerCrop());

                  box.addView(
                      crop,
                      new LinearLayout.LayoutParams(-1,dp(52))
                  );

                  Button reset = new Button(this);
                  reset.setText("RESET PHOTO");

                  reset.setOnClickListener(v -> resetEdits());

                  box.addView(
                      reset,
                      new LinearLayout.LayoutParams(-1,dp(52))
                  );

                  Button save = new Button(this);
                  save.setText("💾  SAVE PHOTO");

                  save.setOnClickListener(v -> savePhoto());

                  box.addView(
                      save,
                      new LinearLayout.LayoutParams(-1,dp(58))
                  );

                  if (originalBitmap != null) {
                      updatePreview();
                  }
              }

              private void choosePhoto() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("image/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i,100);
              }

              private void chooseAudio() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("audio/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i,101);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (
                      resultCode != RESULT_OK ||
                      data == null ||
                      data.getData() == null
                  ) return;

                  if (requestCode == 100) {
                      try {
                          InputStream in =
                              getContentResolver()
                                  .openInputStream(data.getData());

                          originalBitmap =
                              BitmapFactory.decodeStream(in);

                          if (in != null) in.close();

                          workingBitmap =
                              originalBitmap.copy(
                                  Bitmap.Config.ARGB_8888,
                                  true
                              );

                          resetValues();
                          show("photo");

                      } catch(Exception e) {
                          toast("Photo open nahi hui");
                      }
                  }

                  if (requestCode == 101) {
                      toast("Audio selected");
                  }
              }

              private void resetValues() {
                  brightness = 0;
                  exposure = 0;
                  brilliance = 0;
                  contrast = 0;
                  highlights = 0;
                  shadows = 0;
                  blackPoint = 0;
                  saturation = 0;
                  vibrance = 0;
                  warmth = 0;
                  tint = 0;
                  hue = 0;
                  sharpness = 0;
                  definition = 0;
                  noise = 0;
                  fade = 0;
                  vignette = 0;
                  selectedFilter = "Original";
                  filterIntensity = 1f;
                  rotation = 0;
                  flipH = false;
                  flipV = false;
              }

              private void resetEdits() {
                  if (originalBitmap == null) return;

                  resetValues();

                  workingBitmap =
                      originalBitmap.copy(
                          Bitmap.Config.ARGB_8888,
                          true
                      );

                  updatePreview();
              }

              private void addSlider(
                      LinearLayout parent,
                      String label,
                      int min,
                      int max,
                      int value,
                      SliderCallback callback
              ) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.VERTICAL);

                  TextView name = text(
                      label + "  " + value,
                      14,
                      WHITE
                  );

                  SeekBar seek = new SeekBar(this);

                  seek.setMax(max-min);
                  seek.setProgress(value-min);

                  seek.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {

                          @Override
                          public void onProgressChanged(
                                  SeekBar s,
                                  int p,
                                  boolean fromUser
                          ) {
                              int val = p + min;
                              name.setText(
                                  label + "  " + val
                              );

                              callback.onChange(val);
                              updatePreview();
                          }

                          @Override
                          public void onStartTrackingTouch(
                                  SeekBar s
                          ) {}

                          @Override
                          public void onStopTrackingTouch(
                                  SeekBar s
                          ) {}
                      }
                  );

                  row.addView(
                      name,
                      new LinearLayout.LayoutParams(
                          -1,dp(30)
                      )
                  );

                  row.addView(
                      seek,
                      new LinearLayout.LayoutParams(
                          -1,dp(48)
                      )
                  );

                  parent.addView(row);
              }

              private interface SliderCallback {
                  void onChange(int value);
              }

              private void adjust() {
                  LinearLayout box = scrollContent();

                  header(box,"Adjust");

                  if (originalBitmap == null) {
                      TextView t = text(
                          "Pehle PHOTO CHOOSE karo",
                          18,
                          WHITE
                      );
                      box.addView(t);
                      return;
                  }

                  preview = new ImageView(this);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  preview.setBackgroundColor(Color.BLACK);

                  box.addView(
                      preview,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(270)
                      )
                  );

                  addSection(box,"LIGHT");

                  addSlider(box,"Brightness",-100,100,
                      (int)brightness,v -> brightness=v);

                  addSlider(box,"Exposure",-100,100,
                      (int)exposure,v -> exposure=v);

                  addSlider(box,"Brilliance",-100,100,
                      (int)brilliance,v -> brilliance=v);

                  addSlider(box,"Contrast",-100,100,
                      (int)contrast,v -> contrast=v);

                  addSlider(box,"Highlights",-100,100,
                      (int)highlights,v -> highlights=v);

                  addSlider(box,"Shadows",-100,100,
                      (int)shadows,v -> shadows=v);

                  addSlider(box,"Black Point",-100,100,
                      (int)blackPoint,v -> blackPoint=v);

                  addSection(box,"COLOR");

                  addSlider(box,"Saturation",-100,100,
                      (int)saturation,v -> saturation=v);

                  addSlider(box,"Vibrance",-100,100,
                      (int)vibrance,v -> vibrance=v);

                  addSlider(box,"Warmth",-100,100,
                      (int)warmth,v -> warmth=v);

                  addSlider(box,"Tint",-100,100,
                      (int)tint,v -> tint=v);

                  addSlider(box,"Hue",-180,180,
                      (int)hue,v -> hue=v);

                  addSection(box,"DETAIL");

                  addSlider(box,"Sharpness",0,100,
                      (int)sharpness,v -> sharpness=v);

                  addSlider(box,"Definition",0,100,
                      (int)definition,v -> definition=v);

                  addSlider(box,"Noise Reduction",0,100,
                      (int)noise,v -> noise=v);

                  addSection(box,"EFFECTS");

                  addSlider(box,"Fade",0,100,
                      (int)fade,v -> fade=v);

                  addSlider(box,"Vignette",0,100,
                      (int)vignette,v -> vignette=v);

                  Button reset = new Button(this);
                  reset.setText("RESET ADJUSTMENTS");

                  reset.setOnClickListener(
                      v -> {
                          resetValues();
                          show("adjust");
                      }
                  );

                  box.addView(
                      reset,
                      new LinearLayout.LayoutParams(
                          -1,dp(56)
                      )
                  );

                  updatePreview();
              }

              private void filters() {
                  LinearLayout box = scrollContent();

                  header(box,"Filters");

                  if (originalBitmap == null) {
                      box.addView(
                          text(
                              "Pehle PHOTO CHOOSE karo",
                              18,
                              WHITE
                          )
                      );
                      return;
                  }

                  preview = new ImageView(this);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  box.addView(
                      preview,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(300)
                      )
                  );

                  String[] filters = {
                      "Original",
                      "Vivid",
                      "Vivid Warm",
                      "Vivid Cool",
                      "Dramatic",
                      "Dramatic Warm",
                      "Dramatic Cool",
                      "Mono",
                      "Silvertone",
                      "Noir",
                      "Warm",
                      "Cool",
                      "Fade"
                  };

                  addSection(box,"FILTER PRESETS");

                  for (String f : filters) {
                      Button b = new Button(this);
                      b.setText(f);

                      b.setOnClickListener(
                          v -> {
                              selectedFilter = f;
                              updatePreview();
                          }
                      );

                      box.addView(
                          b,
                          new LinearLayout.LayoutParams(
                              -1,dp(50)
                          )
                      );
                  }

                  addSection(box,"FILTER INTENSITY");

                  addSlider(
                      box,
                      "Intensity",
                      0,
                      100,
                      (int)(filterIntensity*100),
                      v -> filterIntensity=v/100f
                  );

                  updatePreview();
              }

              private void updatePreview() {
                  if (originalBitmap == null ||
                      preview == null) return;

                  Bitmap b =
                      originalBitmap.copy(
                          Bitmap.Config.ARGB_8888,
                          true
                      );

                  Matrix m = new Matrix();

                  float sx = flipH ? -1f : 1f;
                  float sy = flipV ? -1f : 1f;

                  m.postScale(sx,sy);

                  m.postRotate(rotation);

                  Bitmap transformed;

                  try {
                      transformed =
                          Bitmap.createBitmap(
                              b,
                              0,
                              0,
                              b.getWidth(),
                              b.getHeight(),
                              m,
                              true
                          );
                  } catch(Exception e) {
                      transformed = b;
                  }

                  ColorMatrix cm =
                      new ColorMatrix();

                  float c =
                      1f + (contrast / 100f);

                  float bright =
                      brightness * 2.55f;

                  bright += exposure * 1.8f;
                  bright += brilliance * 0.8f;

                  float sat =
                      1f + saturation / 100f;

                  cm.setSaturation(
                      Math.max(0f,sat)
                  );

                  ColorMatrix adj =
                      new ColorMatrix(
                          new float[] {
                              c,0,0,0,bright,
                              0,c,0,0,bright,
                              0,0,c,0,bright,
                              0,0,0,1,0
                          }
                      );

                  cm.postConcat(adj);

                  if (warmth != 0) {
                      float w = warmth * 0.9f;

                      ColorMatrix warm =
                          new ColorMatrix(
                              new float[] {
                                  1,0,0,0,w,
                                  0,1,0,0,0,
                                  0,0,1,0,-w,
                                  0,0,0,1,0
                              }
                          );

                      cm.postConcat(warm);
                  }

                  if (tint != 0) {
                      float t = tint * 0.7f;

                      ColorMatrix tc =
                          new ColorMatrix(
                              new float[] {
                                  1,0,0,0,0,
                                  0,1,0,0,t,
                                  0,0,1,0,0,
                                  0,0,0,1,0
                              }
                          );

                      cm.postConcat(tc);
                  }

                  ColorMatrix fm =
                      filterMatrix(selectedFilter);

                  if (filterIntensity < 1f) {
                      float[] mix =
                          new float[20];

                      float[] identity =
                          new ColorMatrix().getArray();

                      float[] filter =
                          fm.getArray();

                      for (int i=0;i<20;i++) {
                          mix[i] =
                              identity[i] +
                              (filter[i]-identity[i])
                              * filterIntensity;
                      }

                      fm = new ColorMatrix(mix);
                  }

                  cm.postConcat(fm);

                  preview.setImageBitmap(transformed);

                  preview.setColorFilter(
                      new ColorMatrixColorFilter(cm)
                  );

                  if (vignette > 0) {
                      preview.setAlpha(1f);
                  }
