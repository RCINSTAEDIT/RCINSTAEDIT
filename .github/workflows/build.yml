name: Build RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create folders
        run: |
          mkdir -p app/src/main/java/com/rcinstaedit/app
          mkdir -p app/src/main/res/values

      - name: Create project files
        run: |
          echo '' | base64 -d > settings.gradle

          echo 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC43LjMnIGFwcGx5IGZhbHNlIH0K' | base64 -d > build.gradle

          echo 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgfQphbmRyb2lkIHsgbmFtZXNwYWNlICdjb20ucmNpbnN0YWVkaXQuYXBwJzsgY29tcGlsZVNkayAzNTsgZGVmYXVsdENvbmZpZyB7IGFwcGxpY2F0aW9uSWQgJ2NvbS5yY2luc3RhZWRpdC5hcHAnOyBtaW5TZGsgMjM7IHRhcmdldFNkayAzNTsgdmVyc2lvbkNvZGUgMzsgdmVyc2lvbk5hbWUgJzMuMCcgfSB9Cg==' | base64 -d > app/build.gradle

          echo '' | base64 -d > app/src/main/res/values/themes.xml

          echo '' | base64 -d > app/src/main/AndroidManifest.xml

          echo '' | base64 -d > app/src/main/java/com/rcinstaedit/app/MainActivity.java

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace
          echo "APK:"
          find app/build/outputs -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
