                              @Override
                              public void onChanged(int value) {
                                  definition = value;
                                  updatePreview();
                              }
                          }
                  );

                  addSlider(
                          controls,
                          "Noise Reduction",
                          0,
                          100,
                          noiseReduction,
                          new SliderCallback() {
                              @Override
                              public void onChanged(int value) {
                                  noiseReduction = value;
                                  updatePreview();
                              }
                          }
                  );

                  addSection(
                          controls,
                          "EFFECTS"
                  );

                  addSlider(
                          controls,
                          "Fade",
                          0,
                          100,
                          fade,
                          new SliderCallback() {
                              @Override
                              public void onChanged(int value) {
                                  fade = value;
                                  updatePreview();
                              }
                          }
                  );

                  addSlider(
                          controls,
                          "Vignette",
                          0,
                          100,
                          vignette,
                          new SliderCallback() {
                              @Override
                              public void onChanged(int value) {
                                  vignette = value;

                                  if (vignetteView != null) {
                                      vignetteView.setStrength(
                                              vignette
                                      );
                                  }

                                  updatePreview();
                              }
                          }
                  );

                  addTool(
                          controls,
                          "↺  RESET ALL ADJUSTMENTS",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  resetAdjustments();
