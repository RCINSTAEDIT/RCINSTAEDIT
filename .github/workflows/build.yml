name: RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf app build .gradle gradle
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/rcinstaedit
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "4.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0E0F14</item>
                  <item name="android:navigationBarColor">#0E0F14</item>
                  <item name="android:colorAccent">#7C4DFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="RCINSTAEDIT"
                  android:theme="@style/AppTheme"
                  android:enableOnBackInvokedCallback="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/MainActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.content.ContentValues;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.window.OnBackInvokedCallback;
          import android.window.OnBackInvokedDispatcher;

          import java.io.OutputStream;
          import java.util.ArrayDeque;

          public class MainActivity extends Activity {

              private static final int PICK_IMAGE = 1001;

              private final ArrayDeque<String> screenStack = new ArrayDeque<>();

              private String currentScreen = "home";

              private Bitmap originalBitmap;
              private Bitmap editedBitmap;

              private ImageView previewImage;

              private float zoom = 1f;
              private float dragX = 0f;
              private float dragY = 0f;
              private float lastX;
              private float lastY;

              private boolean beforePressed = false;

              private String selectedFilter = "Original";
              private int filterIntensity = 100;

              private LinearLayout filterContainer;

              interface SliderCallback {
                  void onChanged(int value);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.rgb(14, 15, 20));
                  window.setNavigationBarColor(Color.rgb(14, 15, 20));

                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                              new OnBackInvokedCallback() {
                                  @Override
                                  public void onBackInvoked() {
                                      goBack();
                                  }
                              }
                      );
                  }

                  renderScreen();
              }

              @Override
              public void onBackPressed() {
                  if (Build.VERSION.SDK_INT < 33) {
                      goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private void goBack() {
                  if (!screenStack.isEmpty()) {
                      currentScreen = screenStack.pop();
                      renderScreen();
                  } else {
                      finish();
                  }
              }

              private void openScreen(String screen) {
                  screenStack.push(currentScreen);
                  currentScreen = screen;
                  renderScreen();
              }

              private void renderScreen() {
                  if ("home".equals(currentScreen)) {
                      showHome();
                  } else if ("photo".equals(currentScreen)) {
                      showPhotoEditor();
                  } else if ("filters".equals(currentScreen)) {
                      showFilters();
                  }
              }

              private void showHome() {
                  LinearLayout root = baseColumn();

                  TextView logo = text("RCINSTAEDIT", 30, Color.WHITE);
                  logo.setGravity(Gravity.CENTER);
                  root.addView(logo, lp(-1, 70));

                  TextView sub = text(
                          "Photo & Reel Editor",
                          16,
                          Color.LTGRAY
                  );
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub, lp(-1, 45));

                  addSpace(root, 18);

                  addTool(root, "📷  PHOTO EDITOR", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          openScreen("photo");
                      }
                  });

                  addTool(root, "🎬  VIDEO EDITOR", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          toast("Video editor next stage mein aayega");
                      }
                  });

                  addTool(root, "🎵  ADD AUDIO FROM PHONE", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          pickAudio();
                      }
                  });

                  addTool(root, "✨  HIGH QUALITY EXPORT", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          toast("Photo Editor → Save se export karo");
                      }
                  });

                  setContentView(root);
              }

              private void showPhotoEditor() {

                  LinearLayout root = baseColumn();

                  root.addView(topBar("Photo Editor"));

                  FrameLayout previewBox = new FrameLayout(this);
                  previewBox.setBackgroundColor(Color.BLACK);

                  previewImage = new ImageView(this);
                  previewImage.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  previewImage.setBackgroundColor(Color.BLACK);

                  previewBox.addView(
                          previewImage,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );

                  root.addView(
                          previewBox,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(320)
                          )
                  );

                  setupPreviewTouch();

                  LinearLayout quick = new LinearLayout(this);
                  quick.setGravity(Gravity.CENTER);
                  quick.setPadding(dp(8), dp(8), dp(8), dp(8));

                  addSmallButton(quick, "FIT", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          zoom = 1f;
                          dragX = 0;
                          dragY = 0;
                          updatePreview();
                      }
                  });

                  addSmallButton(quick, "1:1", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          zoom = 2f;
                          updatePreview();
                      }
                  });

                  TextView before = makeButton("HOLD: BEFORE");

                  before.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              beforePressed = true;
                              showBefore();
                              return true;
                          }

                          if (e.getAction() == MotionEvent.ACTION_UP ||
                                  e.getAction() == MotionEvent.ACTION_CANCEL) {
                              beforePressed = false;
                              updatePreview();
                              return true;
                          }

                          return true;
                      }
                  });

                  quick.addView(before);

                  root.addView(
                          quick,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(60)
                          )
                  );

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout tools = new LinearLayout(this);
                  tools.setOrientation(LinearLayout.VERTICAL);
                  tools.setPadding(dp(12), dp(8), dp(12), dp(30));

                  addTool(tools, "🎚  ADJUST", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          toast("Adjust screen ready");
                      }
                  });

                  addTool(tools, "🎨  FILTERS", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          openScreen("filters");
                      }
                  });

                  addTool(tools, "↪  ROTATE 90°", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          rotate90();
                      }
                  });

                  addTool(tools, "↔  FLIP HORIZONTAL", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          flipHorizontal();
                      }
                  });

                  addTool(tools, "↕  FLIP VERTICAL", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          flipVertical();
                      }
                  });

                  addTool(tools, "✂  CENTER CROP", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          centerCrop();
                      }
                  });

                  addTool(tools, "↺  RESET", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          resetPhoto();
                      }
                  });

                  addTool(tools, "💾  SAVE PHOTO", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          savePhoto();
                      }
                  });

                  scroll.addView(tools);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  updatePreview();

                  setContentView(root);
              }

              private void showFilters() {

                  LinearLayout root = baseColumn();

                  root.addView(topBar("Filters"));

                  FrameLayout previewBox = new FrameLayout(this);
                  previewBox.setBackgroundColor(Color.BLACK);

                  previewImage = new ImageView(this);
                  previewImage.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  previewBox.addView(
                          previewImage,
                          new FrameLayout.LayoutParams(-1, -1)
                  );

                  root.addView(
                          previewBox,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(300)
                          )
                  );

                  setupPreviewTouch();

                  TextView selected = text(
                          "FILTER: " + selectedFilter,
                          15,
                          Color.WHITE
                  );
                  selected.setGravity(Gravity.CENTER);
                  root.addView(selected, lp(-1, 48));

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(12), dp(5), dp(12), dp(30));

                  String[] filters = {
                          "Original",
                          "Vivid",
                          "Vivid Warm",
                          "Vivid Cool",
                          "Dramatic",
                          "Dramatic Warm",
                          "Dramatic Cool",
                          "Mono",
                          "Silvertone",
                          "Noir",
                          "Warm",
                          "Cool",
                          "Fade"
                  };

                  for (final String filter : filters) {
                      TextView b = makeButton(filter);

                      b.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              selectedFilter = filter;
                              selected.setText("FILTER: " + selectedFilter);
                              updatePreview();
                          }
                      });

                      content.addView(b);
                  }

                  TextView intensityTitle = text(
                          "Intensity: " + filterIntensity + "%",
                          15,
                          Color.WHITE
                  );

                  intensityTitle.setGravity(Gravity.CENTER_VERTICAL);
                  content.addView(
                          intensityTitle,
                          lp(-1, 48)
                  );

                  SeekBar intensity = new SeekBar(this);
                  intensity.setMax(100);
                  intensity.setProgress(filterIntensity);

                  intensity.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar seekBar,
                                      int progress,
                                      boolean fromUser) {

                                  filterIntensity = progress;

                                  intensityTitle.setText(
                                          "Intensity: " +
                                                  filterIntensity +
                                                  "%"
                                  );

                                  updatePreview();
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar seekBar) {
                              }

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar seekBar) {
                              }
                          }
                  );

                  content.addView(
                          intensity,
                          lp(-1, 55)
                  );

                  addTool(content, "APPLY & BACK", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          goBack();
                      }
                  });

                  scroll.addView(content);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  updatePreview();

                  setContentView(root);
              }

              private void updatePreview() {

                  if (previewImage == null) return;

                  Bitmap source = editedBitmap != null
                          ? editedBitmap
                          : originalBitmap;

                  if (source == null) {
                      previewImage.setImageDrawable(null);
                      return;
                  }

                  if (beforePressed) {
                      previewImage.setImageBitmap(originalBitmap);
                      previewImage.clearColorFilter();
                  } else {
                      previewImage.setImageBitmap(source);

                      ColorMatrixColorFilter filter =
                              buildFilter(
                                      selectedFilter,
                                      filterIntensity
                              );

                      if (filter == null) {
                          previewImage.clearColorFilter();
                      } else {
                          previewImage.setColorFilter(filter);
                      }
                  }

                  previewImage.setScaleX(zoom);
                  previewImage.setScaleY(zoom);
                  previewImage.setTranslationX(dragX);
                  previewImage.setTranslationY(dragY);
              }

              private void showBefore() {

                  if (previewImage == null ||
                          originalBitmap == null) return;

                  previewImage.setImageBitmap(originalBitmap);
                  previewImage.clearColorFilter();
                  previewImage.setScaleX(zoom);
                  previewImage.setScaleY(zoom);
              }

              private ColorMatrixColorFilter buildFilter(
                      String name,
                      int intensity) {

                  if ("Original".equals(name) || intensity <= 0) {
                      return null;
                  }

                  float amount = intensity / 100f;

                  ColorMatrix matrix =
                          new ColorMatrix();

                  if ("Vivid".equals(name)) {

                      float sat = 1f + 0.45f * amount;
                      float contrast = 1f + 0.18f * amount;

                      ColorMatrix satMatrix =
                              new ColorMatrix();
                      satMatrix.setSaturation(sat);

                      matrix.set(satMatrix);

                      matrix.postConcat(
                              contrastMatrix(contrast)
                      );

                  } else if ("Vivid Warm".equals(name)) {

                      float sat = 1f + 0.42f * amount;
                      ColorMatrix satMatrix =
                              new ColorMatrix();
                      satMatrix.setSaturation(sat);

                      matrix.set(satMatrix);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f + 0.16f * amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      12f * amount,
                                      5f * amount,
                                      -7f * amount
                              )
                      );

                  } else if ("Vivid Cool".equals(name)) {

                      float sat = 1f + 0.42f * amount;
                      ColorMatrix satMatrix =
                              new ColorMatrix();
                      satMatrix.setSaturation(sat);

                      matrix.set(satMatrix);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f + 0.16f * amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      -7f * amount,
                                      3f * amount,
                                      13f * amount
                              )
                      );

                  } else if ("Dramatic".equals(name)) {

                      ColorMatrix sat =
                              new ColorMatrix();
                      sat.setSaturation(
                              1f + 0.12f * amount
                      );

                      matrix.set(sat);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f + 0.38f * amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      -5f * amount,
                                      -5f * amount,
                                      -5f * amount
                              )
                      );

                  } else if ("Dramatic Warm".equals(name)) {

                      matrix.set(
                              contrastMatrix(
                                      1f + 0.35f * amount
                              )
                      );

                      ColorMatrix sat =
                              new ColorMatrix();
                      sat.setSaturation(
                              1f + 0.10f * amount
                      );

                      matrix.postConcat(sat);

                      matrix.postConcat(
                              offsetMatrix(
                                      12f * amount,
                                      5f * amount,
                                      -8f * amount
                              )
                      );

                  } else if ("Dramatic Cool".equals(name)) {

                      matrix.set(
                              contrastMatrix(
                                      1f + 0.35f * amount
                              )
                      );

                      ColorMatrix sat =
                              new ColorMatrix();
                      sat.setSaturation(
                              1f + 0.10f * amount
                      );

                      matrix.postConcat(sat);

                      matrix.postConcat(
                              offsetMatrix(
                                      -8f * amount,
                                      3f * amount,
                                      14f * amount
                              )
                      );

                  } else if ("Mono".equals(name)) {

                      ColorMatrix mono =
                              new ColorMatrix();
                      mono.setSaturation(0f);

                      matrix.set(mono);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f + 0.08f * amount
                              )
                      );

                  } else if ("Silvertone".equals(name)) {

                      ColorMatrix mono =
                              new ColorMatrix();
                      mono.setSaturation(0f);

                      matrix.set(mono);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f + 0.15f * amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      4f * amount,
                                      4f * amount,
                                      7f * amount
                              )
                      );

                  } else if ("Noir".equals(name)) {

                      ColorMatrix mono =
                              new ColorMatrix();
                      mono.setSaturation(0f);

                      matrix.set(mono);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f + 0.45f * amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      -10f * amount,
                                      -10f * amount,
                                      -10f * amount
                              )
                      );

                  } else if ("Warm".equals(name)) {

                      matrix.set(
                              offsetMatrix(
                                      20f * amount,
                                      5f * amount,
                                      -12f * amount
                              )
                      );

                  } else if ("Cool".equals(name)) {

                      matrix.set(
                              offsetMatrix(
                                      -10f * amount,
                                      3f * amount,
                                      20f * amount
                              )
                      );

                  } else if ("Fade".equals(name)) {

                      matrix.set(
                              contrastMatrix(
                                      1f - 0.20f * amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      18f * amount,
                                      18f * amount,
                                      18f * amount
                              )
                      );
                  }

                  return new ColorMatrixColorFilter(matrix);
              }

              private ColorMatrix contrastMatrix(float contrast) {

                  float offset =
                          128f * (1f - contrast);

                  return new ColorMatrix(
                          new float[] {
                                  contrast, 0, 0, 0, offset,
                                  0, contrast, 0, 0, offset,
                                  0, 0, contrast, 0, offset,
                                  0, 0, 0, 1, 0
                          }
                  );
              }

              private ColorMatrix offsetMatrix(
                      float r,
                      float g,
                      float b) {

                  return new ColorMatrix(
                          new float[] {
                                  1, 0, 0, 0, r,
                                  0, 1, 0, 0, g,
                                  0, 0, 1, 0, b,
                                  0, 0, 0, 1, 0
                          }
                  );
              }

              private void setupPreviewTouch() {

                  if (previewImage == null) return;

                  previewImage.setOnTouchListener(
                          new View.OnTouchListener() {

                              @Override
                              public boolean onTouch(
                                      View v,
                                      MotionEvent event) {

                                  if (zoom <= 1f) {
                                      return true;
                                  }

                                  switch (event.getActionMasked()) {

                                      case MotionEvent.ACTION_DOWN:
                                          lastX = event.getRawX();
                                          lastY = event.getRawY();
                                          return true;

                                      case MotionEvent.ACTION_MOVE:

                                          float dx =
                                                  event.getRawX() - lastX;

                                          float dy =
                                                  event.getRawY() - lastY;

                                          dragX += dx;
                                          dragY += dy;

                                          lastX = event.getRawX();
                                          lastY = event.getRawY();

                                          updatePreview();

                                          return true;
                                  }

                                  return true;
                              }
                          }
                  );
              }

              private void rotate90() {

                  if (editedBitmap == null) {
                      toast("Pehle photo select karo");
                      return;
                  }

                  Matrix matrix = new Matrix();
                  matrix.postRotate(90);

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  0,
                                  0,
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight(),
                                  matrix,
                                  true
                          );

                  resetViewOnly();
                  updatePreview();
              }

              private void flipHorizontal() {

                  if (editedBitmap == null) return;

                  Matrix matrix = new Matrix();
                  matrix.setScale(-1, 1);

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  0,
                                  0,
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight(),
                                  matrix,
                                  true
                          );

                  resetViewOnly();
                  updatePreview();
              }

              private void flipVertical() {

                  if (editedBitmap == null) return;

                  Matrix matrix = new Matrix();
                  matrix.setScale(1, -1);

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  0,
                                  0,
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight(),
                                  matrix,
                                  true
                          );

                  resetViewOnly();
                  updatePreview();
              }

              private void centerCrop() {

                  if (editedBitmap == null) return;

                  int size = Math.min(
                          editedBitmap.getWidth(),
                          editedBitmap.getHeight()
                  );

                  int left =
                          (editedBitmap.getWidth() - size) / 2;

                  int top =
                          (editedBitmap.getHeight() - size) / 2;

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  left,
                                  top,
                                  size,
                                  size
                          );

                  resetViewOnly();
                  updatePreview();
              }

              private void resetViewOnly() {
                  zoom = 1f;
                  dragX = 0;
                  dragY = 0;
              }

              private void resetPhoto() {

                  if (originalBitmap != null) {
                      editedBitmap =
                              originalBitmap.copy(
                                      originalBitmap.getConfig(),
                                      true
                              );
                  }

                  selectedFilter = "Original";
                  filterIntensity = 100;

                  resetViewOnly();
                  updatePreview();

                  toast("Photo reset ho gayi");
              }

              private void pickImage() {

                  Intent intent =
                          new Intent(Intent.ACTION_OPEN_DOCUMENT);

                  intent.setType("image/*");
                  intent.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          intent,
                          PICK_IMAGE
                  );
              }

              private void pickAudio() {

                  Intent intent =
                          new Intent(Intent.ACTION_OPEN_DOCUMENT);

                  intent.setType("audio/*");
                  intent.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          intent,
                          1002
                  );
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (resultCode != RESULT_OK ||
                          data == null ||
                          data.getData() == null) {
                      return;
                  }

                  if (requestCode == PICK_IMAGE) {

                      try {

                          Uri uri = data.getData();

                          Bitmap bitmap =
                                  BitmapFactory.decodeStream(
                                          getContentResolver()
                                                  .openInputStream(uri)
                                  );

                          if (bitmap == null) {
                              toast("Photo load nahi hui");
                              return;
                          }

                          originalBitmap = bitmap;

                          editedBitmap =
                                  bitmap.copy(
                                          bitmap.getConfig(),
                                          true
                                  );

                          selectedFilter = "Original";
                          filterIntensity = 100;

                          resetViewOnly();

                          currentScreen = "photo";
                          screenStack.clear();

                          renderScreen();

                      } catch (Exception e) {
                          toast("Photo open karne mein problem");
                      }
                  }
              }

              private void savePhoto() {

                  if (editedBitmap == null) {
                      toast("Pehle photo select karo");
                      return;
                  }

                  try {

                      Bitmap output =
                              Bitmap.createBitmap(
                                      editedBitmap.getWidth(),
                                      editedBitmap.getHeight(),
                                      Bitmap.Config.ARGB_8888
                              );

                      Canvas canvas =
                              new Canvas(output);

                      Paint paint = new Paint(
                              Paint.ANTI_ALIAS_FLAG |
                                      Paint.FILTER_BITMAP_FLAG
                      );

                      ColorMatrixColorFilter filter =
                              buildFilter(
                                      selectedFilter,
                                      filterIntensity
                              );

                      if (filter != null) {
                          paint.setColorFilter(filter);
                      }

                      canvas.drawBitmap(
                              editedBitmap,
                              0,
                              0,
                              paint
                      );

                      ContentValues values =
                              new ContentValues();

                      values.put(
                              MediaStore.Images.Media.DISPLAY_NAME,
                              "RCINSTAEDIT_" +
                                      System.currentTimeMillis() +
                                      ".jpg"
                      );

                      values.put(
                              MediaStore.Images.Media.MIME_TYPE,
                              "image/jpeg"
                      );

                      if (Build.VERSION.SDK_INT >= 29) {

                          values.put(
                                  MediaStore.Images.Media.RELATIVE_PATH,
                                  "Pictures/RCINSTAEDIT"
                          );
                      }

                      Uri uri =
                              getContentResolver().insert(
                                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                      values
                              );

                      if (uri == null) {
                          toast("Save failed");
                          return;
                      }

                      OutputStream outputStream =
                              getContentResolver()
                                      .openOutputStream(uri);

                      output.compress(
                              Bitmap.CompressFormat.JPEG,
                              95,
                              outputStream
                      );

                      if (outputStream != null) {
                          outputStream.close();
                      }

                      output.recycle();

                      toast(
                              "Saved in Pictures/RCINSTAEDIT"
                      );

                  } catch (Exception e) {
                      toast("Photo save nahi ho payi");
                  }
              }

              private LinearLayout baseColumn() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                          Color.rgb(14, 15, 20)
                  );

                  return root;
              }

              private LinearLayout topBar(String title) {

                  LinearLayout bar =
                          new LinearLayout(this);

                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(
                          dp(8),
                          0,
                          dp(8),
                          0
                  );

                  TextView back =
                          makeButton("‹  Back");

                  back.setOnClickListener(
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  goBack();
                              }
                          }
                  );

                  bar.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  dp(90),
                                  dp(56)
                          )
                  );

                  TextView titleView =
                          text(
                                  title,
                                  20,
                                  Color.WHITE
                          );

                  titleView.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  bar.addView(
                          titleView,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(56),
                                  1
                          )
                  );

                  return bar;
              }

              private void addTool(
                      LinearLayout parent,
                      String title,
                      View.OnClickListener listener) {

                  TextView item =
                          makeButton(title);

                  item.setOnClickListener(listener);

                  parent.addView(item);
              }

              private void addSmallButton(
                      LinearLayout parent,
                      String title,
                      View.OnClickListener listener) {

                  TextView item =
                          makeButton(title);

                  item.setTextSize(13);

                  item.setOnClickListener(listener);

                  parent.addView(
                          item,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(48),
                                  1
                          )
                  );
              }

              private TextView makeButton(String title) {

                  TextView t =
                          text(
                                  title,
                                  15,
                                  Color.WHITE
                          );

                  t.setGravity(Gravity.CENTER);
                  t.setBackgroundColor(
                          Color.rgb(30, 31, 40)
                  );

                  t.setPadding(
                          dp(10),
                          dp(8),
                          dp(10),
                          dp(8)
                  );

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(58)
                          );

                  p.setMargins(
                          0,
                          dp(5),
                          0,
                          dp(5)
                  );

                  t.setLayoutParams(p);

                  return t;
              }

              private TextView text(
                      String value,
                      float size,
                      int color) {

                  TextView t =
                          new TextView(this);

                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);

                  return t;
              }

              private LinearLayout.LayoutParams lp(
                      int width,
                      int height) {

                  return new LinearLayout.LayoutParams(
                          width,
                          height
                  );
              }

              private void addSpace(
                      LinearLayout root,
                      int height) {

                  root.addView(
                          new View(this),
                          lp(1, dp(height))
                  );
              }

              private int dp(int value) {

                  return (int) (
                          value *
                                  getResources()
                                          .getDisplayMetrics()
                                          .density
                  );
              }

              private void toast(String message) {

                  Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_SHORT
                  ).show();
              }
          }
