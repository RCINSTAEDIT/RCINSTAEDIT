                          );

                          ContentValues v =
                              new ContentValues();

                          v.put(
                              MediaStore.Images.Media.DISPLAY_NAME,
                              "RCINSTAEDIT_"
                                  +System.currentTimeMillis()
                                  +".jpg"
                          );

                          v.put(
                              MediaStore.Images.Media.MIME_TYPE,
                              "image/jpeg"
                          );

                          if(Build.VERSION.SDK_INT>=29)
                              v.put(
                                  MediaStore.Images.Media.RELATIVE_PATH,
                                  "Pictures/RCINSTAEDIT"
                              );

                          Uri u =
                              getContentResolver()
                                  .insert(
                                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                      v
                                  );

                          if(u==null)
                              throw new Exception();

                          OutputStream os =
                              getContentResolver()
                                  .openOutputStream(u);

                          if(os==null)
                              throw new Exception();

                          out.compress(
                              Bitmap.CompressFormat.JPEG,
                              96,
                              os
                          );

                          os.close();
                          out.recycle();

                          runOnUiThread(
                              () -> toast(
                                  "Photo saved in Pictures/RCINSTAEDIT"
                              )
                          );

                      }catch(Exception e){

                          runOnUiThread(
                              () -> toast(
                                  "Save failed"
                              )
                          );
                      }

                  }).start();
              }

