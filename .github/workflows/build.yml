              public static class VignetteView
                      extends View {

                  private int strength = 0;

                  private final Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                          );

                  public VignetteView(
                          android.content.Context context
                  ) {

                      super(context);

                      setClickable(false);
                      setFocusable(false);
                  }

                  public void setStrength(
                          int value
                  ) {

                      strength =
                              Math.max(
                                      0,
                                      Math.min(
                                              100,
                                              value
                                      )
                      );

                      invalidate();
                  }

                  @Override
                  protected void onDraw(
                          Canvas canvas
                  ) {

                      if (strength <= 0) {
                          return;
                      }

                      float cx =
                              getWidth() / 2f;

                      float cy =
                              getHeight() / 2f;

                      float radius =
                              Math.max(
                                      getWidth(),
                                      getHeight()
                              ) *
                                      0.72f;

                      int alpha =
                              (int) (
                                      strength /
                                              100f *
                                              210f
                              );

                      RadialGradient gradient =
                              new RadialGradient(
                                      cx,
                                      cy,
                                      radius,
                                      new int[] {
                                              0x00000000,
                                              0x00000000,
                                              alpha << 24
                                      },
                                      new float[] {
                                              0f,
                                              0.52f,
                                              1f
                                      },
                                      Shader.TileMode.CLAMP
                              );

                      paint.setShader(
                              gradient
                      );

                      canvas.drawRect(
                              0,
                              0,
                              getWidth(),
                              getHeight(),
                              paint
                      );

                      paint.setShader(null);
                  }
              }
          }
