                  updatePreview();

                  setContentViewWithInsets(root);
              }

              private void addSlider(
                      LinearLayout parent,
                      String title,
                      int min,
                      int max,
                      int initial,
                      final SliderCallback callback
              ) {

                  TextView label =
                          text(
                                  title +
                                          ": " +
                                          initial,
                                  15,
                                  Color.WHITE
                          );

                  label.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  parent.addView(
                          label,
                          lp(-1, 42)
                  );

                  SeekBar bar =
                          new SeekBar(this);

                  bar.setMax(max - min);
                  bar.setProgress(
                          initial - min
                  );

                  bar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar seekBar,
                                      int progress,
                                      boolean fromUser
                              ) {

                                  int value =
                                          progress + min;

                                  label.setText(
                                          title +
                                                  ": " +
                                                  value
                                  );

                                  callback.onChanged(
                                          value
                                  );
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }
                          }
                  );

                  parent.addView(
                          bar,
                          lp(-1, 52)
                  );
              }

              private void updatePreview() {

                  if (previewImage == null) {
                      return;
                  }

                  Bitmap source =
                          editedBitmap != null
                                  ? editedBitmap
                                  : originalBitmap;

                  if (source == null) {

                      previewImage.setImageDrawable(
                              null
                      );

                      previewImage.clearColorFilter();

                      return;
                  }

                  if (beforePressed) {

                      previewImage.setImageBitmap(
                              originalBitmap
                      );

                      previewImage.clearColorFilter();

                  } else {

                      previewImage.setImageBitmap(
                              source
                      );

                      ColorMatrixColorFilter filter =
                              buildCombinedFilter();

                      if (filter == null) {
                          previewImage.clearColorFilter();
                      } else {
                          previewImage.setColorFilter(
                                  filter
                          );
                      }
                  }

                  previewImage.setScaleX(zoom);
                  previewImage.setScaleY(zoom);
                  previewImage.setTranslationX(dragX);
                  previewImage.setTranslationY(dragY);
              }

              private ColorMatrixColorFilter
              buildCombinedFilter() {

                  ColorMatrix result =
                          new ColorMatrix();

                  boolean hasEffect = false;

                  if (brightness != 0) {

                      result.postConcat(
                              offsetMatrix(
                                      brightness * 2.0f,
                                      brightness * 2.0f,
                                      brightness * 2.0f
                              )
                      );

                      hasEffect = true;
                  }

                  if (exposure != 0) {

                      float factor =
                              1f +
                                      exposure /
                                              100f *
                                              0.8f;

                      result.postConcat(
                              contrastMatrix(
                                      factor
                              )
                      );

                      hasEffect = true;
                  }

                  if (contrast != 0) {

                      float factor =
                              1f +
                                      contrast /
                                              100f;

                      result.postConcat(
                              contrastMatrix(
                                      factor
                              )
                      );

                      hasEffect = true;
                  }

                  if (saturation != 0) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      saturation /
                                              100f
                      );

                      result.postConcat(sat);

                      hasEffect = true;
                  }

                  if (temperature != 0) {

                      float warm =
                              temperature /
                                      100f;

                      result.postConcat(
                              offsetMatrix(
                                      warm * 18f,
                                      warm * 3f,
                                      -warm * 18f
                              )
                      );

                      hasEffect = true;
                  }

                  if (fade != 0) {

                      float f =
                              fade /
                                      100f;

                      result.postConcat(
                              contrastMatrix(
                                      1f -
                                              0.22f *
                                                      f
                              )
                      );

                      result.postConcat(
                              offsetMatrix(
                                      20f * f,
                                      20f * f,
                                      20f * f
                              )
                      );

                      hasEffect = true;
                  }

                  ColorMatrixColorFilter
                          filter =
                          buildFilterMatrix(
                                  selectedFilter,
                                  filterIntensity
                          );

                  if (filter != null) {

                      ColorMatrix filterMatrix =
                              extractMatrix(filter);

                      result.postConcat(
                              filterMatrix
                      );

                      hasEffect = true;
                  }

                  if (!hasEffect) {
                      return null;
                  }

                  return new ColorMatrixColorFilter(
                          result
                  );
              }

              private ColorMatrix
              extractMatrix(
                      ColorMatrixColorFilter ignored
              ) {

                  ColorMatrix matrix =
                          new ColorMatrix();

                  if ("Original".equals(
                          selectedFilter
                  ) || filterIntensity <= 0) {
                      return matrix;
                  }

                  float amount =
                          filterIntensity /
                                  100f;

                  String name =
                          selectedFilter;

                  if ("Vivid".equals(name)) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      0.45f *
                                              amount
                      );

                      matrix.set(sat);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.18f *
                                                      amount
                              )
                      );

                  } else if ("Vivid Warm".equals(name)) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      0.42f *
                                              amount
                      );

                      matrix.set(sat);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.16f *
                                                      amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      12f * amount,
                                      5f * amount,
                                      -7f * amount
                              )
                      );

                  } else if ("Vivid Cool".equals(name)) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      0.42f *
                                              amount
                      );

                      matrix.set(sat);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.16f *
                                                      amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      -7f * amount,
                                      3f * amount,
                                      13f * amount
                              )
                      );

                  } else if ("Dramatic".equals(name)) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      0.12f *
                                              amount
                      );

                      matrix.set(sat);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.38f *
                                                      amount
                              )
                      );

                  } else if ("Dramatic Warm".equals(name)) {

                      matrix.set(
                              contrastMatrix(
                                      1f +
                                              0.35f *
                                                      amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      12f * amount,
                                      5f * amount,
                                      -8f * amount
                              )
                      );

                  } else if ("Dramatic Cool".equals(name)) {

                      matrix.set(
                              contrastMatrix(
                                      1f +
                                              0.35f *
                                                      amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      -8f * amount,
                                      3f * amount,
                                      14f * amount
                              )
                      );

                  } else if ("Mono".equals(name)) {

                      ColorMatrix mono =
                              new ColorMatrix();

                      mono.setSaturation(0f);

                      matrix.set(mono);

                  } else if ("Silvertone".equals(name)) {

                      ColorMatrix mono =
                              new ColorMatrix();

                      mono.setSaturation(0f);

                      matrix.set(mono);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.15f *
                                                      amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      4f * amount,
                                      4f * amount,
                                      7f * amount
                              )
                      );

                  } else if ("Noir".equals(name)) {

                      ColorMatrix mono =
                              new ColorMatrix();

                      mono.setSaturation(0f);

                      matrix.set(mono);

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.45f *
                                                      amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      -10f * amount,
                                      -10f * amount,
                                      -10f * amount
                              )
                      );

                  } else if ("Warm".equals(name)) {

                      matrix.set(
                              offsetMatrix(
                                      20f * amount,
                                      5f * amount,
                                      -12f * amount
                              )
                      );

                  } else if ("Cool".equals(name)) {

                      matrix.set(
                              offsetMatrix(
                                      -10f * amount,
                                      3f * amount,
                                      20f * amount
                              )
                      );

                  } else if ("Fade".equals(name)) {

                      matrix.set(
                              contrastMatrix(
                                      1f -
                                              0.20f *
                                                      amount
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      18f * amount,
                                      18f * amount,
                                      18f * amount
                              )
                      );
                  }

                  return matrix;
              }

              private ColorMatrixColorFilter
              buildFilterMatrix(
                      String name,
                      int intensity
              ) {

                  if ("Original".equals(name) ||
                          intensity <= 0) {
                      return null;
                  }

                  return new ColorMatrixColorFilter(
                          extractMatrix(null)
                  );
              }

              private ColorMatrix contrastMatrix(
                      float contrast
              ) {

                  float offset =
                          128f *
                                  (1f - contrast);

                  return new ColorMatrix(
                          new float[] {
                                  contrast, 0, 0, 0, offset,
                                  0, contrast, 0, 0, offset,
                                  0, 0, contrast, 0, offset,
                                  0, 0, 0, 1, 0
                          }
                  );
              }

              private ColorMatrix offsetMatrix(
                      float r,
                      float g,
                      float b
              ) {

                  return new ColorMatrix(
                          new float[] {
                                  1, 0, 0, 0, r,
                                  0, 1, 0, 0, g,
                                  0, 0, 1, 0, b,
                                  0, 0, 0, 1, 0
                          }
                  );
              }

              private void showBefore() {

                  if (previewImage == null ||
                          originalBitmap == null) {
                      return;
                  }

                  previewImage.setImageBitmap(
                          originalBitmap
                  );

                  previewImage.clearColorFilter();
              }

              private void setupPreviewTouch() {

                  if (previewImage == null) {
                      return;
                  }

                  previewImage.setOnTouchListener(
                          new View.OnTouchListener() {
                              @Override
                              public boolean onTouch(
                                      View v,
                                      MotionEvent event
                              ) {

                                  if (zoom <= 1f) {
                                      return true;
                                  }

                                  if (event.getActionMasked() ==
                                          MotionEvent.ACTION_DOWN) {

                                      lastX =
                                              event.getRawX();

                                      lastY =
                                              event.getRawY();

                                      return true;
                                  }

                                  if (event.getActionMasked() ==
                                          MotionEvent.ACTION_MOVE) {

                                      float dx =
                                              event.getRawX() -
                                                      lastX;

                                      float dy =
                                              event.getRawY() -
                                                      lastY;

                                      dragX += dx;
                                      dragY += dy;

                                      lastX =
                                              event.getRawX();

                                      lastY =
                                              event.getRawY();

                                      updatePreview();

                                      return true;
                                  }

                                  return true;
                              }
                          }
                  );
              }

              private boolean hasPhoto() {

                  if (editedBitmap == null) {
                      toast(
                              "Pehle photo choose karo"
                      );
                      return false;
                  }

                  return true;
              }

              private void pickImage() {

                  Intent intent =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                          );

                  intent.setType("image/*");

                  intent.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          intent,
                          PICK_IMAGE
                  );
              }

              private void pickAudio() {

                  Intent intent =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                          );

                  intent.setType("audio/*");

                  intent.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          intent,
                          PICK_AUDIO
                  );
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (resultCode != RESULT_OK ||
                          data == null ||
                          data.getData() == null) {
                      return;
                  }

                  if (requestCode == PICK_IMAGE) {

                      try {

                          Uri uri =
                                  data.getData();

                          Bitmap bitmap =
                                  BitmapFactory
                                          .decodeStream(
                                                  getContentResolver()
                                                          .openInputStream(
                                                                  uri
                                                          )
                                          );

                          if (bitmap == null) {
                              toast(
                                      "Photo load nahi hui"
                              );
                              return;
                          }

                          originalBitmap =
                                  bitmap;

                          editedBitmap =
                                  bitmap.copy(
                                          bitmap.getConfig(),
                                          true
                                  );

                          selectedFilter =
                                  "Original";

                          filterIntensity = 100;

                          brightness = 0;
                          exposure = 0;
                          contrast = 0;
                          saturation = 0;
                          temperature = 0;
                          fade = 0;

                          zoom = 1f;
                          dragX = 0f;
                          dragY = 0f;

                          renderScreen();

                      } catch (Exception e) {

                          toast(
                                  "Photo open nahi hui"
                          );
                      }
                  }
              }

              private void rotate90() {

                  if (!hasPhoto()) {
                      return;
                  }

                  Matrix matrix =
                          new Matrix();

                  matrix.postRotate(90);

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  0,
                                  0,
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight(),
                                  matrix,
                                  true
                          );

                  resetViewOnly();
                  updatePreview();
              }

              private void flipHorizontal() {

                  if (!hasPhoto()) {
                      return;
                  }

                  Matrix matrix =
                          new Matrix();

                  matrix.setScale(-1, 1);

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  0,
                                  0,
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight(),
                                  matrix,
                                  true
                          );

                  resetViewOnly();
                  updatePreview();
              }

              private void flipVertical() {

                  if (!hasPhoto()) {
                      return;
                  }

                  Matrix matrix =
                          new Matrix();

                  matrix.setScale(1, -1);

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  0,
                                  0,
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight(),
                                  matrix,
                                  true
                          );

                  resetViewOnly();
                  updatePreview();
              }

              private void centerCrop() {

                  if (!hasPhoto()) {
                      return;
                  }

                  int size =
                          Math.min(
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight()
                          );

                  int left =
                          (
                                  editedBitmap.getWidth() -
                                          size
                          ) / 2;

                  int top =
                          (
                                  editedBitmap.getHeight() -
                                          size
                          ) / 2;

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  left,
                                  top,
                                  size,
                                  size
                          );

                  resetViewOnly();
                  updatePreview();
              }

              private void resetPhoto() {

                  if (originalBitmap == null) {
                      return;
                  }

                  editedBitmap =
                          originalBitmap.copy(
                                  originalBitmap.getConfig(),
                                  true
                          );

                  selectedFilter =
                          "Original";

                  filterIntensity = 100;

                  brightness = 0;
                  exposure = 0;
                  contrast = 0;
                  saturation = 0;
                  temperature = 0;
                  fade = 0;

                  resetViewOnly();
                  updatePreview();

                  toast(
                          "Photo reset ho gayi"
                  );
              }

              private void resetViewOnly() {

                  zoom = 1f;
                  dragX = 0f;
                  dragY = 0f;
              }

              private void savePhoto() {

                  if (!hasPhoto()) {
                      return;
                  }

                  try {

                      Bitmap output =
                              Bitmap.createBitmap(
                                      editedBitmap.getWidth(),
                                      editedBitmap.getHeight(),
                                      Bitmap.Config.ARGB_8888
                              );

                      Canvas canvas =
                              new Canvas(output);

                      Paint paint =
                              new Paint(
                                      Paint.ANTI_ALIAS_FLAG |
                                              Paint.FILTER_BITMAP_FLAG
                              );

                      ColorMatrixColorFilter filter =
                              buildCombinedFilter();

                      if (filter != null) {
                          paint.setColorFilter(filter);
                      }

                      canvas.drawBitmap(
                              editedBitmap,
                              0,
                              0,
                              paint
                      );

                      ContentValues values =
                              new ContentValues();

                      values.put(
                              MediaStore.Images.Media.DISPLAY_NAME,
                              "RCINSTAEDIT_" +
                                      System.currentTimeMillis() +
                                      ".jpg"
                      );

                      values.put(
                              MediaStore.Images.Media.MIME_TYPE,
                              "image/jpeg"
                      );

                      if (Build.VERSION.SDK_INT >= 29) {

                          values.put(
                                  MediaStore.Images.Media.RELATIVE_PATH,
                                  "Pictures/RCINSTAEDIT"
                          );
                      }

                      Uri uri =
                              getContentResolver()
                                      .insert(
                                              MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                              values
                                      );

                      if (uri == null) {
                          toast("Save failed");
                          return;
                      }

                      OutputStream stream =
                              getContentResolver()
                                      .openOutputStream(uri);

                      if (stream == null) {
                          toast("Save failed");
                          return;
                      }

                      output.compress(
                              Bitmap.CompressFormat.JPEG,
                              95,
                              stream
                      );

                      stream.close();

                      output.recycle();

                      toast(
                              "Saved in Pictures/RCINSTAEDIT"
                      );

                  } catch (Exception e) {

                      toast(
                              "Photo save nahi ho payi"
                      );
                  }
              }

              private LinearLayout baseColumn() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setBackgroundColor(
                          Color.rgb(14, 15, 20)
                  );

                  root.setClipToPadding(false);

                  return root;
              }

              private void setContentViewWithInsets(
                      final View root
              ) {

                  root.setOnApplyWindowInsetsListener(
                          new View.OnApplyWindowInsetsListener() {

                              @Override
                              public WindowInsets
                              onApplyWindowInsets(
                                      View v,
                                      WindowInsets insets
                              ) {

                                  int top = 0;
                                  int bottom = 0;
                                  int left = 0;
                                  int right = 0;

                                  if (Build.VERSION.SDK_INT >= 30) {

                                      android.graphics.Insets system =
                                              insets.getInsets(
                                                      WindowInsets.Type.systemBars() |
                                                              WindowInsets.Type.displayCutout()
                                              );

                                      top = system.top;
                                      bottom = system.bottom;
                                      left = system.left;
                                      right = system.right;

                                  } else {

                                      top =
                                              insets.getSystemWindowInsetTop();

                                      bottom =
                                              insets.getSystemWindowInsetBottom();

                                      left =
                                              insets.getSystemWindowInsetLeft();

                                      right =
                                              insets.getSystemWindowInsetRight();
                                  }

                                  root.setPadding(
                                          left,
                                          top,
                                          right,
                                          bottom
                                  );

                                  return insets;
                              }
                          }
                  );

                  setContentView(root);

                  root.requestApplyInsets();
              }

