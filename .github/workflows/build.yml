      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
