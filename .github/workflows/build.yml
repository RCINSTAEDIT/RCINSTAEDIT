              void addSlider(
                      int index,
                      int min,
                      int max
              ) {

                  LinearLayout row =
                          new LinearLayout(this);

                  row.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  TextView label =
                          text(
                                  names[index]
                                          + "  "
                                          + Math.round(
