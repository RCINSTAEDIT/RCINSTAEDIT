                              runOnUiThread(
                                  () -> toast(
                                      "Export failed: "+
                                      e.getMessage()
                                  )
                              );
                          }

                      }
                  ).start();
              }

              private void remux(
                      Uri uri,
                      File output,
                      long startUs,
                      long endUs
              ) throws Exception {

                  MediaExtractor extractor =
                      new MediaExtractor();

                  extractor.setDataSource(
                      this,
                      uri,
                      null
                  );

                  int trackCount =
                      extractor.getTrackCount();

                  MediaMuxer muxer =
                      new MediaMuxer(
                          output.getAbsolutePath(),
                          MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4
                      );

                  int[] map =
                      new int[trackCount];

                  java.util.Arrays.fill(
                      map,
                      -1
                  );

                  for(
                      int i=0;
                      i<trackCount;
                      i++
                  ) {

                      MediaFormat f =
                          extractor.getTrackFormat(i);

                      String mime =
                          f.getString(
                              MediaFormat.KEY_MIME
                          );

                      if(
                          mime!=null &&
                          (
                              mime.startsWith("video/")
                              ||
                              (
                                  mime.startsWith("audio/")
                                  && !muted
                              )
                          )
                      ) {

                          map[i]=
                              muxer.addTrack(f);
                      }
                  }

                  if(rotation!=0) {
                      try {
                          muxer.setOrientationHint(
                              rotation
                          );
                      } catch(Exception ignored) {}
                  }

                  muxer.start();

                  int bufferSize =
                      1024*1024;

                  for(int i=0;i<trackCount;i++) {

                      MediaFormat f =
                          extractor.getTrackFormat(i);

                      if(
                          f.containsKey(
                              MediaFormat.KEY_MAX_INPUT_SIZE
                          )
                      ) {
                          bufferSize =
                              Math.max(
                                  bufferSize,
                                  f.getInteger(
                                      MediaFormat.KEY_MAX_INPUT_SIZE
                                  )
                              );
                      }
                  }

                  ByteBuffer buffer =
                      ByteBuffer.allocateDirect(
                          bufferSize
                      );

                  android.media.MediaCodec.BufferInfo info =
                      new android.media.MediaCodec.BufferInfo();

                  for(
                      int i=0;
                      i<trackCount;
                      i++
                  ) {

                      if(map[i]<0) continue;

                      extractor.selectTrack(i);

                      extractor.seekTo(
                          startUs,
                          MediaExtractor.SEEK_TO_CLOSEST_SYNC
                      );

                      while(true) {

                          int track =
                              extractor.getSampleTrackIndex();

                          if(track<0) break;

                          long pts =
                              extractor.getSampleTime();

                          if(pts<startUs) {
                              extractor.advance();
                              continue;
                          }

                          if(pts>endUs) break;

                          buffer.clear();

                          int size =
                              extractor.readSampleData(
                                  buffer,
                                  0
                              );

                          if(size<0) break;

                          long newPts =
                              (long)(
                                  (pts-startUs)
                                  /speed
                              );

                          info.offset=0;
                          info.size=size;
                          info.presentationTimeUs=
                              Math.max(
                                  0,
                                  newPts
                              );

                          info.flags =
                              extractor.getSampleFlags();

                          muxer.writeSampleData(
                              map[i],
                              buffer,
                              info
                          );

                          extractor.advance();
                      }

                      extractor.unselectTrack(i);
                  }

                  muxer.stop();
                  muxer.release();
                  extractor.release();
              }

              private void saveToGallery(
                      File file
              ) throws Exception {

                  ContentValues v =
                      new ContentValues();

                  v.put(
                      MediaStore.Video.Media.DISPLAY_NAME,
                      "RCINSTAEDIT_"+
                      System.currentTimeMillis()+
                      ".mp4"
                  );

                  v.put(
                      MediaStore.Video.Media.MIME_TYPE,
                      "video/mp4"
                  );

                  if(Build.VERSION.SDK_INT>=29) {
                      v.put(
                          MediaStore.Video.Media.RELATIVE_PATH,
                          "Movies/RCINSTAEDIT"
                      );
                  }

                  Uri uri =
                      getContentResolver()
                          .insert(
                              MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                              v
                          );

                  if(uri==null)
                      throw new Exception(
                          "Gallery insert failed"
                      );

                  OutputStream out =
                      getContentResolver()
                          .openOutputStream(uri);

                  InputStream in =
                      new java.io.FileInputStream(
                          file
                      );

                  byte[] buf =
                      new byte[64*1024];

                  int n;

                  while(
                      (n=in.read(buf))!=-1
                  ) {
                      out.write(
                          buf,
                          0,
                          n
                      );
                  }

                  in.close();
                  out.close();
              }

              private void toast(String s) {
                  Toast.makeText(
                      this,
                      s,
                      Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacks(ticker);

                  if(videoView!=null) {
                      videoView.stopPlayback();
                  }

                  player=null;

                  super.onDestroy();
              }
          }
