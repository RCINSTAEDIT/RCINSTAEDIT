              void rotate() {

                  if (original == null)
                      return;

                  push();

                  Matrix matrix =
                          new Matrix();

                  matrix.postRotate(90);

                  Bitmap old =
                          original;

                  original =
                          Bitmap.createBitmap(
                                  old,
                                  0,
                                  0,
                                  old.getWidth(),
                                  old.getHeight(),
                                  matrix,
                                  true
                          );

                  if (
                          old != original
                          && !old.isRecycled()
                  ) {

                      old.recycle();
                  }

                  render();
              }

              void flip() {

                  if (original == null)
                      return;

                  push();

                  Matrix matrix =
                          new Matrix();

                  matrix.postScale(-1,1);

                  Bitmap old =
                          original;

                  original =
                          Bitmap.createBitmap(
                                  old,
                                  0,
                                  0,
                                  old.getWidth(),
                                  old.getHeight(),
                                  matrix,
                                  true
                          );

                  if (
                          old != original
                          && !old.isRecycled()
                  ) {

                      old.recycle();
                  }

                  render();
              }

              void crop() {

                  if (original == null)
                      return;

                  push();

                  int w =
                          original.getWidth();

                  int h =
                          original.getHeight();

                  int side =
                          Math.min(w,h);

                  Bitmap old =
                          original;

                  original =
                          Bitmap.createBitmap(
                                  old,
                                  (w-side)/2,
                                  (h-side)/2,
                                  side,
                                  side
                          );

                  if (
                          old != original
                          && !old.isRecycled()
                  ) {

                      old.recycle();
                  }

                  render();
              }

              void save() {

                  if (original == null) {

                      toast(
                              "Pehle photo choose karo"
                      );

                      return;
                  }

                  toast("Saving...");

                  new Thread(
                          () -> {

                              try {

                                  Bitmap output =
                                          Bitmap.createBitmap(
                                                  original.getWidth(),
                                                  original.getHeight(),
                                                  Bitmap.Config.ARGB_8888
                                          );

                                  Canvas canvas =
                                          new Canvas(output);

                                  Paint paint =
                                          new Paint(
                                                  Paint.ANTI_ALIAS_FLAG
                                          );

                                  paint.setColorFilter(
                                          new ColorMatrixColorFilter(
                                                  matrix()
                                          )
                                  );

                                  canvas.drawBitmap(
                                          original,
                                          0,
                                          0,
                                          paint
                                  );

                                  ContentValues cv =
                                          new ContentValues();

                                  cv.put(
                                          MediaStore.Images.Media.DISPLAY_NAME,
                                          "RCINSTAEDIT_"
                                                  + System.currentTimeMillis()
                                                  + ".jpg"
                                  );

                                  cv.put(
                                          MediaStore.Images.Media.MIME_TYPE,
                                          "image/jpeg"
                                  );

                                  if (
                                          Build.VERSION.SDK_INT >= 29
                                  ) {

                                      cv.put(
                                              MediaStore.Images.Media.RELATIVE_PATH,
                                              "Pictures/RCINSTAEDIT"
                                      );
                                  }

                                  Uri saved =
                                          getContentResolver()
                                                  .insert(
                                                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                                          cv
                                                  );

                                  if (saved == null)
                                      throw new Exception();

                                  OutputStream out =
                                          getContentResolver()
                                                  .openOutputStream(
                                                          saved
                                                  );

                                  if (out == null)
                                      throw new Exception();

                                  output.compress(
                                          Bitmap.CompressFormat.JPEG,
                                          96,
                                          out
                                  );

                                  out.close();

                                  output.recycle();

                                  runOnUiThread(
                                          () -> toast(
                                                  "Photo saved"
                                          )
                                  );

                              } catch (Exception e) {

                                  runOnUiThread(
                                          () -> toast(
                                                  "Save failed"
                                          )
                                  );
                              }

                          }
                  ).start();
              }

              static class State {

                  float[] values;

                  int filter;

                  int intensity;

                  State(
                          float[] v,
                          int f,
                          int i
                  ) {

                      values =
                              v.clone();

                      filter = f;

                      intensity = i;
                  }
              }

              void toast(String s) {

                  Toast.makeText(
                          this,
                          s,
                          Toast.LENGTH_SHORT
                  ).show();
              }
          }
