                              }
                          }
                  );

                  setContentView(root);
              }

              private void showPhotoEditor() {

                  LinearLayout root = baseColumn();

                  root.addView(
                          topBar("Photo Editor")
                  );

                  FrameLayout previewBox =
                          new FrameLayout(this);

                  previewBox.setBackgroundColor(
                          Color.BLACK
                  );

                  previewImage =
                          new ImageView(this);

                  previewImage.setScaleType(
                          ImageView.ScaleType.FIT_CENTER
                  );

                  previewImage.setBackgroundColor(
                          Color.BLACK
                  );

                  previewBox.addView(
                          previewImage,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );

                  root.addView(
                          previewBox,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(300)
                          )
                  );

                  setupPreviewTouch();

                  TextView photoButton;

                  if (originalBitmap == null) {
                      photoButton =
                              makeButton(
                                      "📷  CHOOSE PHOTO"
                              );
                  } else {
                      photoButton =
                              makeButton(
                                      "🔄  CHANGE PHOTO"
                              );
                  }

                  photoButton.setOnClickListener(
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  pickImage();
                              }
                          }
                  );

                  root.addView(photoButton);

                  LinearLayout quick =
                          new LinearLayout(this);

                  quick.setGravity(Gravity.CENTER);

                  quick.setPadding(
                          dp(8),
                          dp(5),
                          dp(8),
                          dp(5)
                  );

                  addSmallButton(
                          quick,
                          "FIT",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  zoom = 1f;
                                  dragX = 0f;
                                  dragY = 0f;
                                  updatePreview();
                              }
                          }
                  );

                  addSmallButton(
                          quick,
                          "1:1",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
