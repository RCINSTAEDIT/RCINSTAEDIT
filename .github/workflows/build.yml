name: RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create clean Android project
        shell: bash
        run: |
          rm -rf app build .gradle gradle
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/rcinstaedit
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0B0F</item>
                  <item name="android:navigationBarColor">#0B0B0F</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="RCINSTAEDIT"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/MainActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.widget.VideoView;
          import android.widget.MediaController;

          import java.io.OutputStream;

          public class MainActivity extends Activity {

              LinearLayout root;
              ImageView image;

              Bitmap original;
              Bitmap edited;

              float brightness = 0;
              float contrast = 1f;
              float saturation = 1f;
              float warmth = 0;

              final int BG = Color.rgb(11,11,15);
              final int CARD = Color.rgb(28,28,35);
              final int CARD2 = Color.rgb(38,38,47);

              int dp(float v) {
                  return (int)(v * getResources()
                      .getDisplayMetrics().density + .5f);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  home();
              }

              TextView text(String s, float size) {
                  TextView t = new TextView(this);

                  t.setText(s);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  t.setGravity(Gravity.CENTER_VERTICAL);

                  t.setIncludeFontPadding(true);
                  t.setPadding(dp(18),dp(10),
                      dp(18),dp(10));

                  return t;
              }

              TextView card(String s) {
                  TextView t = text(s,15);

                  t.setGravity(Gravity.CENTER);
                  t.setMinHeight(dp(58));
                  t.setBackgroundColor(CARD);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1, dp(58));

                  p.setMargins(
                      dp(12),dp(5),
                      dp(12),dp(5));

                  t.setLayoutParams(p);

                  t.setClickable(true);

                  return t;
              }

              void page() {
                  root = new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL);

                  root.setBackgroundColor(BG);

                  root.setPadding(
                      0,dp(14),0,dp(18));

                  ScrollView scroll =
                      new ScrollView(this);

                  scroll.setFillViewport(true);
                  scroll.addView(root);

                  setContentView(scroll);
              }

              void title(String s) {
                  TextView t=text(s,25);
                  t.setGravity(Gravity.CENTER);
                  t.setTypeface(null,1);

                  root.addView(
                      t,
                      new LinearLayout.LayoutParams(
                          -1,dp(64)));
              }

              void section(String s) {
                  TextView t=text(s,18);
                  t.setTypeface(null,1);

                  t.setPadding(
                      dp(18),dp(18),
                      dp(18),dp(8));

                  root.addView(t);
              }

              TextView back() {
                  TextView b=card("←   Back");
                  b.setOnClickListener(v -> home());
                  return b;
              }

              void home() {
                  page();

                  TextView logo=text(
                      "RCINSTAEDIT",30);

                  logo.setGravity(Gravity.CENTER);
                  logo.setTypeface(null,1);

                  root.addView(
                      logo,
                      new LinearLayout.LayoutParams(
                          -1,dp(70)));

                  TextView sub=text(
                      "PHOTO  •  VIDEO  •  CREATE",14
