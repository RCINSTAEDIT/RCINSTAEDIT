name: Build RCINSTAEDIT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/rcinstaedit/app
          mkdir -p app/src/main/res/values

          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name = "RCINSTAEDIT"' \
          'include(":app")' \
          > settings.gradle

          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application" version "8.7.3" apply false' \
          '}' \
          > build.gradle

          printf '%s\n' \
          'android.useAndroidX=true' \
          'android.nonTransitiveRClass=true' \
          > gradle.properties

          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application"' \
          '}' \
          '' \
          'android {' \
          '    namespace "com.rcinstaedit.app"' \
          '    compileSdk 35' \
          '' \
          '    defaultConfig {' \
          '        applicationId "com.rcinstaedit.app"' \
          '        minSdk 23' \
          '        targetSdk 35' \
          '        versionCode 1' \
          '        versionName "1.0"' \
          '    }' \
          '}' \
          '' \
          'dependencies {' \
          '    implementation "androidx.appcompat:appcompat:1.7.0"' \
          '    implementation "androidx.activity:activity:1.10.1"' \
          '    implementation "androidx.core:core:1.16.0"' \
          '}' \
          > app/build.gradle

          printf '%s\n' \
          '<resources>' \
          '    <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">' \
          '        <item name="android:fontFamily">sans</item>' \
          '        <item name="android:windowLightStatusBar">false</item>' \
          '        <item name="android:statusBarColor">#0B0B0F</item>' \
          '        <item name="android:navigationBarColor">#0B0B0F</item>' \
          '        <item name="android:colorAccent">#FFFFFF</item>' \
          '    </style>' \
          '</resources>' \
          > app/src/main/res/values/themes.xml

          printf '%s\n' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '' \
          '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' \
          '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' \
          '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' \
          '' \
          '    <application' \
          '        android:theme="@style/AppTheme"' \
          '        android:label="RCINSTAEDIT"' \
          '        android:allowBackup="true"' \
          '        android:supportsRtl="true">' \
          '' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:screenOrientation="portrait"' \
          '            android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '        </activity>' \
          '' \
          '    </application>' \
          '</manifest>' \
          > app/src/main/AndroidManifest.xml

          cat > app/src/main/java/com/rcinstaedit/app/MainActivity.java <<'JAVA'
          package com.rcinstaedit.app;

          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.VideoView;
          import android.widget.MediaController;
          import android.widget.Toast;

          import java.io.OutputStream;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              LinearLayout root;
              ImageView image;
              Bitmap originalBitmap;
              Bitmap workingBitmap;

              float brightness = 0;
              float contrast = 1f;
              float saturation = 1f;
              float warmth = 0;

              int BG = Color.rgb(11,11,15);
              int CARD = Color.rgb(27,27,35);
              int WHITE = Color.WHITE;
              int GRAY = Color.rgb(175,175,185);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              TextView text(String value, float size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextColor(WHITE);
                  t.setTextSize(size);
                  t.setPadding(20, 12, 20, 12);
                  return t;
              }

              TextView section(String value) {
                  TextView t = text(value, 18);
                  t.setTextColor(WHITE);
                  t.setPadding(20, 25, 20, 8);
                  return t;
              }

              Button btn(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  b.setTextColor(WHITE);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER);
                  b.setBackgroundColor(CARD);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  58);
                  p.setMargins(14, 6, 14, 6);
                  b.setLayoutParams(p);

                  return b;
              }

              void setup() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  setContentView(root);
              }

              Button backButton() {
                  Button b = btn("←  Back");
                  b.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showHome();
                      }
                  });
                  return b;
              }

              void showHome() {
                  setup();

                  TextView logo = text("RCINSTAEDIT", 30);
                  logo.setGravity(Gravity.CENTER);
                  logo.setPadding(10, 30, 10, 5);
                  root.addView(logo);

                  TextView sub = text(
                          "PHOTO  •  VIDEO  •  CREATE",
                          13);
                  sub.setGravity(Gravity.CENTER);
                  sub.setTextColor(GRAY);
                  root.addView(sub);

                  root.addView(section("CREATE"));

                  Button photo = btn("📷  Photo Editor");
                  Button video = btn("🎬  Video Editor");
                  Button effects = btn("✨  Effects & Filters");
                  Button transitions = btn("↔  Transitions");

                  root.addView(photo);
                  root.addView(video);
                  root.addView(effects);
                  root.addView(transitions);

                  root.addView(section("PHOTO TOOLS"));
                  root.addView(text(
                          "Adjust • Crop • Rotate • Flip • Filters • Export",
                          14));

                  root.addView(section("VIDEO TOOLS"));
                  root.addView(text(
                          "Trim • Split • Speed • Crop • Rotate • Filters • Adjust",
                          14));

                  photo.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          pickPhoto();
                      }
                  });

                  video.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          pickVideo();
                      }
                  });

                  effects.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showEffects();
                      }
                  });

                  transitions.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showTransitions();
                      }
                  });
              }

              void pickPhoto() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("image/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i, 100);
              }

              void pickVideo() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("video/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i, 200);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data);

                  if (resultCode != RESULT_OK || data == null) {
                      return;
                  }

                  Uri uri = data.getData();

                  if (requestCode == 100) {
                      try {
                          Bitmap b =
                                  MediaStore.Images.Media.getBitmap(
                                          getContentResolver(),
                                          uri);

                          originalBitmap = b.copy(
                                  Bitmap.Config.ARGB_8888,
                                  true);

                          workingBitmap = originalBitmap.copy(
                                  Bitmap.Config.ARGB_8888,
                                  true);

                          showPhotoEditor();

                      } catch (Exception e) {
                          toast("Photo open nahi ho payi");
                      }
                  }

                  if (requestCode == 200) {
                      showVideoEditor(uri);
                  }
              }

              void showPhotoEditor() {
                  setup();

                  TextView h = text("PHOTO EDITOR", 25);
                  root.addView(h);

                  image = new ImageView(this);
                  image.setImageBitmap(workingBitmap);
                  image.setAdjustViewBounds(true);
                  image.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  LinearLayout.LayoutParams ip =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  430);
                  ip.setMargins(8, 8, 8, 8);

                  root.addView(image, ip);

                  Button adjust = btn("🎚  Adjust");
                  Button filters = btn("✨  Filters & Effects");
                  Button transform = btn("✂  Crop / Rotate / Flip");
                  Button undo = btn("↶  Restore Original");
                  Button save = btn("💾  Export Photo");

                  root.addView(adjust);
                  root.addView(filters);
                  root.addView(transform);
                  root.addView(undo);
                  root.addView(save);

                  adjust.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showAdjust();
                      }
                  });

                  filters.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showPhotoFilters();
                      }
                  });

                  transform.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showTransform();
                      }
                  });

                  undo.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          resetPhoto();
                      }
                  });

                  save.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          savePhoto();
                      }
                  });
              }

              void showAdjust() {
                  setup();

                  root.addView(text("ADJUST", 25));

                  root.addView(text(
                          "Fine tune your photo",
                          14));

                  addSlider(
                          "Brightness",
                          -100,
                          100,
                          0,
                          new SliderAction() {
                              @Override
                              public void change(int value) {
                                  brightness = value;
                                  applyAdjust();
                              }
                          });

                  addSlider(
                          "Contrast",
                          50,
                          150,
                          100,
                          new SliderAction() {
                              @Override
                              public void change(int value) {
                                  contrast = value / 100f;
                                  applyAdjust();
                              }
                          });

                  addSlider(
                          "Saturation",
                          0,
                          200,
                          100,
                          new SliderAction() {
                              @Override
                              public void change(int value) {
                                  saturation = value / 100f;
                                  applyAdjust();
                              }
                          });

                  addSlider(
                          "Warmth",
                          -100,
                          100,
                          0,
                          new SliderAction() {
                              @Override
                              public void change(int value) {
                                  warmth = value;
                                  applyAdjust();
                              }
                          });

                  addSlider(
                          "Exposure",
                          -100,
                          100,
                          0,
                          new SliderAction() {
                              @Override
                              public void change(int value) {
                                  brightness = value;
                                  applyAdjust();
                              }
                          });

                  addSlider(
                          "Highlights",
                          -100,
                          100,
                          0,
                          new SliderAction() {
                              @Override
                              public void change(int value) {
                                  // Reserved for advanced engine
                              }
                          });

                  addSlider(
                          "Shadows",
                          -100,
                          100,
                          0,
                          new SliderAction() {
                              @Override
                              public void change(int value) {
                                  // Reserved for advanced engine
                              }
                          });

                  addSlider(
                          "Sharpness",
                          0,
                          100,
                          0,
                          new SliderAction() {
                              @Override
                              public void change(int value) {
                                  // Reserved for advanced engine
                              }
                          });

                  addSlider(
                          "Vignette",
                          0,
                          100,
                          0,
                          new SliderAction() {
                              @Override
                              public void change(int value) {
                                  // Reserved for advanced engine
                              }
                          });

                  root.addView(backButton());
              }

              interface SliderAction {
                  void change(int value);
              }

              void addSlider(
                      String name,
                      int min,
                      int max,
                      int start,
                      final SliderAction action) {

                  root.addView(text(name, 15));

                  SeekBar bar = new SeekBar(this);
                  bar.setMax(max - min);
                  bar.setProgress(start - min);

                  bar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar seekBar,
                                      int progress,
                                      boolean fromUser) {

                                  action.change(
                                          progress +
                                          seekBar.getTag() instanceof Integer
                                                  ? 0 : 0);
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar seekBar) {
                              }

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar seekBar) {
                              }
                          });

                  bar.setTag(min);

                  bar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar seekBar,
                                      int progress,
                                      boolean fromUser) {

                                  int minimum =
                                          (Integer) seekBar.getTag();

                                  action.change(
                                          progress + minimum);
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar seekBar) {
                              }

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar seekBar) {
                              }
                          });

                  root.addView(bar);
              }

              void applyAdjust() {

                  if (originalBitmap == null ||
                          image == null) {
                      return;
                  }

                  ColorMatrix finalMatrix =
                          new ColorMatrix();

                  ColorMatrix sat =
                          new ColorMatrix();

                  sat.setSaturation(saturation);
                  finalMatrix.postConcat(sat);

                  float c = contrast;
                  float b = brightness;

                  float shift =
                          128f * (1f - c) + b;

                  ColorMatrix con =
                          new ColorMatrix(
                                  new float[] {
                                          c, 0, 0, 0, shift,
                                          0, c, 0, 0, shift,
                                          0, 0, c, 0, shift,
                                          0, 0, 0, 1, 0
                                  });

                  finalMatrix.postConcat(con);

                  float w = warmth;

                  ColorMatrix warm =
                          new ColorMatrix(
                                  new float[] {
                                          1, 0, 0, 0, w,
                                          0, 1, 0, 0, 0,
                                          0, 0, 1, 0, -w,
                                          0, 0, 0, 1, 0
                                  });

                  finalMatrix.postConcat(warm);

                  Bitmap out =
                          Bitmap.createBitmap(
                                  originalBitmap.getWidth(),
                                  originalBitmap.getHeight(),
                                  Bitmap.Config.ARGB_8888);

                  Canvas canvas =
                          new Canvas(out);

                  Paint paint = new Paint();

                  paint.setColorFilter(
                          new ColorMatrixColorFilter(
                                  finalMatrix));

                  canvas.drawBitmap(
                          originalBitmap,
                          0,
                          0,
                          paint);

                  workingBitmap = out;
                  image.setImageBitmap(out);
              }

              void showPhotoFilters() {
                  setup();

                  root.addView(text(
                          "FILTERS & EFFECTS",
                          25));

                  String[] filters = {
                          "Original",
                          "Black & White",
                          "Cinematic",
                          "Vintage",
                          "Cool",
                          "Warm",
                          "Dramatic",
                          "Fade",
                          "Glow",
                          "HDR Style"
                  };

                  for (int x = 0; x < filters.length; x++) {

                      final String filter =
                              filters[x];

                      Button b = btn(filter);

                      root.addView(b);

                      b.setOnClickListener(
                              new View.OnClickListener() {
                                  @Override
                                  public void onClick(
                                          View v) {
                                      applyFilter(filter);
                                  }
                              });
                  }

                  root.addView(backButton());
              }

              void applyFilter(String filter) {

                  if (originalBitmap == null) {
                      return;
                  }

                  ColorMatrix cm =
                          new ColorMatrix();

                  if (filter.equals("Black & White")) {

                      cm.setSaturation(0);

                  } else if (filter.equals("Cool")) {

                      cm.set(new float[] {
                              1, 0, 0, 0, -5,
                              0, 1, 0, 0, 0,
                              0, 0, 1, 0, 18,
                              0, 0, 0, 1, 0
                      });

                  } else if (filter.equals("Warm")) {

                      cm.set(new float[] {
                              1, 0, 0, 0, 18,
                              0, 1, 0, 0, 5,
                              0, 0, 1, 0, -8,
                              0, 0, 0, 1, 0
                      });

                  } else if (filter.equals("Vintage")) {

                      cm.set(new float[] {
                              .90f, 0, 0, 0, 20,
                              0, .84f, 0, 0, 15,
                              0, 0, .72f, 0, 5,
                              0, 0, 0, 1, 0
                      });

                  } else if (filter.equals("Dramatic")) {

                      cm.set(new float[] {
                              1.25f, 0, 0, 0, -30,
                              0, 1.25f, 0, 0, -30,
                              0, 0, 1.25f, 0, -30,
                              0, 0, 0, 1, 0
                      });

                  } else if (filter.equals("Fade")) {

                      cm.set(new float[] {
                              .85f, 0, 0, 0, 25,
                              0, .85f, 0, 0, 25,
                              0, 0, .85f, 0, 25,
                              0, 0, 0, 1, 0
                      });
                  }

                  Bitmap out =
                          Bitmap.createBitmap(
                                  originalBitmap.getWidth(),
                                  originalBitmap.getHeight(),
                                  Bitmap.Config.ARGB_8888);

                  Canvas canvas =
                          new Canvas(out);

                  Paint p = new Paint();

                  p.setColorFilter(
                          new ColorMatrixColorFilter(cm));

                  canvas.drawBitmap(
                          originalBitmap,
                          0,
                          0,
                          p);

                  workingBitmap = out;

                  if (image != null) {
                      image.setImageBitmap(out);
                  }
              }

              void showTransform() {
                  setup();

                  root.addView(text(
                          "CROP / ROTATE / FLIP",
                          25));

                  Button rotate =
                          btn("↻  Rotate 90°");

                  Button flipH =
                          btn("↔  Flip Horizontal");

                  Button flipV =
                          btn("↕  Flip Vertical");

                  Button crop =
                          btn("✂  Crop");

                  root.addView(rotate);
                  root.addView(flipH);
                  root.addView(flipV);
                  root.addView(crop);
                  root.addView(backButton());

                  rotate.setOnClickListener(
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  rotatePhoto();
                              }
                          });

                  flipH.setOnClickListener(
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  flipPhoto(true);
                              }
                          });

                  flipV.setOnClickListener(
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  flipPhoto(false);
                              }
                          });

                  crop.setOnClickListener(
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  Toast.makeText(
                                          MainActivity.this,
                                          "Crop tool next engine stage mein connect hoga",
                                          Toast.LENGTH_LONG).show();
                              }
                          });
              }

              void rotatePhoto() {

                  if (workingBitmap == null) {
                      return;
                  }

                  Matrix matrix =
                          new Matrix();

                  matrix.postRotate(90);

                  workingBitmap =
                          Bitmap.createBitmap(
                                  workingBitmap,
                                  0,
                                  0,
                                  workingBitmap.getWidth(),
                                  workingBitmap.getHeight(),
                                  matrix,
                                  true);

                  image.setImageBitmap(
                          workingBitmap);
              }

              void flipPhoto(boolean horizontal) {

                  if (workingBitmap == null) {
                      return;
                  }

                  Matrix matrix =
                          new Matrix();

                  if (horizontal) {
                      matrix.setScale(-1, 1);
                  } else {
                      matrix.setScale(1, -1);
                  }

                  workingBitmap =
                          Bitmap.createBitmap(
                                  workingBitmap,
                                  0,
                                  0,
                                  workingBitmap.getWidth(),
                                  workingBitmap.getHeight(),
                                  matrix,
                                  true);

                  image.setImageBitmap(
                          workingBitmap);
              }

              void resetPhoto() {

                  if (originalBitmap == null) {
                      return;
                  }

                  brightness = 0;
                  contrast = 1f;
                  saturation = 1f;
                  warmth = 0;

                  workingBitmap =
                          originalBitmap.copy(
                                  Bitmap.Config.ARGB_8888,
                                  true);

                  if (
