              private void choosePhoto() {

                  Intent i =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                          );

                  i.setType("image/*");

                  i.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          i,
                          PICK_IMAGE
                  );
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {
                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if(requestCode==PICK_IMAGE &&
                          resultCode==RESULT_OK &&
                          data!=null &&
                          data.getData()!=null) {

                      photoUri=data.getData();

                      try {

                          Bitmap b =
                                  decodeForEditor(
                                          photoUri
                                  );

                          if(b==null)
                              throw new Exception();

                          if(baseBitmap!=null &&
                                  baseBitmap!=b &&
                                  !baseBitmap.isRecycled()) {
                              baseBitmap.recycle();
                          }

                          baseBitmap=b;

                          undo.clear();
                          redo.clear();

                          for(int i=0;i<17;i++)
                              adjust[i]=0;

                          filter=0;
                          filterIntensity=100;

                          for(int i=0;i<17;i++)
                              if(bars[i]!=null)
                                  bars[i].setProgress(100);

                          preview.setImageBitmap(
                                  baseBitmap
                          );

                          schedulePreview();

                      } catch(Exception e) {

                          Toast.makeText(
                                  this,
                                  "Photo load nahi hui",
                                  Toast.LENGTH_SHORT
                          ).show();
                      }
                  }
              }

              /*
               * Fast editor bitmap.
               * Maximum dimension = 900 px.
               * This is the important performance fix.
               */
              private Bitmap decodeForEditor(
                      Uri uri
              ) throws Exception {

                  BitmapFactory.Options bounds =
                          new BitmapFactory.Options();

                  bounds.inJustDecodeBounds=true;

                  InputStream a =
                          getContentResolver()
                                  .openInputStream(uri);

                  BitmapFactory.decodeStream(
                          a,
                          null,
                          bounds
                  );

                  a.close();

                  int sample=1;

                  int largest =
                          Math.max(
                                  bounds.outWidth,
                                  bounds.outHeight
                          );

                  while(largest/sample > 900)
                      sample*=2;

                  BitmapFactory.Options o =
                          new BitmapFactory.Options();

                  o.inSampleSize=sample;
                  o.inPreferredConfig =
                          Bitmap.Config.ARGB_8888;

                  InputStream b =
                          getContentResolver()
                                  .openInputStream(uri);

                  Bitmap result =
                          BitmapFactory.decodeStream(
                                  b,
                                  null,
                                  o
                          );

                  b.close();

                  return result;
              }

              /*
               * Preview debounce.
               * Rapid slider movement does not start hundreds
               * of renders.
               */
              private void schedulePreview() {

                  handler.removeCallbacks(
                          previewRunnable
                  );

                  handler.postDelayed(
                          previewRunnable,
                          45
                  );
              }

              private final Runnable previewRunnable =
                      () -> renderPreview();

              private void renderPreview() {

                  if(baseBitmap==null)
                      return;

                  final Bitmap source=baseBitmap;
                  final float[] a=adjust.clone();
                  final int f=filter;
                  final int fi=filterIntensity;

                  final int id=++renderId;

                  if(renderTask!=null)
                      renderTask.cancel(true);

                  renderTask =
                          executor.submit(() -> {

                      Bitmap result =
                              process(
                                      source,
                                      a,
                                      f,
                                      fi,
                                      true
                              );

                      if(result==null)
                          return;

                      runOnUiThread(() -> {

                          if(id!=renderId) {

                              if(!result.isRecycled())
                                  result.recycle();

                              return;
                          }

                          Bitmap old=renderedBitmap;

                          renderedBitmap=result;

                          preview.setImageBitmap(
                                  result
                          );

                          if(old!=null &&
                                  old!=baseBitmap &&
                                  old!=result &&
                                  !old.isRecycled()) {
                              old.recycle();
                          }
                      });
                  });
              }

              /*
               * REAL PIXEL PROCESSOR
               *
               * Every adjustment below changes actual pixels.
               */
              private Bitmap process(
                      Bitmap src,
                      float[] a,
                      int filterId,
                      int filterAmount,
                      boolean previewMode
              ) {

                  int w=src.getWidth();
                  int h=src.getHeight();

                  int[] px =
                          new int[w*h];

                  src.getPixels(
                          px,
                          0,
                          w,
                          0,
                          0,
                          w,
                          h
                  );

                  int[] original=px.clone();

                  float[] hsv=new float[3];

                  float noise=
                          Math.max(
                                  0,
                                  a[14]
                          )/100f;

                  float sharp=
                          Math.max(
                                  0,
                                  a[12]
                          )/100f;

                  float definition=
                          a[13]/100f;

                  for(int y=0;y<h;y++) {

                      if(Thread.currentThread()
                              .isInterrupted())
                          return null;

                      for(int x=0;x<w;x++) {

                          int index=y*w+x;

                          int color=
                                  original[index];

                          float r=
                                  Color.red(color);

                          float g=
                                  Color.green(color);

                          float b=
                                  Color.blue(color);

                          /*
                           * Noise Reduction
                           */
                          if(noise>0) {

                              float ar=r;
                              float ag=g;
                              float ab=b;

                              int count=1;

                              if(x>0) {
                                  int q=
                                          original[index-1];

                                  ar+=Color.red(q);
                                  ag+=Color.green(q);
                                  ab+=Color.blue(q);
                                  count++;
                              }

                              if(x<w-1) {
                                  int q=
                                          original[index+1];

                                  ar+=Color.red(q);
                                  ag+=Color.green(q);
                                  ab+=Color.blue(q);
                                  count++;
                              }

                              if(y>0) {
                                  int q=
                                          original[index-w];

                                  ar+=Color.red(q);
                                  ag+=Color.green(q);
                                  ab+=Color.blue(q);
                                  count++;
                              }

                              if(y<h-1) {
                                  int q=
                                          original[index+w];

                                  ar+=Color.red(q);
                                  ag+=Color.green(q);
                                  ab+=Color.blue(q);
                                  count++;
                              }

                              ar/=count;
                              ag/=count;
                              ab/=count;

                              r=
                                      r*(1-noise)
                                      +ar*noise;

                              g=
                                      g*(1-noise)
                                      +ag*noise;

                              b=
                                      b*(1-noise)
                                      +ab*noise;
                          }

                          /*
                           * Sharpness
                           */
                          if(sharp>0) {

                              float nr=0;
                              float ng=0;
                              float nb=0;
                              int count=0;

                              if(x>0) {
                                  int q=
                                          original[index-1];

                                  nr+=Color.red(q);
                                  ng+=Color.green(q);
                                  nb+=Color.blue(q);
                                  count++;
                              }

                              if(x<w-1) {
                                  int q=
                                          original[index+1];

                                  nr+=Color.red(q);
                                  ng+=Color.green(q);
                                  nb+=Color.blue(q);
                                  count++;
                              }

                              if(y>0) {
                                  int q=
                                          original[index-w];

                                  nr+=Color.red(q);
                                  ng+=Color.green(q);
                                  nb+=Color.blue(q);
                                  count++;
                              }

                              if(y<h-1) {
                                  int q=
                                          original[index+w];

                                  nr+=Color.red(q);
                                  ng+=Color.green(q);
                                  nb+=Color.blue(q);
                                  count++;
                              }

                              if(count>0) {

                                  nr/=count;
                                  ng/=count;
                                  nb/=count;

                                  float amount=
                                          sharp*1.35f;

                                  r +=
                                          (r-nr)*amount;

                                  g +=
                                          (g-ng)*amount;

                                  b +=
                                          (b-nb)*amount;
                              }
                          }

                          float lum =
                                  (0.2126f*r
                                  +0.7152f*g
                                  +0.0722f*b)
                                  /255f;

                          /*
                           * Definition
                           */
                          if(definition!=0) {

                              float local=
                                      (r+g+b)/3f;

                              float difference=
                                      lum*255f-local;

                              float amount=
                                      definition*0.65f;

                              r +=
                                      difference*amount;

                              g +=
                                      difference*amount;

                              b +=
                                      difference*amount;
                          }

                          /*
                           * Brightness
                           */
                          float brightness=
                                  a[0]/100f;

                          r+=brightness*65f;
                          g+=brightness*65f;
                          b+=brightness*65f;

                          /*
                           * Exposure
                           */
                          float exposure=
                                  (float)Math.pow(
                                          2.0,
                                          a[1]/100.0
                                  );

                          r*=exposure;
                          g*=exposure;
                          b*=exposure;

                          /*
                           * Brilliance
                           *
                           * Midtones are affected more.
                           */
                          float brilliance=
                                  a[2]/100f;

                          float midtone=
                                  1f-
                                  Math.abs(
                                          lum-0.5f
                                  )*2f;

                          r +=
                                  (128-r)
                                  *brilliance
                                  *midtone
                                  *0.45f;

                          g +=
                                  (128-g)
                                  *brilliance
                                  *midtone
                                  *0.45f;

                          b +=
                                  (128-b)
                                  *brilliance
                                  *midtone
                                  *0.45f;

                          /*
                           * Contrast
                           */
                          float contrast=
                                  a[3]/100f;

                          float cf=
                                  1f+
                                  contrast*1.55f;

                          r=
                                  (r-128)*cf+128;

                          g=
                                  (g-128)*cf+128;

                          b=
                                  (b-128)*cf+128;

                          /*
                           * Highlights
                           */
                          float highlights=
                                  a[4]/100f;

                          if(lum>0.48f) {

                              float weight=
                                      (lum-0.48f)
                                      /0.52f;

                              if(highlights>0) {

                                  r +=
                                          (255-r)
                                          *highlights
                                          *weight
                                          *0.40f;

                                  g +=
                                          (255-g)
                                          *highlights
                                          *weight
                                          *0.40f;

                                  b +=
                                          (255-b)
                                          *highlights
                                          *weight
                                          *0.40f;

                              } else {

                                  float factor=
                                          1f+
                                          highlights
                                          *weight
                                          *0.70f;

                                  r*=factor;
                                  g*=factor;
                                  b*=factor;
                              }
                          }

                          /*
                           * Shadows
                           */
                          float shadows=
                                  a[5]/100f;

                          if(lum<0.52f) {

                              float weight=
                                      1f-
                                      lum/0.52f;

                              if(shadows>0) {

                                  r +=
                                          (255-r)
                                          *shadows
                                          *weight
                                          *0.48f;

                                  g +=
                                          (255-g)
                                          *shadows
                                          *weight
                                          *0.48f;

                                  b +=
                                          (255-b)
                                          *shadows
                                          *weight
                                          *0.48f;

                              } else {

                                  float factor=
                                          1f+
                                          shadows
                                          *weight
                                          *0.65f;

                                  r*=factor;
                                  g*=factor;
                                  b*=factor;
                              }
                          }

                          /*
                           * Black Point
                           */
                          float black=
                                  a[6]/100f;

                          if(lum<0.40f) {

                              float weight=
                                      1f-
                                      lum/0.40f;

                              r -=
                                      black
                                      *60f
                                      *weight;

                              g -=
                                      black
                                      *60f
                                      *weight;

                              b -=
                                      black
                                      *60f
                                      *weight;
                          }

                          r=clamp(r);
                          g=clamp(g);
                          b=clamp(b);

                          /*
                           * HSV COLOR CONTROLS
                           */
                          Color.RGBToHSV(
                                  (int)r,
                                  (int)g,
                                  (int)b,
                                  hsv
                          );

                          /*
                           * Saturation
                           */
                          hsv[1] *=
                                  1f+
                                  a[7]/100f;

                          /*
                           * Vibrance
                           */
                          float vibrance=
                                  a[8]/100f;

                          hsv[1] +=
                                  vibrance
                                  *(1f-hsv[1])
                                  *0.95f;

                          hsv[1]=clamp01(hsv[1]);

                          /*
                           * Hue
                           */
                          hsv[0] +=
                                  a[11]/100f
                                  *180f;

                          while(hsv[0]<0)
                              hsv[0]+=360;

                          while(hsv[0]>=360)
                              hsv[0]-=360;

                          int rgb=
                                  Color.HSVToColor(hsv);

                          r=Color.red(rgb);
                          g=Color.green(rgb);
                          b=Color.blue(rgb);

                          /*
                           * Warmth
                           */
                          float warmth=
                                  a[9]/100f;

                          r+=warmth*42f;
                          g+=warmth*9f;
                          b-=warmth*42f;

                          /*
                           * Tint
                           */
                          float tint=
                                  a[10]/100f;

                          r+=tint*24f;
                          g-=tint*34f;
                          b+=tint*24f;

                          /*
                           * Fade
                           */
                          float fade=
                                  Math.max(
                                          0,
                                          a[15]
                                  )/100f;

                          if(fade>0) {

                              float amount=
                                      fade*0.42f;

                              r=
                                      r*(1-amount)
                                      +128*amount;

                              g=
                                      g*(1-amount)
                                      +128*amount;

                              b=
                                      b*(1-amount)
                                      +128*amount;
                          }

                          /*
                           * FILTER
                           */
                          float fr=r;
                          float fg=g;
                          float fb=b;

                          float[] fhsv=
                                  new float[3];

                          switch(filterId) {

                              case 1:
                                  Color.RGBToHSV(
                                          clampInt(r),
                                          clampInt(g),
                                          clampInt(b),
                                          fhsv
                                  );

                                  fhsv[1]=clamp01(
                                          fhsv[1]+0.24f
                                  );

                                  rgb=
                                          Color.HSVToColor(
                                                  fhsv
                                          );

                                  fr=Color.red(rgb)*1.08f;
                                  fg=Color.green(rgb)*1.08f;
                                  fb=Color.blue(rgb)*1.08f;
                                  break;

                              case 2:
                                  Color.RGBToHSV(
                                          clampInt(r),
                                          clampInt(g),
                                          clampInt(b),
                                          fhsv
                                  );

                                  fhsv[1]=clamp01(
                                          fhsv[1]+0.26f
                                  );

                                  rgb=
                                          Color.HSVToColor(
                                                  fhsv
                                          );

                                  fr=Color.red(rgb)+18;
                                  fg=Color.green(rgb)+7;
                                  fb=Color.blue(rgb)-18;
                                  break;

                              case 3:
                                  Color.RGBToHSV(
                                          clampInt(r),
                                          clampInt(g),
                                          clampInt(b),
                                          fhsv
                                  );

                                  fhsv[1]=clamp01(
                                          fhsv[1]+0.26f
                                  );

                                  rgb=
                                          Color.HSVToColor(
                                                  fhsv
                                          );

                                  fr=Color.red(rgb)-15;
                                  fg=Color.green(rgb)+4;
                                  fb=Color.blue(rgb)+20;
                                  break;

                              case 4:
                                  fr=(r-128)*1.38f+128;
                                  fg=(g-128)*1.38f+128;
                                  fb=(b-128)*1.38f+128;
                                  break;

                              case 5:
                                  fr=(r-128)*1.40f+140;
                                  fg=(g-128)*1.38f+130;
                                  fb=(b-128)*1.30f+110;
                                  break;

                              case 6:
                                  fr=(r-128)*1.38f+110;
                                  fg=(g-128)*1.38f+128;
                                  fb=(b-128)*1.42f+145;
                                  break;

                              case 7:
                                  float mono=
                                          0.299f*r+
                                          0.587f*g+
                                          0.114f*b;

                                  fr=mono;
                                  fg=mono;
                                  fb=mono;
                                  break;

                              case 8:
                                  float silver=
                                          0.299f*r+
                                          0.587f*g+
                                          0.114f*b;

                                  silver=
                                          (silver-128)
                                          *1.20f+128;

                                  fr=silver+5;
                                  fg=silver+5;
                                  fb=silver+9;
                                  break;

                              case 9:
                                  float noir=
                                          0.299f*r+
                                          0.587f*g+
                                          0.114f*b;

                                  noir=
                                          (noir-128)
                                          *1.72f+116;

                                  fr=noir;
                                  fg=noir;
                                  fb=noir;
                                  break;

                              case 10:
                                  fr=r+24;
                                  fg=g+7;
                                  fb=b-24;
                                  break;

                              case 11:
                                  fr=r-20;
                                  fg=g+3;
                                  fb=b+26;
                                  break;

                              case 12:
                                  fr=r*0.70f+128*0.30f;
                                  fg=g*0.70f+128*0.30f;
                                  fb=b*0.70f+128*0.30f;
                                  break;
                          }

                          float filterMix=
                                  filterAmount/100f;

                          r=
                                  r*(1-filterMix)
                                  +fr*filterMix;

                          g=
                                  g*(1-filterMix)
                                  +fg*filterMix;

                          b=
                                  b*(1-filterMix)
                                  +fb*filterMix;

                          /*
                           * VIGNETTE
                           */
                          float vignette=
                                  a[16]/100f;

                          if(vignette!=0) {

                              float nx=
                                      (x-w/2f)
                                      /(w/2f);

                              float ny=
                                      (y-h/2f)
                                      /(h/2f);

                              float distance=
                                      (float)Math.sqrt(
                                              nx*nx+
                                              ny*ny
                                      );

                              float edge=
                                      clamp01(
                                              (distance-0.20f)
                                              /0.80f
                                      );

                              float amount=
                                      vignette
                                      *0.82f
                                      *edge;

                              if(amount>0) {

                                  r*=1-amount;
                                  g*=1-amount;
                                  b*=1-amount;

                              } else {

                                  float lift=-amount;

                                  r+=
                                          (255-r)
                                          *lift
                                          *0.22f;

                                  g+=
                                          (255-g)
                                          *lift
                                          *0.22f;

                                  b+=
                                          (255-b)
                                          *lift
                                          *0.22f;
                              }
                          }

                          px[index]=Color.rgb(
                                  clampInt(r),
                                  clampInt(g),
                                  clampInt(b)
                          );
                      }
                  }

                  Bitmap out=
                          Bitmap.createBitmap(
                                  w,
                                  h,
                                  Bitmap.Config.ARGB_8888
                          );

                  out.setPixels(
                          px,
                          0,
                          w,
                          0,
                          0,
                          w,
                          h
                  );

                  return out;
              }

              private float clamp(
                      float x
              ) {
                  return Math.max(
                          0,
                          Math.min(255,x)
                  );
              }

              private float clamp01(
                      float x
              ) {
                  return Math.max(
                          0,
                          Math.min(1,x)
                  );
              }

              private int clampInt(
                      float x
              ) {
                  return Math.max(
                          0,
                          Math.min(
                                  255,
                                  Math.round(x)
                          )
                  );
              }

              /*
               * History stores settings.
               * Slider undo is now taken BEFORE the drag,
               * not after it.
               */
              private Snapshot makeSnapshot() {

                  Snapshot s=
                          new Snapshot();

                  s.values=
                          adjust.clone();

                  s.filter=filter;
                  s.intensity=filterIntensity;

                  return s;
              }

              private void restore(
                      Snapshot s
              ) {

                  if(s==null)
                      return;

                  System.arraycopy(
                          s.values,
                          0,
                          adjust,
                          0,
                          17
                  );

                  filter=s.filter;
                  filterIntensity=s.intensity;

                  for(int i=0;i<17;i++) {

                      if(bars[i]!=null) {

                          bars[i].setProgress(
                                  ((int)
                                  adjust[i])+100
                          );

                          labels[i].setText(
                                  names[i]
                                  +"    "
                                  +String.format(
                                          Locale.US,
                                          "%.0f",
                                          adjust[i]
                                  )
                          );
                      }
                  }

                  schedulePreview();
              }

              private void undo() {

                  if(undo.isEmpty())
                      return;

                  redo.push(
                          makeSnapshot()
                  );

                  restore(
                          undo.pop()
                  );
              }

              private void redo() {

                  if(redo.isEmpty())
                      return;

                  undo.push(
                          makeSnapshot()
                  );

                  restore(
                          redo.pop()
                  );
              }

              private void reset() {

                  undo.push(
                          makeSnapshot()
                  );

                  redo.clear();

                  for(int i=0;i<17;i++)
                      adjust[i]=0;

                  filter=0;
                  filterIntensity=100;

                  for(int i=0;i<17;i++) {

                      if(bars[i]!=null)
                          bars[i].setProgress(100);
                  }

                  schedulePreview();
              }

              private void rotate() {

                  if(baseBitmap==null)
                      return;

                  undo.push(
                          makeSnapshot()
                  );

                  redo.clear();

                  Matrix m=
                          new Matrix();

                  m.postRotate(90);

                  Bitmap old=baseBitmap;

                  baseBitmap=
                          Bitmap.createBitmap(
                                  old,
                                  0,
                                  0,
                                  old.getWidth(),
                                  old.getHeight(),
                                  m,
                                  true
                          );

                  if(old!=baseBitmap &&
                          !old.isRecycled()) {
                      old.recycle();
                  }

                  schedulePreview();
              }

              private void flip(
                      boolean horizontal
              ) {

                  if(baseBitmap==null)
                      return;

                  undo.push(
                          makeSnapshot()
                  );

                  redo.clear();

                  Matrix m=
                          new Matrix();

                  if(horizontal)
                      m.setScale(-1,1);
                  else
                      m.setScale(1,-1);

                  Bitmap old=baseBitmap;

                  baseBitmap=
                          Bitmap.createBitmap(
                                  old,
                                  0,
                                  0,
                                  old.getWidth(),
                                  old.getHeight(),
                                  m,
                                  true
                          );

                  if(old!=baseBitmap &&
                          !old.isRecycled()) {
                      old.recycle();
                  }

                  schedulePreview();
              }

              /*
               * Center square crop.
               * Later this can be replaced with an interactive crop UI.
               */
              private void crop() {

                  if(baseBitmap==null)
                      return;

                  undo.push(
                          makeSnapshot()
                  );

                  redo.clear();

                  int w=baseBitmap.getWidth();
                  int h=baseBitmap.getHeight();

                  int side=Math.min(w,h);

                  int left=(w-side)/2;
                  int top=(h-side)/2;

                  Bitmap old=baseBitmap;

                  baseBitmap=
                          Bitmap.createBitmap(
                                  old,
                                  left,
                                  top,
                                  side,
                                  side
                          );

                  if(old!=baseBitmap &&
                          !old.isRecycled()) {
                      old.recycle();
                  }

                  schedulePreview();
              }

              private void showBefore() {

                  if(baseBitmap==null)
                      return;

                  preview.setImageBitmap(
                          baseBitmap
                  );

                  handler.postDelayed(
                          () -> {

                              if(renderedBitmap!=null &&
                                      !renderedBitmap.isRecycled()) {

                                  preview.setImageBitmap(
                                          renderedBitmap
                                  );
                              }
                          },
                          1200
                  );
              }

              private void savePhoto() {

                  if(baseBitmap==null) {

                      Toast.makeText(
                              this,
                              "Pehle photo choose karo",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  final Bitmap source=
                          baseBitmap;

                  final float[] a=
                          adjust.clone();

                  final int f=filter;
                  final int fi=filterIntensity;

                  Toast.makeText(
                          this,
                          "Saving...",
                          Toast.LENGTH_SHORT
                  ).show();

                  executor.submit(() -> {

                      Bitmap result=
                              process(
                                      source,
                                      a,
                                      f,
                                      fi,
                                      false
                              );

                      if(result==null)
                          return;

                      try {

                          ContentValues values=
                                  new ContentValues();

                          values.put(
                                  MediaStore.Images.Media.DISPLAY_NAME,
                                  "RCINSTAEDIT_"
                                  +System.currentTimeMillis()
                                  +".jpg"
                          );

                          values.put(
                                  MediaStore.Images.Media.MIME_TYPE,
                                  "image/jpeg"
                          );

                          values.put(
                                  MediaStore.Images.Media.RELATIVE_PATH,
                                  Environment.DIRECTORY_PICTURES
                                  +"/RCINSTAEDIT"
                          );

                          Uri uri=
                                  getContentResolver()
                                          .insert(
                                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                                  values
                                          );

                          if(uri==null)
                              throw new Exception();

                          OutputStream out=
                                  getContentResolver()
                                          .openOutputStream(
                                                  uri
                                          );

                          result.compress(
                                  Bitmap.CompressFormat.JPEG,
                                  97,
                                  out
                          );

                          out.flush();
                          out.close();

                          result.recycle();

                          runOnUiThread(
                                  () -> Toast.makeText(
                                          this,
                                          "Saved in Pictures/RCINSTAEDIT",
                                          Toast.LENGTH_LONG
                                  ).show()
                          );

                      } catch(Exception e) {

                          runOnUiThread(
                                  () -> Toast.makeText(
                                          this,
                                          "Save failed",
                                          Toast.LENGTH_SHORT
                                  ).show()
                          );
                      }
                  });
              }

              @Override
              protected void onDestroy() {

                  handler.removeCallbacksAndMessages(
                          null
                  );

                  if(renderTask!=null)
                      renderTask.cancel(true);

                  executor.shutdownNow();

                  if(renderedBitmap!=null &&
                          renderedBitmap!=baseBitmap &&
                          !renderedBitmap.isRecycled()) {
                      renderedBitmap.recycle();
                  }

                  super.onDestroy();
              }

              private static class Snapshot {

                  float[] values;

                  int filter;

                  int intensity;
              }
          }
          EOF

      - name: Setup Gradle
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
