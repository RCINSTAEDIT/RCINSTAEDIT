              void load() {

                  try {

                      BitmapFactory.Options bounds =
                              new BitmapFactory.Options();

                      bounds.inJustDecodeBounds =
                              true;

                      InputStream a =
                              getContentResolver()
                                      .openInputStream(
                                              photoUri
                                      );

                      BitmapFactory.decodeStream(
                              a,
                              null,
                              bounds
                      );

                      if (a != null)
                          a.close();

                      int longest =
                              Math.max(
                                      bounds.outWidth,
                                      bounds.outHeight
                              );

                      int sample = 1;

                      while (
                              longest / sample > 1600
                      ) {

                          sample *= 2;
                      }

                      BitmapFactory.Options options =
                              new BitmapFactory.Options();

                      options.inSampleSize =
                              sample;

                      options.inPreferredConfig =
                              Bitmap.Config.ARGB_8888;

                      InputStream b =
                              getContentResolver()
                                      .openInputStream(
                                              photoUri
                                      );

                      original =
                              BitmapFactory.decodeStream(
                                      b,
                                      null,
                                      options
                              );

                      if (b != null)
                          b.close();

                      Arrays.fill(
                              values,
                              0
                      );

                      filter = 0;
                      intensity = 100;

                      undo.clear();
                      redo.clear();

                      before = false;

                      preview.clearColorFilter();

                      preview.setImageBitmap(
                              original
                      );

                      Button choose =
                              findViewById(9001);

                      if (choose != null) {

                          choose.setText(
                                  "🔄  CHANGE PHOTO"
                          );
                      }

                      toast(
                              "Photo loaded"
                      );

                  } catch (Exception e) {

                      toast(
                              "Photo load failed"
                      );
                  }
              }

              void push() {

                  if (original == null)
                      return;

                  undo.push(
                          new State(
                                  values,
                                  filter,
                                  intensity
                          )
                  );

                  while (
                          undo.size() > 15
                  ) {

                      undo.removeLast();
                  }

                  redo.clear();
              }

              void undo() {

                  if (undo.isEmpty())
                      return;

                  redo.push(
                          new State(
                                  values,
                                  filter,
                                  intensity
                          )
                  );

                  State s =
                          undo.pop();

                  restore(s);
              }

              void redo() {

                  if (redo.isEmpty())
                      return;

                  undo.push(
                          new State(
                                  values,
                                  filter,
                                  intensity
                          )
                  );

                  State s =
                          redo.pop();

                  restore(s);
              }

              void restore(State s) {

                  values =
                          s.values.clone();

                  filter =
                          s.filter;

                  intensity =
                          s.intensity;

                  before = false;

                  render();
              }

              void reset() {

                  if (original == null)
                      return;

                  push();

                  Arrays.fill(
                          values,
                          0
                  );

                  filter = 0;
                  intensity = 100;

