                          "Silvertone",
                          "Noir",
                          "Warm",
                          "Cool",
                          "Fade"
                  };

                  for (
                          int i = 0;
                          i < filters.length;
                          i++
                  ) {

                      final int index = i;

                      Button b =
                              button(
                                      filters[i]
                              );

