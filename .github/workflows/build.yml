                                  );

                              output =
                                  new File(
                                      getCacheDir(),
                                      "rcinsta_export.mp4"
                                  );

                              if(output.exists())
                                  output.delete();

                              long startUs =
                                  duration
                                  *trimStart
                                  *10000L;

                              long endUs =
                                  duration
                                  *trimEnd
                                  *10000L;

                              remux(
                                  input,
                                  output,
                                  startUs,
                                  endUs
                              );

                              saveOutput(
                                  output
                              );

                              runOnUiThread(
                                  ()->toast(
                                      "Video saved in Movies/RCINSTAEDIT"
                                  )
                              );

                          }catch(Exception e){

                              runOnUiThread(
                                  ()->toast(
                                      "Video export failed"
                                  )
                              );

                          }finally{

                              if(input!=null)
                                  input.delete();

                              if(output!=null)
                                  output.delete();
                          }

                      }
                  ).start();
              }

              File copyToCache(
                      Uri uri
              ) throws Exception{

                  File f =
                      new File(
                          getCacheDir(),
                          "rcinsta_source.mp4"
                      );

                  InputStream in =
                      getContentResolver()
                          .openInputStream(uri);

                  if(in==null)
                      throw new Exception();

                  FileOutputStream out =
                      new FileOutputStream(f);

                  byte[] buffer =
                      new byte[65536];

                  int n;

                  while(
                      (n=in.read(buffer))!=-1
                  ){

                      out.write(
                          buffer,0,n
                      );
                  }

                  out.close();
                  in.close();

                  return f;
              }

              void remux(
                      File input,
                      File output,
                      long startUs,
                      long endUs
              ) throws Exception{

                  MediaExtractor ex =
                      new MediaExtractor();

                  ex.setDataSource(
                      input.getAbsolutePath()
                  );

                  MediaMuxer mux =
                      new MediaMuxer(
                          output.getAbsolutePath(),
                          MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4
                      );

                  int tracks=ex.getTrackCount();

                  int[] map =
                      new int[tracks];

                  java.util.Arrays.fill(
                      map,-1
                  );

                  for(int i=0;i<tracks;i++){

                      MediaFormat format =
                          ex.getTrackFormat(i);

                      String mime =
                          format.getString(
                              MediaFormat.KEY_MIME
                          );

                      if(
                          mime!=null &&
                          (
                              mime.startsWith("video/")
                              ||
                              (
                                  !muted &&
                                  mime.startsWith("audio/")
                              )
                          )
                      ){

                          map[i]=
                              mux.addTrack(
                                  format
                              );

                          ex.selectTrack(i);
                      }
                  }

                  if(rotation!=0){

                      mux.setOrientationHint(
                          rotation
                      );
                  }

                  mux.start();

                  ByteBuffer buffer =
                      ByteBuffer.allocate(
                          8*1024*1024
                      );

                  MediaCodec.BufferInfo info =
                      new MediaCodec.BufferInfo();

                  boolean firstVideo=true;

                  while(true){

                      int track =
                          ex.getSampleTrackIndex();

                      if(track<0)
                          break;

                      long time =
                          ex.getSampleTime();

                      if(time<0)
                          break;

                      if(time>endUs)
                          break;

                      if(
                          time>=startUs &&
                          map[track]>=0
                      ){

                          buffer.clear();

                          int size =
                              ex.readSampleData(
                                  buffer,0
                              );

                          if(size<0)
                              break;

                          String mime =
                              ex.getTrackFormat(track)
                                .getString(
                                    MediaFormat.KEY_MIME
                                );

                          boolean videoTrack =
                              mime!=null &&
                              mime.startsWith("video/");

                          if(
                              videoTrack &&
                              firstVideo
                          ){

                              if(
                                  (
                                      ex.getSampleFlags()
                                      & MediaExtractor.SAMPLE_FLAG_SYNC
                                  )==0
                              ){

                                  ex.advance();
                                  continue;
                              }

                              firstVideo=false;
                          }

                          info.offset=0;
                          info.size=size;

                          long relative =
                              time-startUs;

                          if(relative<0)
                              relative=0;

                          /*
                           * Speed changes output duration.
                           * 2x = half duration.
                           * 0.5x = double duration.
                           */
                          info.presentationTimeUs =
                              (long)(
                                  relative/speed
                              );

                          info.flags =
                              ex.getSampleFlags();

                          mux.writeSampleData(
                              map[track],
                              buffer,
                              info
                          );
                      }

                      ex.advance();
                  }

                  mux.stop();
                  mux.release();
                  ex.release();
              }

              void saveOutput(
                      File file
              ) throws Exception{

                  ContentValues v =
                      new ContentValues();

                  v.put(
                      MediaStore.Video.Media.DISPLAY_NAME,
                      "RCINSTAEDIT_"
                          +System.currentTimeMillis()
                          +".mp4"
                  );

                  v.put(
                      MediaStore.Video.Media.MIME_TYPE,
                      "video/mp4"
                  );

                  if(Build.VERSION.SDK_INT>=29){

                      v.put(
                          MediaStore.Video.Media.RELATIVE_PATH,
                          "Movies/RCINSTAEDIT"
                      );

                      v.put(
                          MediaStore.Video.Media.IS_PENDING,
                          1
                      );
                  }

                  Uri uri =
                      getContentResolver()
                          .insert(
                              MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                              v
                          );

                  if(uri==null)
                      throw new Exception();

                  OutputStream out =
                      getContentResolver()
                          .openOutputStream(uri);

                  if(out==null)
                      throw new Exception();

                  InputStream in =
                      new FileInputStream(file);

                  byte[] buffer =
                      new byte[65536];

                  int n;

                  while(
                      (n=in.read(buffer))!=-1
                  ){

                      out.write(
                          buffer,0,n
                      );
                  }

                  out.close();
                  in.close();

                  if(Build.VERSION.SDK_INT>=29){

                      ContentValues done =
                          new ContentValues();

                      done.put(
                          MediaStore.Video.Media.IS_PENDING,
                          0
                      );

                      getContentResolver()
                          .update(
                              uri,
                              done,
                              null,
                              null
                          );
                  }
              }

              protected void onDestroy(){

                  handler.removeCallbacks(
                      updater
                  );

                  super.onDestroy();
              }

              void toast(String s){

                  Toast.makeText(
                      this,
                      s,
                      Toast.LENGTH_SHORT
                  ).show();
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-Full-Editor
          path: app/build/outputs/apk/debug/app-debug.apk
