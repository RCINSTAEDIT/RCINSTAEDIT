              private void addSection(
                      LinearLayout parent,
                      String title
              ) {

                  TextView section =
                          text(
                                  title,
                                  13,
                                  Color.rgb(
                                          170,
                                          145,
                                          255
                                  )
                          );

                  section.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  section.setPadding(
                          0,
                          dp(12),
                          0,
                          0
                  );

                  parent.addView(
                          section,
                          lp(-1, 45)
                  );
              }

              private void addSlider(
                      LinearLayout parent,
                      final String title,
                      int min,
                      int max,
                      int initial,
                      final SliderCallback callback
              ) {

                  TextView label =
                          text(
                                  title +
                                          ": " +
                                          initial,
                                  15,
                                  Color.WHITE
                          );

                  label.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  parent.addView(
                          label,
                          lp(-1, 42)
                  );

                  SeekBar bar =
                          new SeekBar(this);

                  bar.setMax(
                          max - min
                  );

                  bar.setProgress(
                          initial - min
                  );

                  bar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar seekBar,
                                      int progress,
                                      boolean fromUser
                              ) {

                                  int value =
                                          progress;

                                  callback.onChanged(
                                          value
                                  );

                                  label.setText(
                                          title +
                                                  ": " +
                                                  value
                                  );
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }
                          }
                  );

                  bar.setProgress(
                          initial - min
                  );

                  parent.addView(
                          bar,
                          lp(-1, 55)
                  );
              }

              private void showFilters() {

                  LinearLayout root =
                          baseColumn();

                  root.addView(
                          topBar("Filters")
                  );

                  FrameLayout previewBox =
                          new FrameLayout(this);

                  previewBox.setBackgroundColor(
                          Color.BLACK
                  );

                  previewImage =
                          new ImageView(this);

                  previewImage.setScaleType(
                          ImageView.ScaleType.FIT_CENTER
                  );

                  previewBox.addView(
                          previewImage,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );

                  vignetteView =
                          new VignetteView(this);

                  vignetteView.setStrength(
                          vignette
                  );

                  previewBox.addView(
                          vignetteView,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );

                  root.addView(
                          previewBox,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(285)
                          )
                  );

                  setupPreviewTouch();

                  TextView name =
                          text(
                                  "FILTER: " +
                                          selectedFilter,
                                  15,
                                  Color.WHITE
                          );

                  name.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(
                          name,
                          lp(-1, 45)
                  );

                  ScrollView scroll =
                          new ScrollView(this);

                  LinearLayout content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  content.setPadding(
                          dp(12),
                          dp(4),
                          dp(12),
                          dp(30)
                  );

                  String[] filters = {
                          "Original",
                          "Vivid",
                          "Vivid Warm",
                          "Vivid Cool",
                          "Dramatic",
                          "Dramatic Warm",
                          "Dramatic Cool",
                          "Mono",
                          "Silvertone",
                          "Noir",
                          "Warm",
                          "Cool",
                          "Fade"
                  };

                  for (final String filter :
                          filters) {

                      TextView button =
                              makeButton(
                                      filter
                              );

                      button.setOnClickListener(
                              new View.OnClickListener() {
                                  @Override
                                  public void onClick(View v) {

                                      selectedFilter =
                                              filter;

                                      name.setText(
                                              "FILTER: " +
                                                      selectedFilter
                                      );

                                      updatePreview();
                                  }
                              }
                      );

                      content.addView(
                              button
                      );
                  }

                  TextView intensityText =
                          text(
                                  "Intensity: " +
                                          filterIntensity +
                                          "%",
                                  15,
                                  Color.WHITE
                          );

                  intensityText.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  content.addView(
                          intensityText,
                          lp(-1, 45)
                  );

                  SeekBar intensity =
                          new SeekBar(this);

                  intensity.setMax(100);

                  intensity.setProgress(
                          filterIntensity
                  );

                  intensity.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar seekBar,
                                      int progress,
                                      boolean fromUser
                              ) {

                                  filterIntensity =
                                          progress;

                                  intensityText.setText(
                                          "Intensity: " +
                                                  filterIntensity +
                                                  "%"
                                  );

                                  updatePreview();
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar seekBar
                              ) {
                              }
                          }
                  );

                  content.addView(
                          intensity,
                          lp(-1, 55)
                  );

                  addTool(
                          content,
                          "✓  DONE",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  goBack();
                              }
                          }
                  );

                  scroll.addView(
                          content
                  );

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  updatePreview();

                  setContentViewWithInsets(
                          root
                  );
              }

              private void updatePreview() {

                  if (previewImage == null) {
                      return;
                  }

                  Bitmap source =
                          editedBitmap != null
                                  ? editedBitmap
                                  : originalBitmap;

                  if (source == null) {

                      previewImage.setImageDrawable(
                              null
                      );

                      previewImage.clearColorFilter();

                      return;
                  }

                  if (beforePressed) {

                      previewImage.setImageBitmap(
                              originalBitmap
                      );

                      previewImage.clearColorFilter();

                  } else {

                      previewImage.setImageBitmap(
                              source
                      );

                      ColorMatrix matrix =
                              buildCombinedMatrix();

                      if (matrix == null) {

                          previewImage.clearColorFilter();

                      } else {

                          previewImage.setColorFilter(
                                  new ColorMatrixColorFilter(
                                          matrix
                                  )
                          );
                      }
                  }

                  previewImage.setScaleX(
                          zoom
                  );

                  previewImage.setScaleY(
                          zoom
                  );

                  previewImage.setTranslationX(
                          dragX
                  );

                  previewImage.setTranslationY(
                          dragY
                  );

                  if (vignetteView != null) {

                      vignetteView.setStrength(
                              beforePressed
                                      ? 0
                                      : vignette
                      );
                  }
              }

              private ColorMatrix buildCombinedMatrix() {

                  ColorMatrix result =
                          new ColorMatrix();

                  boolean changed = false;

                  if (brightness != 0) {

                      float b =
                              brightness * 2.0f;

                      result.postConcat(
                              offsetMatrix(
                                      b,
                                      b,
                                      b
                              )
                      );

                      changed = true;
                  }

                  if (exposure != 0) {

                      float factor =
                              1f +
                                      exposure /
                                              100f *
                                              0.8f;

                      result.postConcat(
                              contrastMatrix(
                                      factor
                              )
                      );

                      changed = true;
                  }

                  if (brilliance != 0) {

                      float factor =
                              1f +
                                      brilliance /
                                              100f *
                                              0.18f;

                      result.postConcat(
                              contrastMatrix(
                                      factor
                              )
                      );

                      float b =
                              brilliance *
                                      0.55f;

                      result.postConcat(
                              offsetMatrix(
                                      b,
                                      b,
                                      b
                              )
                      );

                      changed = true;
                  }

                  if (contrast != 0) {

                      float factor =
                              1f +
                                      contrast /
                                              100f;

                      result.postConcat(
                              contrastMatrix(
                                      factor
                              )
                      );

                      changed = true;
                  }

                  if (highlights != 0) {

                      float h =
                              highlights *
                                      0.55f;

                      result.postConcat(
                              offsetMatrix(
                                      h,
                                      h,
                                      h
                              )
                      );

                      changed = true;
                  }

                  if (shadows != 0) {

                      float s =
                              shadows *
                                      0.75f;

                      result.postConcat(
                              offsetMatrix(
                                      s,
                                      s,
                                      s
                              )
                      );

                      changed = true;
                  }

                  if (blackPoint != 0) {

                      float factor =
                              1f +
                                      blackPoint /
                                              100f *
                                              0.35f;

                      result.postConcat(
                              contrastMatrix(
                                      factor
                              )
                      );

                      result.postConcat(
                              offsetMatrix(
                                      -blackPoint *
                                              0.35f,
                                      -blackPoint *
                                              0.35f,
                                      -blackPoint *
                                              0.35f
                              )
                      );

                      changed = true;
                  }

                  if (saturation != 0) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      saturation /
                                              100f
                      );

                      result.postConcat(
                              sat
                      );

                      changed = true;
                  }

                  if (vibrance != 0) {

                      ColorMatrix vib =
                              new ColorMatrix();

                      vib.setSaturation(
                              1f +
                                      vibrance /
                                              100f *
                                              0.65f
                      );

                      result.postConcat(
                              vib
                      );

                      changed = true;
                  }

                  if (warmth != 0) {

                      float w =
                              warmth /
                                      100f;

                      result.postConcat(
                              offsetMatrix(
                                      w * 20f,
                                      w * 4f,
                                      -w * 20f
                              )
                      );

                      changed = true;
                  }

                  if (tint != 0) {

                      float t =
                              tint /
                                      100f;

                      result.postConcat(
                              offsetMatrix(
                                      t * 12f,
                                      -t * 8f,
                                      t * 15f
                              )
                      );

                      changed = true;
                  }

                  if (sharpness != 0) {

                      float factor =
                              1f +
                                      sharpness /
                                              100f *
                                              0.30f;

                      result.postConcat(
                              contrastMatrix(
                                      factor
                              )
                      );

                      changed = true;
                  }

                  if (definition != 0) {

                      float factor =
                              1f +
                                      definition /
                                              100f *
                                              0.25f;

                      result.postConcat(
                              contrastMatrix(
                                      factor
                              )
                      );

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      definition /
                                              100f *
                                              0.10f
                      );

                      result.postConcat(
                              sat
                      );

                      changed = true;
                  }

                  if (noiseReduction != 0) {

                      float factor =
                              1f -
                                      noiseReduction /
                                              100f *
                                              0.12f;

                      result.postConcat(
                              contrastMatrix(
                                      factor
                              )
                      );

                      changed = true;
                  }

                  if (fade != 0) {

                      float f =
                              fade /
                                      100f;

                      result.postConcat(
                              contrastMatrix(
                                      1f -
                                              f *
                                                      0.22f
                              )
                      );

                      result.postConcat(
                              offsetMatrix(
                                      20f * f,
                                      20f * f,
                                      20f * f
                              )
                      );

                      changed = true;
                  }

                  if (hue != 0) {

                      ColorMatrix hueMatrix =
                              new ColorMatrix();

                      hueMatrix.setRotate(
                              0,
                              hue *
                                      0.45f
                      );

                      result.postConcat(
                              hueMatrix
                      );

                      changed = true;
                  }

                  ColorMatrix filter =
                          buildFilterMatrix();

                  if (filter != null) {

                      result.postConcat(
                              filter
                      );

                      changed = true;
                  }

                  return changed
                          ? result
                          : null;
              }

              private ColorMatrix buildFilterMatrix() {

                  if ("Original".equals(
                          selectedFilter
                  ) || filterIntensity <= 0) {

                      return null;
                  }

                  float a =
                          filterIntensity /
                                  100f;

                  ColorMatrix matrix =
                          new ColorMatrix();

                  if ("Vivid".equals(
                          selectedFilter
                  )) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      0.45f * a
                      );

                      matrix.postConcat(
                              sat
                      );

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.18f * a
                              )
                      );

                  } else if ("Vivid Warm".equals(
                          selectedFilter
                  )) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      0.42f * a
                      );

                      matrix.postConcat(
                              sat
                      );

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.16f * a
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      12f * a,
                                      5f * a,
                                      -7f * a
                              )
                      );

                  } else if ("Vivid Cool".equals(
                          selectedFilter
                  )) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      0.42f * a
                      );

                      matrix.postConcat(
                              sat
                      );

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.16f * a
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      -7f * a,
                                      3f * a,
                                      13f * a
                              )
                      );

                  } else if ("Dramatic".equals(
                          selectedFilter
                  )) {

                      ColorMatrix sat =
                              new ColorMatrix();

                      sat.setSaturation(
                              1f +
                                      0.12f * a
                      );

                      matrix.postConcat(
                              sat
                      );

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.38f * a
                              )
                      );

                  } else if ("Dramatic Warm".equals(
                          selectedFilter
                  )) {

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.35f * a
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      12f * a,
                                      5f * a,
                                      -8f * a
                              )
                      );

                  } else if ("Dramatic Cool".equals(
                          selectedFilter
                  )) {

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.35f * a
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      -8f * a,
                                      3f * a,
                                      14f * a
                              )
                      );

                  } else if ("Mono".equals(
                          selectedFilter
                  )) {

                      ColorMatrix mono =
                              new ColorMatrix();

                      mono.setSaturation(
                              0f
                      );

                      matrix.postConcat(
                              mono
                      );

                  } else if ("Silvertone".equals(
                          selectedFilter
                  )) {

                      ColorMatrix mono =
                              new ColorMatrix();

                      mono.setSaturation(
                              0f
                      );

                      matrix.postConcat(
                              mono
                      );

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.15f * a
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      4f * a,
                                      4f * a,
                                      7f * a
                              )
                      );

                  } else if ("Noir".equals(
                          selectedFilter
                  )) {

                      ColorMatrix mono =
                              new ColorMatrix();

                      mono.setSaturation(
                              0f
                      );

                      matrix.postConcat(
                              mono
                      );

                      matrix.postConcat(
                              contrastMatrix(
                                      1f +
                                              0.45f * a
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      -10f * a,
                                      -10f * a,
                                      -10f * a
                              )
                      );

                  } else if ("Warm".equals(
                          selectedFilter
                  )) {

                      matrix.postConcat(
                              offsetMatrix(
                                      20f * a,
                                      5f * a,
                                      -12f * a
                              )
                      );

                  } else if ("Cool".equals(
                          selectedFilter
                  )) {

                      matrix.postConcat(
                              offsetMatrix(
                                      -10f * a,
                                      3f * a,
                                      20f * a
                              )
                      );

                  } else if ("Fade".equals(
                          selectedFilter
                  )) {

                      matrix.postConcat(
                              contrastMatrix(
                                      1f -
                                              0.20f * a
                              )
                      );

                      matrix.postConcat(
                              offsetMatrix(
                                      18f * a,
                                      18f * a,
                                      18f * a
                              )
                      );
                  }

                  return matrix;
              }

              private ColorMatrix contrastMatrix(
                      float contrast
              ) {

                  float offset =
                          128f *
                                  (1f - contrast);

                  return new ColorMatrix(
                          new float[] {
                                  contrast, 0, 0, 0, offset,
                                  0, contrast, 0, 0, offset,
                                  0, 0, contrast, 0, offset,
                                  0, 0, 0, 1, 0
                          }
                  );
              }

              private ColorMatrix offsetMatrix(
                      float r,
                      float g,
                      float b
              ) {

                  return new ColorMatrix(
                          new float[] {
                                  1, 0, 0, 0, r,
                                  0, 1, 0, 0, g,
                                  0, 0, 1, 0, b,
                                  0, 0, 0, 1, 0
                          }
                  );
              }

              private void setupPreviewTouch() {

                  if (previewImage == null) {
                      return;
                  }

                  previewImage.setOnTouchListener(
                          new View.OnTouchListener() {

                              @Override
                              public boolean onTouch(
                                      View v,
                                      MotionEvent event
                              ) {

                                  if (zoom <= 1f) {
                                      return true;
                                  }

                                  if (event.getActionMasked() ==
                                          MotionEvent.ACTION_DOWN) {

                                      lastX =
                                              event.getRawX();

                                      lastY =
                                              event.getRawY();

                                      return true;
                                  }

                                  if (event.getActionMasked() ==
                                          MotionEvent.ACTION_MOVE) {

                                      float dx =
                                              event.getRawX()
                                                      - lastX;

                                      float dy =
                                              event.getRawY()
                                                      - lastY;

                                      dragX += dx;
                                      dragY += dy;

                                      lastX =
                                              event.getRawX();

                                      lastY =
                                              event.getRawY();

                                      updatePreview();

                                      return true;
                                  }

                                  return true;
                              }
                          }
                  );
              }

              private void showBefore() {

                  if (previewImage == null ||
                          originalBitmap == null) {
                      return;
                  }

                  previewImage.setImageBitmap(
                          originalBitmap
                  );

                  previewImage.clearColorFilter();

                  if (vignetteView != null) {
                      vignetteView.setStrength(0);
                  }
              }

              private boolean hasPhoto() {

                  if (editedBitmap == null) {

                      toast(
                              "Pehle photo choose karo"
                      );

                      return false;
                  }

                  return true;
              }

              private void resetAdjustments() {

                  brightness = 0;
                  exposure = 0;
                  brilliance = 0;
                  contrast = 0;
                  highlights = 0;
                  shadows = 0;
                  blackPoint = 0;
                  saturation = 0;
                  vibrance = 0;
                  warmth = 0;
                  tint = 0;
                  sharpness = 0;
                  definition = 0;
                  noiseReduction = 0;
                  fade = 0;
                  vignette = 0;
                  hue = 0;

                  if (vignetteView != null) {
                      vignetteView.setStrength(0);
                  }

                  updatePreview();

                  toast(
                          "Adjustments reset"
                  );
              }

              private void resetPhoto() {

                  if (!hasPhoto()) {
                      return;
                  }

                  editedBitmap =
                          originalBitmap.copy(
                                  Bitmap.Config.ARGB_8888,
                                  true
                          );

                  selectedFilter =
                          "Original";

                  filterIntensity = 100;

                  resetAdjustments();

                  zoom = 1f;
                  dragX = 0f;
                  dragY = 0f;

                  updatePreview();

                  toast(
                          "Photo reset ho gayi"
                  );
              }

              private void rotate90() {

                  if (!hasPhoto()) {
                      return;
                  }

                  Matrix matrix =
                          new Matrix();

                  matrix.postRotate(90);

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  0,
                                  0,
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight(),
                                  matrix,
                                  true
                          );

                  resetViewOnly();

                  updatePreview();
              }

              private void flipHorizontal() {

                  if (!hasPhoto()) {
                      return;
                  }

                  Matrix matrix =
                          new Matrix();

                  matrix.setScale(
                          -1,
                          1
                  );

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  0,
                                  0,
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight(),
                                  matrix,
                                  true
                          );

                  resetViewOnly();

                  updatePreview();
              }

              private void flipVertical() {

                  if (!hasPhoto()) {
                      return;
                  }

                  Matrix matrix =
                          new Matrix();

                  matrix.setScale(
                          1,
                          -1
                  );

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  0,
                                  0,
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight(),
                                  matrix,
                                  true
                          );

                  resetViewOnly();

                  updatePreview();
              }

              private void centerCrop() {

                  if (!hasPhoto()) {
                      return;
                  }

                  int size =
                          Math.min(
                                  editedBitmap.getWidth(),
                                  editedBitmap.getHeight()
                          );

                  int left =
                          (
                                  editedBitmap.getWidth()
                                          - size
                          ) / 2;

                  int top =
                          (
                                  editedBitmap.getHeight()
                                          - size
                          ) / 2;

                  editedBitmap =
                          Bitmap.createBitmap(
                                  editedBitmap,
                                  left,
                                  top,
                                  size,
                                  size
                          );

                  resetViewOnly();

                  updatePreview();
              }

              private void resetViewOnly() {

                  zoom = 1f;
                  dragX = 0f;
                  dragY = 0f;
              }

              private void pickImage() {

                  Intent intent =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                          );

                  intent.setType(
                          "image/*"
                  );

                  intent.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          intent,
                          PICK_IMAGE
                  );
              }

              private void pickAudio() {

                  Intent intent =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                          );

                  intent.setType(
                          "audio/*"
                  );

                  intent.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          intent,
                          PICK_AUDIO
                  );
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (resultCode != RESULT_OK ||
                          data == null ||
                          data.getData() == null) {
                      return;
                  }

                  if (requestCode == PICK_IMAGE) {

                      try {

                          Uri uri =
                                  data.getData();

                          Bitmap bitmap =
                                  BitmapFactory.decodeStream(
                                          getContentResolver()
                                                  .openInputStream(
                                                          uri
                                                  )
                                  );

                          if (bitmap == null) {

                              toast(
                                      "Photo load nahi hui"
                              );

                              return;
                          }

                          originalBitmap =
                                  bitmap.copy(
                                          Bitmap.Config.ARGB_8888,
                                          true
                                  );

                          editedBitmap =
                                  originalBitmap.copy(
                                          Bitmap.Config.ARGB_8888,
                                          true
                                  );

                          selectedFilter =
                                  "Original";

                          filterIntensity = 100;

                          resetAdjustments();

                          resetViewOnly();

                          renderScreen();

                      } catch (Exception e) {

                          toast(
                                  "Photo open nahi hui"
                          );
                      }
                  }
              }

              private void savePhoto() {

                  if (!hasPhoto()) {
                      return;
                  }

                  try {

                      Bitmap output =
                              Bitmap.createBitmap(
                                      editedBitmap.getWidth(),
                                      editedBitmap.getHeight(),
                                      Bitmap.Config.ARGB_8888
                              );

                      Canvas canvas =
                              new Canvas(output);

                      Paint paint =
                              new Paint(
                                      Paint.ANTI_ALIAS_FLAG |
                                              Paint.FILTER_BITMAP_FLAG
                              );

                      ColorMatrix matrix =
                              buildCombinedMatrix();

                      if (matrix != null) {

                          paint.setColorFilter(
                                  new ColorMatrixColorFilter(
                                          matrix
                                  )
                          );
                      }

                      canvas.drawBitmap(
                              editedBitmap,
                              0,
                              0,
                              paint
                      );

                      if (vignette > 0) {

                          applyVignetteToBitmap(
                                  output,
                                  vignette
                          );
                      }

                      ContentValues values =
                              new ContentValues();

                      values.put(
                              MediaStore.Images.Media.DISPLAY_NAME,
                              "RCINSTAEDIT_" +
                                      System.currentTimeMillis() +
                                      ".jpg"
                      );

                      values.put(
                              MediaStore.Images.Media.MIME_TYPE,
                              "image/jpeg"
                      );

                      if (Build.VERSION.SDK_INT >= 29) {

                          values.put(
                                  MediaStore.Images.Media.RELATIVE_PATH,
                                  "Pictures/RCINSTAEDIT"
                          );
                      }

                      Uri uri =
                              getContentResolver()
                                      .insert(
                                              MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                              values
                                      );

                      if (uri == null) {

                          toast(
                                  "Save failed"
                          );

                          return;
                      }

                      OutputStream stream =
                              getContentResolver()
                                      .openOutputStream(
                                              uri
                                      );

                      if (stream == null) {

                          toast(
                                  "Save failed"
                          );

                          return;
                      }

                      output.compress(
                              Bitmap.CompressFormat.JPEG,
                              95,
                              stream
                      );

                      stream.close();

                      output.recycle();

                      toast(
                              "Saved in Pictures/RCINSTAEDIT"
                      );

                  } catch (Exception e) {

                      toast(
                              "Photo save nahi ho payi"
                      );
                  }
              }

              private void applyVignetteToBitmap(
                      Bitmap bitmap,
                      int amount
              ) {

                  int width =
                          bitmap.getWidth();

                  int height =
                          bitmap.getHeight();

                  int[] pixels =
                          new int[
                                  width *
                                          height
                          ];

                  bitmap.getPixels(
                          pixels,
                          0,
                          width,
                          0,
                          0,
                          width,
                          height
                  );

                  float cx =
                          width / 2f;

                  float cy =
                          height / 2f;

                  float maxDist =
                          (float) Math.sqrt(
                                  cx * cx +
                                          cy * cy
                          );

                  float strength =
                          amount /
                                  100f *
                                  0.75f;

                  for (int y = 0;
                       y < height;
                       y++) {

                      for (int x = 0;
                           x < width;
                           x++) {

                          int index =
                                  y * width + x;

                          int color =
                                  pixels[index];

                          float dx =
                                  x - cx;

                          float dy =
                                  y - cy;

                          float distance =
                                  (float) Math.sqrt(
                                          dx * dx +
                                                  dy * dy
                                  ) /
                                          maxDist;

                          float edge =
                                  Math.max(
                                          0f,
                                          distance -
                                                  0.45f
                                  ) /
                                          0.55f;

                          edge =
                                  edge * edge;

                          float factor =
                                  1f -
                                          edge *
                                                  strength;

                          int r =
                                  (int) (
                                          Color.red(
                                                  color
                                          ) *
                                                  factor
                                  );

                          int g =
                                  (int) (
                                          Color.green(
                                                  color
                                          ) *
                                                  factor
                                  );

                          int b =
                                  (int) (
                                          Color.blue(
                                                  color
                                          ) *
                                                  factor
                                  );

                          pixels[index] =
                                  Color.argb(
                                          Color.alpha(
                                                  color
                                          ),
                                          Math.max(
                                                  0,
                                                  Math.min(
                                                          255,
                                                          r
                                                  )
                                          ),
                                          Math.max(
                                                  0,
                                                  Math.min(
                                                          255,
                                                          g
                                                  )
                                          ),
                                          Math.max(
                                                  0,
                                                  Math.min(
                                                          255,
                                                          b
                                                  )
                                          )
                                  );
                      }
                  }

                  bitmap.setPixels(
                          pixels,
                          0,
                          width,
                          0,
                          0,
                          width,
                          height
                  );
              }

              private LinearLayout baseColumn() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
