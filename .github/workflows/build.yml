                  parent.addView(section,p);
              }

              void addSlider(
                      LinearLayout parent,
                      int index
              ) {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  TextView label =
                          text(
                                  names[index] + "    0",
                                  13,
                                  Color.WHITE
                          );

                  SeekBar bar =
                          new SeekBar(this);

                  bar.setMax(200);
                  bar.setProgress(100);

                  sliders[index]=bar;

                  box.addView(
                          label,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(30)
                          )
                  );

                  box.addView(
                          bar,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(42)
                          )
                  );

                  parent.addView(
                          box,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(75)
                          )
                  );

                  bar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                      @Override
                      public void onStartTrackingTouch(
                              SeekBar seekBar
                      ) {
                          dragStart = snapshot();
                      }

                      @Override
                      public void onProgressChanged(
                              SeekBar seekBar,
                              int progress,
                              boolean fromUser
                      ) {

                          if(!fromUser) return;

                          values[index] =
                                  progress - 100;

                          label.setText(
                                  names[index] +
                                  "    " +
                                  String.format(
                                          Locale.US,
                                          "%.0f",
                                          values[index]
                                  )
                          );

                          scheduleRender();
                      }

                      @Override
                      public void onStopTrackingTouch(
                              SeekBar seekBar
                      ) {

                          if(dragStart != null) {
                              undo.push(dragStart);
                              redo.clear();
                              dragStart=null;
                          }

                          scheduleRender();
                      }
                  });
              }

              void addFilters(
                      LinearLayout parent
              ) {

                  HorizontalScrollView hsv =
                          new HorizontalScrollView(this);

                  LinearLayout row =
                          new LinearLayout(this);

                  row.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  String[] filters = {
                          "Original",
                          "Vivid",
                          "Vivid Warm",
                          "Vivid Cool",
                          "Dramatic",
                          "Dramatic Warm",
                          "Dramatic Cool",
                          "Mono",
                          "Silvertone",
                          "Noir",
                          "Warm",
                          "Cool",
                          "Fade"
                  };

                  for(int i=0;i<filters.length;i++) {

                      final int fi=i;

                      Button b =
                              new Button(this);

                      b.setText(filters[i]);
                      b.setTextSize(10);
                      b.setTextColor(Color.WHITE);

                      b.setOnClickListener(
                              v -> {

                                  undo.push(snapshot());
                                  redo.clear();

                                  selectedFilter=fi;

                                  scheduleRender();
                              }
                      );

                      row.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      dp(105),
                                      dp(52)
                              )
                      );
                  }

                  hsv.addView(row);

                  parent.addView(
                          hsv,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(65)
                          )
                  );

                  TextView ft =
                          text(
                                  "Filter Intensity    100",
                                  13,
                                  Color.WHITE
                          );

                  SeekBar intensity =
                          new SeekBar(this);

                  intensity.setMax(100);
                  intensity.setProgress(100);

                  intensity.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                      public void onStartTrackingTouch(
                              SeekBar b) {
                          }

                      public void onProgressChanged(
                              SeekBar b,
                              int p,
                              boolean user) {

                          if(user) {
                              filterIntensity=p;
                              ft.setText(
                                      "Filter Intensity    "+p
                              );
                              scheduleRender();
                          }
                      }

                      public void onStopTrackingTouch(
                              SeekBar b) {
                      }
                  });

                  parent.addView(
                          ft,
                          new LinearLayout.LayoutParams(
                                  -1,dp(30)
                          )
