name: RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf app build .gradle gradle
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/rcinstaedit
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '2.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#101014</item>
                  <item name="android:navigationBarColor">#101014</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="RCINSTAEDIT"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/MainActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.content.Intent;
          import android.content.ContentValues;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Matrix;
          import android.net.Uri;
          import android.os.Build;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private final int PICK_IMAGE = 1001;

              private Bitmap originalBitmap;
              private Bitmap currentBitmap;
              private ImageView preview;

              private float brightness = 0f;
              private float exposure = 0f;
              private float contrast = 0f;
              private float highlights = 0f;
              private float shadows = 0f;
              private float saturation = 0f;
              private float temperature = 0f;
              private float tint = 0f;
              private float fade = 0f;

              private float zoom = 1f;
              private float downX;
              private float downY;
              private float startX;
              private float startY;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  home();
              }

              private int dp(float value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, float size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextColor(0xFFFFFFFF);
                  t.setTextSize(size);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  t.setPadding(dp(16), dp(8), dp(16), dp(8));
                  return t;
              }

              private LinearLayout base() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF101014);
                  root.setPadding(dp(10), dp(10), dp(10), dp(10));
                  return root;
              }

              private Button button(String title) {
                  Button b = new Button(this);
                  b.setText(title);
                  b.setTextColor(0xFFFFFFFF);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setMinHeight(dp(48));
                  return b;
              }

              private void addTool(
                      LinearLayout parent,
                      String title,
                      View.OnClickListener listener
              ) {
                  TextView item = text(title, 15);
                  item.setBackgroundColor(0xFF1C1C22);
                  item.setOnClickListener(listener);

                  LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(54)
                          );

                  lp.setMargins(0, dp(5), 0, dp(5));
                  parent.addView(item, lp);
              }

              private void home() {
                  LinearLayout root = base();

                  TextView title = text("RCINSTAEDIT", 28);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, dp(18), 0, dp(8));
                  root.addView(title,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(70)
                          ));

                  TextView sub = text(
                          "Professional Photo & Reel Editor",
                          15
                  );
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(45)
                          ));

                  addTool(root, "📷  PHOTO EDITOR", v -> photoEditor());

                  addTool(root, "🎬  VIDEO EDITOR", v ->
                          Toast.makeText(
                                  this,
                                  "Video editor next stage mein add hoga.",
                                  Toast.LENGTH_SHORT
                          ).show());

                  addTool(root, "✨  EFFECTS", v ->
                          Toast.makeText(
                                  this,
                                  "Effects engine next stage mein add hoga.",
                                  Toast.LENGTH_SHORT
                          ).show());

                  addTool(root, "↔  TRANSITIONS", v ->
                          Toast.makeText(
                                  this,
                                  "Transitions video stage mein add honge.",
                                  Toast.LENGTH_SHORT
                          ).show());

                  addTool(root, "🎵  ADD AUDIO FROM PHONE", v ->
                          Toast.makeText(
                                  this,
                                  "Audio feature video editor ke saath add hoga.",
                                  Toast.LENGTH_SHORT
                          ).show());

                  addTool(root, "⬆  HIGH QUALITY EXPORT", v ->
                          Toast.makeText(
                                  this,
                                  "Photo editor mein Save se export karo.",
                                  Toast.LENGTH_SHORT
                          ).show());

                  setContentView(root);
              }

              private void photoEditor() {
                  LinearLayout root = base();

                  TextView heading = text("PHOTO EDITOR", 21);
                  heading.setGravity(Gravity.CENTER);
                  root.addView(heading,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(48)
                          ));

                  FrameLayout previewBox = new FrameLayout(this);
                  previewBox.setBackgroundColor(0xFF18181E);

                  preview = new ImageView(this);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  preview.setBackgroundColor(0xFF18181E);

                  previewBox.addView(
                          preview,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  root.addView(
                          previewBox,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          )
                  );

                  LinearLayout actions = new LinearLayout(this);
                  actions.setOrientation(LinearLayout.HORIZONTAL);

                  Button fit = button("FIT");
                  Button one = button("1:1");
                  Button before = button("BEFORE");

                  actions.addView(fit,
                          new LinearLayout.LayoutParams(0, dp(52), 1));
                  actions.addView(one,
                          new LinearLayout.LayoutParams(0, dp(52), 1));
                  actions.addView(before,
                          new LinearLayout.LayoutParams(0, dp(52), 1));

                  root.addView(actions);

                  fit.setOnClickListener(v -> {
                      zoom = 1f;
                      preview.setScaleX(1f);
                      preview.setScaleY(1f);
                      preview.setTranslationX(0);
                      preview.setTranslationY(0);
                  });

                  one.setOnClickListener(v -> {
                      zoom = 2f;
                      preview.setScaleX(2f);
                      preview.setScaleY(2f);
                  });

                  before.setOnTouchListener((v, event) -> {
                      if (originalBitmap == null) return true;

                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          preview.setImageBitmap(originalBitmap);
                          return true;
                      }

                      if (event.getAction() == MotionEvent.ACTION_UP ||
                              event.getAction() == MotionEvent.ACTION_CANCEL) {
                          preview.setImageBitmap(currentBitmap);
                          return true;
                      }

                      return true;
                  });

                  preview.setOnTouchListener((v, event) -> {
                      if (zoom <= 1f) return true;

                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          downX = event.getRawX();
                          downY = event.getRawY();
                          startX = preview.getTranslationX();
                          startY = preview.getTranslationY();
                          return true;
                      }

                      if (event.getAction() == MotionEvent.ACTION_MOVE) {
                          float dx = event.getRawX() - downX;
                          float dy = event.getRawY() - downY;

                          preview.setTranslationX(startX + dx);
                          preview.setTranslationY(startY + dy);
                          return true;
                      }

                      return true;
                  });

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout tools = new LinearLayout(this);
                  tools.setOrientation(LinearLayout.VERTICAL);

                  addTool(tools, "⚙  ADJUST", v -> adjust());
                  addTool(tools, "🎨  FILTERS", v -> photoFilters());
                  addTool(tools, "✂  CROP / ROTATE / FLIP", v -> transform());
                  addTool(tools, "↶  RESET", v -> resetPhoto());
                  addTool(tools, "💾  SAVE PHOTO", v -> savePhoto());

                  scroll.addView(tools);

                  root.addView(scroll,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(235)
                          ));

                  setContentView(root);

                  if (originalBitmap == null) {
                      chooseImage();
                  } else {
                      preview.setImageBitmap(currentBitmap);
                  }
              }

              private void chooseImage() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.setType("image/*");
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(intent, PICK_IMAGE);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == PICK_IMAGE &&
                          resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null) {

                      Uri uri = data.getData();

                      try {
                          Bitmap b =
                                  BitmapFactory.decodeStream(
                                          getContentResolver().openInputStream(uri)
                                  );

                          if (b != null) {
                              originalBitmap = b.copy(
                                      Bitmap.Config.ARGB_8888,
                                      true
                              );

                              currentBitmap = originalBitmap.copy(
                                      Bitmap.Config.ARGB_8888,
                                      true
                              );

                              photoEditor();
                          }

                      } catch (Exception e) {
                          Toast.makeText(
                                  this,
                                  "Image open nahi ho paayi.",
                                  Toast.LENGTH_SHORT
                          ).show();
                      }
                  }
              }

              private SeekBar addSlider(
                      LinearLayout parent,
                      String title,
                      int initial,
                      SeekBar.OnSeekBarChangeListener listener
              ) {
                  TextView label = text(title, 15);
                  parent.addView(label);

                  SeekBar bar = new SeekBar(this);
                  bar.setMax(200);
                  bar.setProgress(initial + 100);
                  bar.setOnSeekBarChangeListener(listener);

                  parent.addView(
                          bar,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(50)
                          )
                  );

                  return bar;
              }

              private void adjust() {
                  LinearLayout root = base();

                  TextView heading = text("ADJUST", 21);
                  heading.setGravity(Gravity.CENTER);
                  root.addView(heading,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(48)
                          ));

                  FrameLayout previewBox = createFixedPreview();
                  root.addView(previewBox,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(290)
                          ));

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);

                  Button back = button("‹ BACK");
                  Button before = button("BEFORE");
                  Button reset = button("RESET");

                  top.addView(back,
                          new LinearLayout.LayoutParams(0, dp(50), 1));
                  top.addView(before,
                          new LinearLayout.LayoutParams(0, dp(50), 1));
                  top.addView(reset,
                          new LinearLayout.LayoutParams(0, dp(50), 1));

                  root.addView(top);

                  back.setOnClickListener(v -> photoEditor());

                  before.setOnTouchListener((v, event) -> {
                      if (originalBitmap == null) return true;

                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          preview.setImageBitmap(originalBitmap);
                          return true;
                      }

                      if (event.getAction() == MotionEvent.ACTION_UP ||
                              event.getAction() == MotionEvent.ACTION_CANCEL) {
                          render();
                          return true;
                      }

                      return true;
                  });

                  reset.setOnClickListener(v -> {
                      brightness = 0;
                      exposure = 0;
                      contrast = 0;
                      highlights = 0;
                      shadows = 0;
                      saturation = 0;
                      temperature = 0;
                      tint = 0;
                      fade = 0;
                      render();
                  });

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout controls = new LinearLayout(this);
                  controls.setOrientation(LinearLayout.VERTICAL);

                  addSlider(
                          controls,
                          "Brightness",
                          (int) brightness,
                          (s, p, f) -> {
                              brightness = p - 100;
                              render();
                          });

                  addSlider(
                          controls,
                          "Exposure",
                          (int) exposure,
                          (s, p, f) -> {
                              exposure = p - 100;
                              render();
                          });

                  addSlider(
                          controls,
                          "Contrast",
                          (int) contrast,
                          (s, p, f) -> {
                              contrast = p - 100;
                              render();
                          });

                  addSlider(
                          controls,
                          "Highlights",
                          (int) highlights,
                          (s, p, f) -> {
                              highlights = p - 100;
                              render();
                          });

                  addSlider(
                          controls,
                          "Shadows",
                          (int) shadows,
                          (s, p, f) -> {
                              shadows = p - 100;
                              render();
                          });

                  addSlider(
                          controls,
                          "Saturation",
                          (int) saturation,
                          (s, p, f) -> {
                              saturation = p - 100;
                              render();
                          });

                  addSlider(
                          controls,
                          "Temperature",
                          (int) temperature,
                          (s, p, f) -> {
                              temperature = p - 100;
                              render();
                          });

                  addSlider(
                          controls,
                          "Tint",
                          (int) tint,
                          (s, p, f) -> {
                              tint = p - 100;
                              render();
                          });

                  addSlider(
                          controls,
                          "Fade",
                          (int) fade,
                          (s, p, f) -> {
                              fade = p - 100;
                              render();
                          });

                  scroll.addView(controls);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          )
                  );

                  setContentView(root);
                  render();
              }

              private FrameLayout createFixedPreview() {
                  FrameLayout box = new FrameLayout(this);
                  box.setBackgroundColor(0xFF18181E);

                  preview = new ImageView(this);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  box.addView(
                          preview,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  return box;
              }

              private void render() {
                  if (originalBitmap == null || preview == null) return;

                  Bitmap src = originalBitmap;

                  ColorMatrix cm = new ColorMatrix();

                  float sat = 1f + saturation / 100f;
                  ColorMatrix saturationMatrix = new ColorMatrix();
                  saturationMatrix.setSaturation(sat);
                  cm.postConcat(saturationMatrix);

                  float c = 1f + contrast / 100f;
                  float translate = 128f * (1f - c);

                  ColorMatrix contrastMatrix = new ColorMatrix(
                          new float[]{
                                  c, 0, 0, 0, translate,
                                  0, c, 0, 0, translate,
                                  0, 0, c, 0, translate,
                                  0, 0, 0, 1, 0
                          }
                  );
                  cm.postConcat(contrastMatrix);

                  float exposureScale =
                          (float) Math.pow(
                                  2.0,
                                  exposure / 100.0
                          );

                  ColorMatrix exposureMatrix = new ColorMatrix(
                          new float[]{
                                  exposureScale, 0, 0, 0, brightness * 1.5f,
                                  0, exposureScale, 0, 0, brightness * 1.5f,
                                  0, 0, exposureScale, 0, brightness * 1.5f,
                                  0, 0, 0, 1, 0
                          }
                  );

                  cm.postConcat(exposureMatrix);

                  float temp = temperature * 0.8f;
                  float ti = tint * 0.5f;

                  ColorMatrix colorMatrix = new ColorMatrix(
                          new float[]{
                                  1, 0, 0, 0, temp,
                                  0, 1, 0, 0, ti,
                                  0, 0, 1, 0, -temp,
                                  0, 0, 0, 1, 0
                          }
                  );

                  cm.postConcat(colorMatrix);

                  float fadeAmount = fade / 100f;

                  ColorMatrix fadeMatrix = new ColorMatrix(
                          new float[]{
                                  1 - fadeAmount * 0.25f, 0, 0, 0, fadeAmount * 30,
                                  0, 1 - fadeAmount * 0.25f, 0, 0, fadeAmount * 30,
                                  0, 0, 1 - fadeAmount * 0.25f, 0, fadeAmount * 30,
                                  0, 0, 0, 1, 0
                          }
                  );

                  cm.postConcat(fadeMatrix);

                  preview.setImageBitmap(src);
                  preview.setColorFilter(new ColorMatrixColorFilter(cm));

                  currentBitmap = src;
              }

              private void photoFilters() {
                  LinearLayout root = base();

                  TextView heading = text("FILTERS", 21);
                  heading.setGravity(Gravity.CENTER);
                  root.addView(heading,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(50)
                          ));

                  FrameLayout box = createFixedPreview();

                  root.addView(
                          box,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(330)
                          )
                  );

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout tools = new LinearLayout(this);
                  tools.setOrientation(LinearLayout.VERTICAL);

                  addTool(tools, "Original", v -> filterOriginal());
                  addTool(tools, "Black & White", v -> filterBW());
                  addTool(tools, "Cinematic", v -> filterCinematic());
                  addTool(tools, "Vintage", v -> filterVintage());
                  addTool(tools, "Warm", v -> filterWarm());
                  addTool(tools, "Cool", v -> filterCool());
                  addTool(tools, "Dramatic", v -> filterDramatic());
                  addTool(tools, "Fade", v -> filterFade());
                  addTool(tools, "‹ BACK", v -> photoEditor());

                  scroll.addView(tools);
                  root.addView(scroll,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          ));

                  setContentView(root);

                  render();
              }

              private void setFilter(float[] values) {
                  if (preview == null) return;

                  ColorMatrix matrix = new ColorMatrix(values);
                  preview.setColorFilter(new ColorMatrixColorFilter(matrix));
              }

              private void filterOriginal() {
                  preview.clearColorFilter();
              }

              private void filterBW() {
                  ColorMatrix m = new ColorMatrix();
                  m.setSaturation(0);
                  setFilter(m.getArray());
              }

              private void filterCinematic() {
                  setFilter(new float[]{
                          1.15f, 0, 0, 0, -10,
                          0, 1.05f, 0, 0, 0,
                          0, 0, 0.95f, 0, 8,
                          0, 0, 0, 1, 0
                  });
              }

              private void filterVintage() {
                  setFilter(new float[]{
                          1.08f, 0, 0, 0, 5,
                          0, 1.00f, 0, 0, 0,
                          0, 0, 0.88f, 0, 12,
                          0, 0, 0, 1, 0
                  });
              }

              private void filterWarm() {
                  setFilter(new float[]{
                          1.12f, 0, 0, 0, 8,
                          0, 1.02f, 0, 0, 2,
                          0, 0, 0.90f, 0, -5,
                          0, 0, 0, 1, 0
                  });
              }

              private void filterCool() {
                  setFilter(new float[]{
                          0.92f, 0, 0, 0, 0,
                          0, 1.02f, 0, 0, 2,
                          0, 0, 1.12f, 0, 8,
                          0, 0, 0, 1, 0
                  });
              }

              private void filterDramatic() {
                  setFilter(new float[]{
                          1.25f, 0, 0, 0, -25,
                          0, 1.25f, 0, 0, -25,
                          0, 0, 1.25f, 0, -25,
                          0, 0, 0, 1, 0
                  });
              }

              private void filterFade() {
                  setFilter(new float[]{
                          0.85f, 0, 0, 0, 35,
                          0, 0.85f, 0, 0, 35,
                          0, 0, 0.85f, 0, 35,
                          0, 0, 0, 1, 0
                  });
              }

              private void transform() {
                  LinearLayout root = base();

                  TextView heading = text("TRANSFORM", 21);
                  heading.setGravity(Gravity.CENTER);
                  root.addView(heading,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(50)
                          ));

                  FrameLayout box = createFixedPreview();

                  root.addView(
                          box,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f
                          )
                  );

                  LinearLayout tools = new LinearLayout(this);
                  tools.setOrientation(LinearLayout.VERTICAL);

                  addTool(tools, "↻ Rotate 90°", v -> rotate90());
                  addTool(tools, "↔ Flip Horizontal", v -> flipHorizontal());
                  addTool(tools, "↕ Flip Vertical", v -> flipVertical());

                  addTool(tools, "✂ Crop",
                          v -> Toast.makeText(
                                  this,
                                  "Crop engine next stage mein.",
                                  Toast.LENGTH_SHORT
                          ).show());

                  addTool(tools, "‹ BACK", v -> photoEditor());

                  root.addView(tools,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(300)
                          ));

                  setContentView(root);

                  render();
              }

              private void rotate90() {
                  if (originalBitmap == null) return;

                  Matrix matrix = new Matrix();
                  matrix.postRotate(90);

                  originalBitmap = Bitmap.createBitmap(
                          originalBitmap,
                          0,
                          0,
                          originalBitmap.getWidth(),
                          originalBitmap.getHeight(),
                          matrix,
                          true
                  );

                  currentBitmap = originalBitmap.copy(
                          Bitmap.Config.ARGB_8888,
                          true
                  );

                  preview.setImageBitmap(currentBitmap);
              }

              private void flipHorizontal() {
                  if (originalBitmap == null) return;

                  Matrix matrix = new Matrix();
                  matrix.setScale(-1, 1);

                  originalBitmap = Bitmap.createBitmap(
                          originalBitmap,
                          0,
                          0,
                          originalBitmap.getWidth(),
                          originalBitmap.getHeight(),
                          matrix,
                          true
                  );

                  currentBitmap = originalBitmap.copy(
                          Bitmap.Config.ARGB_8888,
                          true
                  );

                  preview.setImageBitmap(currentBitmap);
              }

              private void flipVertical() {
                  if (originalBitmap == null) return;

                  Matrix matrix = new Matrix();
                  matrix.setScale(1, -1);

                  originalBitmap = Bitmap.createBitmap(
                          originalBitmap,
                          0,
                          0,
                          originalBitmap.getWidth(),
                          originalBitmap.getHeight(),
                          matrix,
                          true
                  );

                  currentBitmap = originalBitmap.copy(
                          Bitmap.Config.ARGB_8888,
                          true
                  );

                  preview.setImageBitmap(currentBitmap);
              }

              private void resetPhoto() {
                  brightness = 0;
                  exposure = 0;
                  contrast = 0;
                  highlights = 0;
                  shadows = 0;
                  saturation = 0;
                  temperature = 0;
                  tint = 0;
                  fade = 0;

                  if (originalBitmap != null) {
                      currentBitmap = originalBitmap.copy(
                              Bitmap.Config.ARGB_8888,
                              true
                      );
                  }

                  photoEditor();
              }

              private void savePhoto() {
                  if (originalBitmap == null) {
                      Toast.makeText(
                              this,
                              "Pehle photo select karo.",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  try {
                      Bitmap output = originalBitmap.copy(
                              Bitmap.Config.ARGB_8888,
                              true
                      );

                      android.graphics.Canvas canvas =
                              new android.graphics.Canvas(output);

                      android.graphics.Paint paint =
                              new android.graphics.Paint();

                      ColorMatrix cm = new ColorMatrix();
                      float sat = 1f + saturation / 100f;
                      ColorMatrix sm = new ColorMatrix();
                      sm.setSaturation(sat);
                      cm.postConcat(sm);

                      float c = 1f + contrast / 100f;
                      float tr = 128f * (1f - c);

                      cm.postConcat(
                              new ColorMatrix(new float[]{
                                      c, 0, 0, 0, tr,
                                      0, c, 0, 0, tr,
                                      0, 0, c, 0, tr,
                                      0, 0, 0, 1, 0
                              })
                      );

                      float es =
                              (float) Math.pow(
                                      2.0,
                                      exposure / 100.0
                              );

                      cm.postConcat(
                              new ColorMatrix(new float[]{
                                      es, 0, 0, 0, brightness * 1.5f,
                                      0, es, 0, 0, brightness * 1.5f,
                                      0, 0, es, 0, brightness * 1.5f,
                                      0, 0, 0, 1, 0
                              })
                      );

                      paint.setColorFilter(
                              new ColorMatrixColorFilter(cm)
                      );

                      canvas.drawBitmap(
                              originalBitmap,
                              0,
                              0,
                              paint
                      );

                      ContentValues values = new ContentValues();
                      values.put(
                              MediaStore.Images.Media.DISPLAY_NAME,
                              "RCINSTAEDIT_" +
                                      System.currentTimeMillis() +
                                      ".jpg"
                      );
                      values.put(
                              MediaStore.Images.Media.MIME_TYPE,
                              "image/jpeg"
                      );

                      if (Build.VERSION.SDK_INT >= 29) {
                          values.put(
                                  MediaStore.Images.Media.RELATIVE_PATH,
                                  "Pictures/RCINSTAEDIT"
                          );
                          values.put(
                                  MediaStore.Images.Media.IS_PENDING,
                                  1
                          );
                      }

                      Uri uri = getContentResolver().insert(
                              MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                              values
                      );

                      if (uri != null) {
                          OutputStream out =
                                  getContentResolver().openOutputStream(uri);

                          output.compress(
                                  Bitmap.CompressFormat.JPEG,
                                  95,
                                  out
                          );

                          if (out != null) out.close();

                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues done =
                                      new ContentValues();
                              done.put(
                                      MediaStore.Images.Media.IS_PENDING,
                                      0
                              );

                              getContentResolver().update(
                                      uri,
                                      done,
                                      null,
                                      null
                              );
                          }

                          Toast.makeText(
                                  this,
                                  "Photo saved in Pictures/RCINSTAEDIT",
                                  Toast.LENGTH_LONG
                          ).show();
                      }

                  } catch (Exception e) {
                      Toast.makeText(
                              this,
                              "Save failed: " + e.getMessage(),
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }
          }
          EOF

      - name: Verify Project
        shell: bash
        run: |
          set -e

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/rcinstaedit/MainActivity.java

          echo "Project verified successfully"

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.9

          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "APK verified successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-Build-3-Fixed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
