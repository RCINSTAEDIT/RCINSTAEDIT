              void choosePhoto() {

                  Intent i =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                          );

                  i.setType("image/*");
                  i.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(i,1001);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
              ) {
                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if(requestCode==1001 &&
                          resultCode==RESULT_OK &&
                          data!=null &&
                          data.getData()!=null) {

                      photoUri=data.getData();

                      try {
                          baseBitmap =
                                  decodeSampled(
                                          photoUri,
                                          1600
                                  );

                          preview.setImageBitmap(
                                  baseBitmap
                          );

                          undo.clear();
                          redo.clear();

                          scheduleRender();

                      } catch(Exception e) {
                          Toast.makeText(
                                  this,
                                  "Photo load nahi hui",
                                  Toast.LENGTH_SHORT
                          ).show();
                      }
                  }
              }

              Bitmap decodeSampled(
                      Uri uri,
                      int maxSize
              ) throws Exception {

                  BitmapFactory.Options o =
                          new BitmapFactory.Options();

                  o.inJustDecodeBounds=true;

                  InputStream in =
                          getContentResolver()
                                  .openInputStream(uri);

                  BitmapFactory.decodeStream(in,null,o);
                  in.close();

                  int sample=1;

                  while(
                          Math.max(
                                  o.outWidth/sample,
                                  o.outHeight/sample
                          ) > maxSize
                  ) {
                      sample*=2;
                  }

                  BitmapFactory.Options real =
                          new BitmapFactory.Options();

                  real.inSampleSize=sample;
                  real.inPreferredConfig =
                          Bitmap.Config.ARGB_8888;

                  in =
                          getContentResolver()
                                  .openInputStream(uri);

                  Bitmap b =
                          BitmapFactory.decodeStream(
                                  in,
                                  null,
                                  real
                          );

                  in.close();

                  return b;
              }

              void scheduleRender() {

                  handler.removeCallbacksAndMessages(
                          "RENDER"
                  );

                  Runnable task =
                          () -> renderNow();

                  handler.postAtTime(
                          task,
                          "RENDER",
                          android.os.SystemClock.uptimeMillis()+90
                  );
              }

              void renderNow() {

                  if(baseBitmap==null) return;

                  final Bitmap source=baseBitmap;
                  final float[] v=values.clone();
                  final int filter=selectedFilter;
                  final int intensity=filterIntensity;
                  final int generation=++renderGeneration;

                  if(renderFuture!=null)
                      renderFuture.cancel(true);

                  renderFuture =
                          executor.submit(() -> {

                      Bitmap out =
                              processBitmap(
                                      source,
                                      v,
                                      filter,
                                      intensity
                              );

                      if(out==null) return;

                      runOnUiThread(() -> {

                          if(generation!=renderGeneration) {
                              out.recycle();
                              return;
                          }

                          Bitmap old=renderedBitmap;

                          renderedBitmap=out;

                          preview.setImageBitmap(out);

                          if(old!=null &&
                                  old!=baseBitmap &&
                                  old!=out &&
                                  !old.isRecycled()) {
                              old.recycle();
                          }
                      });
                  });
              }

              Bitmap processBitmap(
                      Bitmap src,
                      float[] v,
                      int filter,
                      int intensity
              ) {

                  int w=src.getWidth();
                  int h=src.getHeight();

                  int[] pixels =
                          new int[w*h];

                  src.getPixels(
                          pixels,
                          0,
                          w,
                          0,
                          0,
                          w,
                          h
                  );

                  int[] original =
                          pixels.clone();

                  float[] hsv=new float[3];

                  float sharp =
                          Math.max(
                                  0,
                                  v[12]
                          )/100f;

                  float definition =
                          v[13]/100f;

                  float noise =
                          Math.max(
                                  0,
                                  v[14]
                          )/100f;

                  for(int y=0;y<h;y++) {

                      if(Thread.currentThread()
                              .isInterrupted())
                          return null;

                      for(int x=0;x<w;x++) {

                          int idx=y*w+x;

                          int c=original[idx];

                          float r=Color.red(c);
                          float g=Color.green(c);
                          float b=Color.blue(c);

                          if(noise>0) {

                              int count=1;

                              float ar=r;
                              float ag=g;
                              float ab=b;

                              if(x>0) {
                                  int q=original[idx-1];
                                  ar+=Color.red(q);
                                  ag+=Color.green(q);
                                  ab+=Color.blue(q);
                                  count++;
                              }

                              if(x<w-1) {
                                  int q=original[idx+1];
                                  ar+=Color.red(q);
                                  ag+=Color.green(q);
                                  ab+=Color.blue(q);
                                  count++;
                              }

                              if(y>0) {
                                  int q=original[idx-w];
                                  ar+=Color.red(q);
                                  ag+=Color.green(q);
                                  ab+=Color.blue(q);
                                  count++;
                              }

                              if(y<h-1) {
                                  int q=original[idx+w];
                                  ar+=Color.red(q);
                                  ag+=Color.green(q);
                                  ab+=Color.blue(q);
                                  count++;
                              }

                              float nr=ar/count;
                              float ng=ag/count;
                              float nb=ab/count;

                              r=r*(1-noise)+nr*noise;
                              g=g*(1-noise)+ng*noise;
                              b=b*(1-noise)+nb*noise;
                          }

                          if(sharp>0) {

                              float nr=0;
                              float ng=0;
                              float nb=0;
                              int count=0;

                              if(x>0) {
                                  int q=original[idx-1];
                                  nr+=Color.red(q);
                                  ng+=Color.green(q);
                                  nb+=Color.blue(q);
                                  count++;
                              }

                              if(x<w-1) {
                                  int q=original[idx+1];
                                  nr+=Color.red(q);
                                  ng+=Color.green(q);
                                  nb+=Color.blue(q);
                                  count++;
                              }

                              if(y>0) {
                                  int q=original[idx-w];
                                  nr+=Color.red(q);
                                  ng+=Color.green(q);
                                  nb+=Color.blue(q);
                                  count++;
                              }

                              if(y<h-1) {
                                  int q=original[idx+w];
                                  nr+=Color.red(q);
                                  ng+=Color.green(q);
                                  nb+=Color.blue(q);
                                  count++;
                              }

                              if(count>0) {

                                  nr/=count;
                                  ng/=count;
                                  nb/=count;

                                  r +=
                                          (r-nr)
                                          *sharp
                                          *1.25f;

                                  g +=
                                          (g-ng)
                                          *sharp
                                          *1.25f;

                                  b +=
                                          (b-nb)
                                          *sharp
                                          *1.25f;
                              }
                          }

                          float lum =
                                  (0.2126f*r+
                                   0.7152f*g+
                                   0.0722f*b)
                                  /255f;

                          if(definition!=0) {

                              float avg =
                                      (r+g+b)/3f;

                              float d =
                                      (lum*255f-avg);

                              float amount =
                                      definition*0.45f;

                              r += d*amount;
                              g += d*amount;
                              b += d*amount;
                          }

                          // Brightness
                          r += v[0]*1.25f;
                          g += v[0]*1.25f;
                          b += v[0]*1.25f;

                          // Exposure
                          float exposure =
                                  (float)Math.pow(
                                          2.0,
                                          v[1]/100.0
                                  );

                          r*=exposure;
                          g*=exposure;
                          b*=exposure;

                          // Brilliance
                          float mid =
                                  1f-Math.abs(
                                          lum-0.5f
                                  )*2f;

                          float brilliance =
                                  v[2]/100f;

                          r +=
                                  (128f-r)
                                  *brilliance
                                  *mid*0.22f;

                          g +=
                                  (128f-g)
                                  *brilliance
                                  *mid*0.22f;

                          b +=
                                  (128f-b)
                                  *brilliance
                                  *mid*0.22f;

                          // Contrast
                          float contrast =
                                  v[3]/100f;

                          float cf =
                                  1f+contrast*1.5f;

                          r=(r-128f)*cf+128f;
                          g=(g-128f)*cf+128f;
                          b=(b-128f)*cf+128f;

                          // Highlights
                          float hi =
                                  v[4]/100f;

                          if(lum>0.5f) {

                              float weight =
                                      (lum-0.5f)*2f;

                              if(hi>0) {
                                  r+=(255-r)*hi*
                                          weight*0.35f;
                                  g+=(255-g)*hi*
                                          weight*0.35f;
                                  b+=(255-b)*hi*
                                          weight*0.35f;
                              } else {
                                  float f =
                                          1f+hi*
                                          weight*0.55f;
                                  r*=f;
                                  g*=f;
                                  b*=f;
                              }
                          }

                          // Shadows
                          float sh =
                                  v[5]/100f;

                          if(lum<0.5f) {

                              float weight =
                                      1f-lum*2f;

                              if(sh>0) {
                                  r+=(255-r)*sh*
                                          weight*0.38f;
                                  g+=(255-g)*sh*
                                          weight*0.38f;
                                  b+=(255-b)*sh*
                                          weight*0.38f;
                              } else {
                                  float f =
                                          1f+sh*
                                          weight*0.55f;
                                  r*=f;
                                  g*=f;
                                  b*=f;
                              }
                          }

                          // Black Point
                          float bp =
                                  v[6]/100f;

                          if(lum<0.35f) {

                              float weight =
                                      1f-lum/0.35f;

                              r -= bp*55f*weight;
                              g -= bp*55f*weight;
                              b -= bp*55f*weight;
                          }

                          r=clamp(r);
                          g=clamp(g);
                          b=clamp(b);

                          Color.RGBToHSV(
                                  (int)r,
                                  (int)g,
                                  (int)b,
                                  hsv
                          );

                          // Saturation
                          float sat =
                                  hsv[1];

                          sat *=
                                  1f+
                                  v[7]/100f;

                          // Vibrance
                          float vib =
                                  v[8]/100f;

                          sat +=
                                  vib*
                                  (1f-sat)*
                                  0.85f;

                          hsv[1]=clamp01(sat);

                          // Hue
                          hsv[0]+=
                                  v[11]/100f*
                                  180f;

                          while(hsv[0]<0)
                              hsv[0]+=360;

                          while(hsv[0]>=360)
                              hsv[0]-=360;

                          int rgb =
                                  Color.HSVToColor(hsv);

                          r=Color.red(rgb);
                          g=Color.green(rgb);
                          b=Color.blue(rgb);

                          // Warmth / Temperature
                          float warm =
                                  v[9]/100f;

                          r += warm*35f;
                          b -= warm*35f;

                          // Tint
                          float tint =
                                  v[10]/100f;

                          r += tint*22f;
                          b += tint*22f;
                          g -= tint*30f;

                          // Fade
                          float fade =
                                  Math.max(
                                          0,
                                          v[15]
                                  )/100f;

                          if(fade>0) {
                              r =
                                      r*(1-fade*0.38f)
                                      +128f*
                                      fade*0.38f;

                              g =
                                      g*(1-fade*0.38f)
                                      +128f*
                                      fade*0.38f;

                              b =
                                      b*(1-fade*0.38f)
                                      +128f*
                                      fade*0.38f;
                          }

                          // FILTER
                          float fr=r;
                          float fg=g;
                          float fb=b;

                          float[] fhsv =
                                  new float[3];

                          switch(filter) {

                              case 1: // Vivid
                                  Color.RGBToHSV(
                                          (int)r,
                                          (int)g,
                                          (int)b,
                                          fhsv
                                  );
                                  fhsv[1]=clamp01(
                                          fhsv[1]+0.22f
                                  );
                                  r*=1.08f;
                                  g*=1.08f;
                                  b*=1.08f;
                                  int vivid=
                                          Color.HSVToColor(fhsv);
                                  fr=Color.red(vivid);
                                  fg=Color.green(vivid);
                                  fb=Color.blue(vivid);
                                  break;

                              case 2: // Vivid Warm
                                  Color.RGBToHSV(
                                          (int)r,
                                          (int)g,
                                          (int)b,
                                          fhsv
                                  );
                                  fhsv[1]=clamp01(
                                          fhsv[1]+0.25f
                                  );
                                  int vw=
                                          Color.HSVToColor(fhsv);
                                  fr=Color.red(vw)+15;
                                  fg=Color.green(vw)+5;
                                  fb=Color.blue(vw)-15;
                                  break;

                              case 3: // Vivid Cool
                                  Color.RGBToHSV(
                                          (int)r,
                                          (int)g,
                                          (int)b,
                                          fhsv
                                  );
                                  fhsv[1]=clamp01(
                                          fhsv[1]+0.25f
                                  );
                                  int vc=
                                          Color.HSVToColor(fhsv);
                                  fr=Color.red(vc)-12;
                                  fg=Color.green(vc)+3;
                                  fb=Color.blue(vc)+18;
                                  break;

                              case 4: // Dramatic
                                  fr=(r-128)*1.35f+128;
                                  fg=(g-128)*1.35f+128;
                                  fb=(b-128)*1.35f+128;
                                  break;

                              case 5: // Dramatic Warm
                                  fr=(r-128)*1.38f+138;
                                  fg=(g-128)*1.35f+130;
                                  fb=(b-128)*1.30f+112;
                                  break;

                              case 6: // Dramatic Cool
                                  fr=(r-128)*1.38f+112;
                                  fg=(g-128)*1.35f+128;
                                  fb=(b-128)*1.40f+142;
                                  break;

                              case 7: // Mono
                                  float gray=
                                          0.299f*r+
                                          0.587f*g+
                                          0.114f*b;
                                  fr=fg=fb=gray;
                                  break;

                              case 8: // Silvertone
                                  float silver=
                                          0.299f*r+
                                          0.587f*g+
                                          0.114f*b;
                                  silver=
                                          (silver-128)*1.18f
                                          +128;
                                  fr=silver+5;
                                  fg=silver+5;
                                  fb=silver+8;
                                  break;

                              case 9: // Noir
                                  float noir=
                                          0.299f*r+
                                          0.587f*g+
                                          0.114f*b;
                                  noir=
                                          (noir-128)*1.65f
                                          +118;
                                  fr=fg=fb=noir;
                                  break;

                              case 10: // Warm
                                  fr=r+22;
                                  fg=g+5;
                                  fb=b-22;
                                  break;

                              case 11: // Cool
                                  fr=r-18;
                                  fg=g+2;
                                  fb=b+24;
                                  break;

                              case 12: // Fade
                                  fr=r*0.72f+128*0.28f;
                                  fg=g*0.72f+128*0.28f;
                                  fb=b*0.72f+128*0.28f;
                                  break;
                          }

                          float fi =
                                  intensity/100f;

                          r=r*(1-fi)+fr*fi;
                          g=g*(1-fi)+fg*fi;
                          b=b*(1-fi)+fb*fi;

                          // VIGNETTE
                          float vig =
                                  v[16]/100f;

                          if(vig!=0) {

                              float nx =
                                      (x-w/2f)/(w/2f);

                              float ny =
                                      (y-h/2f)/(h/2f);

                              float dist =
                                      (float)Math.sqrt(
                                              nx*nx+ny*ny
                                      );

                              float edge =
                                      Math.min(
                                              1f,
                                              Math.max(
                                                      0f,
                                                      (dist-0.25f)/0.75f
                                              )
                                      );

                              float amount =
                                      vig*0.75f*edge;

                              if(amount>0) {
                                  r*=1f-amount;
                                  g*=1f-amount;
                                  b*=1f-amount;
                              } else {
                                  float lift=
                                          -amount;
                                  r+=
                                          (255-r)*lift*0.25f;
                                  g+=
                                          (255-g)*lift*0.25f;
                                  b+=
                                          (255-b)*lift*0.25f;
                              }
                          }

                          pixels[idx]=Color.rgb(
                                  clampInt(r),
                                  clampInt(g),
                                  clampInt(b)
                          );
                      }
                  }

                  Bitmap out =
                          Bitmap.createBitmap(
                                  w,
                                  h,
                                  Bitmap.Config.ARGB_8888
                          );

                  out.setPixels(
                          pixels,
                          0,
                          w,
                          0,
                          0,
                          w,
                          h
                  );

                  return out;
              }

              float clamp(float x) {
                  return Math.max(
                          0,
                          Math.min(255,x)
                  );
              }

              int clampInt(float x) {
                  return Math.max(
                          0,
                          Math.min(
                                  255,
                                  Math.round(x)
                          )
                  );
              }

              float clamp01(float x) {
                  return Math.max(
                          0f,
                          Math.min(1f,x)
                  );
              }

              EditSnapshot snapshot() {

                  EditSnapshot s =
                          new EditSnapshot();

                  s.values=values.clone();
                  s.filter=selectedFilter;
                  s.intensity=filterIntensity;

                  return s;
              }

              void restore(EditSnapshot s) {

                  if(s==null) return;

                  System.arraycopy(
                          s.values,
                          0,
                          values,
                          0,
                          17
                  );

                  selectedFilter=s.filter;
                  filterIntensity=s.intensity;

                  for(int i=0;i<17;i++) {

                      if(sliders[i]!=null)
                          sliders[i].setProgress(
                                  (int)values[i]+100
                          );
                  }

                  scheduleRender();
              }

              void undo() {

                  if(undo.isEmpty()) return;

                  redo.push(snapshot());

                  EditSnapshot s =
                          undo.pop();

                  restore(s);
              }

              void redo() {

                  if(redo.isEmpty()) return;

                  undo.push(snapshot());

                  EditSnapshot s =
                          redo.pop();

                  restore(s);
              }

              void resetAll() {

                  undo.push(snapshot());
                  redo.clear();

                  for(int i=0;i<17;i++)
                      values[i]=0;

                  selectedFilter=0;
                  filterIntensity=100;

                  for(int i=0;i<17;i++)
                      if(sliders[i]!=null)
                          sliders[i].setProgress(100);

                  scheduleRender();
              }

              void rotate() {

                  if(baseBitmap==null) return;

                  undo.push(snapshot());
                  redo.clear();

                  Matrix m=new Matrix();
                  m.postRotate(90);

                  Bitmap old=baseBitmap;

                  baseBitmap =
                          Bitmap.createBitmap(
                                  old,
                                  0,
                                  0,
                                  old.getWidth(),
                                  old.getHeight(),
                                  m,
                                  true
                          );

                  if(old!=baseBitmap)
                      old.recycle();

                  scheduleRender();
              }

              void flip(boolean horizontal) {

                  if(baseBitmap==null) return;

                  undo.push(snapshot());
                  redo.clear();

                  Matrix m=new Matrix();

                  if(horizontal)
                      m.setScale(-1,1);
                  else
                      m.setScale(1,-1);

                  Bitmap old=baseBitmap;

                  baseBitmap =
                          Bitmap.createBitmap(
                                  old,
                                  0,
                                  0,
                                  old.getWidth(),
                                  old.getHeight(),
                                  m,
                                  true
                          );

                  if(old!=baseBitmap)
                      old.recycle();

                  scheduleRender();
              }

              void cropCenter() {

                  if(baseBitmap==null) return;

                  undo.push(snapshot());
                  redo.clear();

                  int w=baseBitmap.getWidth();
                  int h=baseBitmap.getHeight();

                  int side=Math.min(w,h);

                  int left=(w-side)/2;
                  int top=(h-side)/2;

                  Bitmap old=baseBitmap;

                  baseBitmap =
                          Bitmap.createBitmap(
                                  old,
                                  left,
                                  top,
                                  side,
                                  side
                          );

                  if(old!=baseBitmap)
                      old.recycle();

                  scheduleRender();
              }

              void showBefore() {

                  if(baseBitmap==null) return;

                  if(renderedBitmap!=null) {
                      preview.setImageBitmap(
                              baseBitmap
                      );

                      handler.postDelayed(
                              () -> {
                                  if(renderedBitmap!=null)
                                      preview.setImageBitmap(
                                              renderedBitmap
                                      );
                              },
                              1200
                      );
                  }
              }

              void savePhoto() {

                  if(baseBitmap==null) {
                      Toast.makeText(
                              this,
                              "Pehle photo choose karo",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  final Bitmap source=baseBitmap;
                  final float[] v=values.clone();
                  final int f=selectedFilter;
                  final int intensity=filterIntensity;

                  Toast.makeText(
                          this,
                          "Saving...",
                          Toast.LENGTH_SHORT
                  ).show();

                  executor.submit(() -> {

                      Bitmap finalBitmap =
                              processBitmap(
                                      source,
                                      v,
                                      f,
                                      intensity
                              );

                      if(finalBitmap==null)
                          return;

                      try {

                          ContentValues cv =
                                  new ContentValues();

                          cv.put(
                                  MediaStore.Images.Media.DISPLAY_NAME,
                                  "RCINSTAEDIT_" +
                                  System.currentTimeMillis() +
                                  ".jpg"
                          );

                          cv.put(
                                  MediaStore.Images.Media.MIME_TYPE,
                                  "image/jpeg"
                          );

                          cv.put(
                                  MediaStore.Images.Media.RELATIVE_PATH,
                                  Environment.DIRECTORY_PICTURES
                                  + "/RCINSTAEDIT"
                          );

                          Uri outUri =
                                  getContentResolver()
                                          .insert(
                                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                                  cv
                                          );

                          if(outUri==null)
                              throw new Exception();

                          OutputStream out =
                                  getContentResolver()
                                          .openOutputStream(outUri);

                          finalBitmap.compress(
                                  Bitmap.CompressFormat.JPEG,
                                  96,
                                  out
                          );

                          out.flush();
                          out.close();

                          finalBitmap.recycle();

                          runOnUiThread(() ->
                                  Toast.makeText(
                                          this,
                                          "Photo saved in Pictures/RCINSTAEDIT",
                                          Toast.LENGTH_LONG
                                  ).show()
                          );

                      } catch(Exception e) {

                          runOnUiThread(() ->
                                  Toast.makeText(
                                          this,
                                          "Save failed",
                                          Toast.LENGTH_SHORT
                                  ).show()
                          );
                      }
                  });
              }

              @Override
              protected void onDestroy() {

                  handler.removeCallbacksAndMessages(null);

                  if(renderFuture!=null)
                      renderFuture.cancel(true);

                  executor.shutdownNow();

                  super.onDestroy();
              }

              static class EditSnapshot {

                  float[] values;
                  int filter;
                  int intensity;
              }
          }
          EOF

      - name: Setup Gradle
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
