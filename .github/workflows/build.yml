                  p.addView(
                          intensityLabel,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(29)
                          )
                  );

                  p.addView(
                          intensity,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(42)
                          )
                  );
              }

              private void addButton(
                      LinearLayout p,
                      String text,
                      View.OnClickListener click
