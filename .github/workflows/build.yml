              void beforeAfter() {

                  if (original == null)
                      return;

                  before = !before;

                  if (before) {

                      if (pending != null) {

                          handler.removeCallbacks(
                                  pending
                          );
                      }

                      preview.clearColorFilter();

                      preview.setImageBitmap(
                              original
                      );

                  } else {

                      render();
                  }
              }

              void schedule() {

                  if (
                          original == null
                          || before
                  )
                      return;

                  if (pending != null) {

                      handler.removeCallbacks(
                              pending
                      );
                  }

                  pending =
                          this::render;

                  handler.postDelayed(
                          pending,
                          70
                  );
              }

              void render() {

                  if (
                          original == null
                          || before
