name: Build RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/rcinstaedit/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#0B0B0F</color>
              <color name="white">#FFFFFF</color>
              <color name="gray">#A0A0AA</color>
              <color name="accent">#FF3158</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0B0F</item>
                  <item name="android:navigationBarColor">#0B0B0F</item>
                  <item name="android:colorAccent">#FF3158</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>

              <application
                  android:allowBackup="true"
                  android:label="RCINSTAEDIT"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/app/MainActivity.java <<'EOF'
          package com.rcinstaedit.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          import java.io.OutputStream;

          public class MainActivity extends Activity {

              LinearLayout root;
              ImageView imageView;
              VideoView videoView;
              Bitmap currentBitmap;

              int BG = Color.rgb(11,11,15);
              int CARD = Color.rgb(28,29,36);
              int ACCENT = Color.rgb(255,49,88);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              TextView text(String value, float size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  t.setPadding(24,18,24,18);
                  return t;
              }

              Button button(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(15);
                  b.setAllCaps(false);
                  b.setBackgroundColor(CARD);
                  return b;
              }

              void base(String title) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20,25,20,20);
                  root.setBackgroundColor(BG);

                  TextView titleView = text(title,26);
                  titleView.setGravity(Gravity.CENTER);
                  root.addView(titleView,
                      new LinearLayout.LayoutParams(-1,70));

                  setContentView(root);
              }

              void showHome() {
                  base("RCINSTAEDIT");

                  TextView sub = text(
                      "Professional Photo & Reel Editor",
                      16
                  );
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  Space space = new Space(this);
                  root.addView(space,
                      new LinearLayout.LayoutParams(1,25));

                  Button photo = button("📸  PHOTO EDITOR");
                  root.addView(photo,new LinearLayout.LayoutParams(-1,65));
                  photo.setOnClickListener(v -> pickPhoto());

                  Button video = button("🎬  VIDEO EDITOR");
                  root.addView(video,new LinearLayout.LayoutParams(-1,65));
                  video.setOnClickListener(v -> pickVideo());

                  Button effects = button("✨  EFFECTS");
                  root.addView(effects,new LinearLayout.LayoutParams(-1,65));
                  effects.setOnClickListener(v -> pickPhotoForEffects());

                  Button transitions = button("🔄  TRANSITIONS");
                  root.addView(transitions,new LinearLayout.LayoutParams(-1,65));
                  transitions.setOnClickListener(v -> showTransitions());

                  Button export = button("💾  HIGH QUALITY EXPORT");
                  root.addView(export,new LinearLayout.LayoutParams(-1,65));
                  export.setOnClickListener(v -> exportPhoto());

                  TextView version = text("RCINSTAEDIT  •  Version 2.0",13);
                  version.setGravity(Gravity.CENTER);
                  root.addView(version,
                      new LinearLayout.LayoutParams(-1,70));
              }

              void pickPhoto() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("image/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i,100);
              }

              void pickPhotoForEffects() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("image/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i,101);
              }

              void pickVideo() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("video/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i,200);
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

                  super.onActivityResult(requestCode,resultCode,data);

                  if(resultCode != RESULT_OK || data == null) return;

                  Uri uri = data.getData();

                  try {
                      if(requestCode == 100) {
                          currentBitmap =
                              MediaStore.Images.Media
                              .getBitmap(getContentResolver(),uri);
                          showPhotoEditor();
                      }

                      if(requestCode == 101) {
                          currentBitmap =
                              MediaStore.Images.Media
                              .getBitmap(getContentResolver(),uri);
                          showEffects();
                      }

                      if(requestCode == 200) {
                          showVideoEditor(uri);
                      }

                  } catch(Exception e) {
                      Toast.makeText(this,
                          "File open nahi ho payi",
                          Toast.LENGTH_SHORT).show();
                  }
              }

              void showPhotoEditor() {
                  base("Photo Editor");

                  imageView = new ImageView(this);
                  imageView.setImageBitmap(currentBitmap);
                  imageView.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  root.addView(imageView,
                      new LinearLayout.LayoutParams(
                          -1,0,1));

                  Button gray = button("⚫ Grayscale");
                  root.addView(gray,new LinearLayout.LayoutParams(-1,60));

                  gray.setOnClickListener(v -> {
                      if(currentBitmap == null) return;

                      Bitmap b = Bitmap.createBitmap(
                          currentBitmap.getWidth(),
                          currentBitmap.getHeight(),
                          Bitmap.Config.ARGB_8888);

                      for(int x=0;x<currentBitmap.getWidth();x++) {
                          for(int y=0;y<currentBitmap.getHeight();y++) {
                              int c=currentBitmap.getPixel(x,y);
                              int r=Color.red(c);
                              int g=Color.green(c);
                              int bl=Color.blue(c);
                              int avg=(r+g+bl)/3;
                              b.setPixel(x,y,
                                  Color.rgb(avg,avg,avg));
                          }
                      }

                      currentBitmap=b;
                      imageView.setImageBitmap(b);
                  });

                  Button bright = button("☀️ Brightness +");
                  root.addView(bright,new LinearLayout.LayoutParams(-1,60));

                  bright.setOnClickListener(v -> {
                      if(currentBitmap == null) return;

                      Bitmap b=Bitmap.createBitmap(
                          currentBitmap.getWidth(),
                          currentBitmap.getHeight(),
                          Bitmap.Config.ARGB_8888);

                      for(int x=0;x<currentBitmap.getWidth();x++) {
                          for(int y=0;y<currentBitmap.getHeight();y++) {
                              int c=currentBitmap.getPixel(x,y);

                              int r=Math.min(255,Color.red(c)+30);
                              int g=Math.min(255,Color.green(c)+30);
                              int bl=Math.min(255,Color.blue(c)+30);

                              b.setPixel(x,y,
                                  Color.rgb(r,g,bl));
                          }
                      }

                      currentBitmap=b;
                      imageView.setImageBitmap(b);
                  });

                  Button save=button("💾 SAVE PHOTO");
                  root.addView(save,new LinearLayout.LayoutParams(-1,65));
                  save.setOnClickListener(v -> exportPhoto());

                  Button back=button("← BACK");
                  root.addView(back,new LinearLayout.LayoutParams(-1,60));
                  back.setOnClickListener(v -> showHome());
              }

              void showEffects() {
                  base("Effects");

                  imageView=new ImageView(this);
                  imageView.setImageBitmap(currentBitmap);
                  imageView.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  root.addView(imageView,
                      new LinearLayout.LayoutParams(-1,0,1));

                  Button original=button("Original");
                  root.addView(original,new LinearLayout.LayoutParams(-1,60));
                  original.setOnClickListener(v -> {
                      imageView.setImageBitmap(currentBitmap);
                  });

                  Button bw=button("✨ Black & White");
                  root.addView(bw,new LinearLayout.LayoutParams(-1,60));
                  bw.setOnClickListener(v -> {
                      applyGray();
                  });

                  Button warm=button("🔥 Warm Effect");
                  root.addView(warm,new LinearLayout.LayoutParams(-1,60));
                  warm.setOnClickListener(v -> {
                      applyWarm();
                  });

                  Button save=button("💾 SAVE");
                  root.addView(save,new LinearLayout.LayoutParams(-1,65));
                  save.setOnClickListener(v -> exportPhoto());

                  Button back=button("← BACK");
                  root.addView(back,new LinearLayout.LayoutParams(-1,60));
                  back.setOnClickListener(v -> showHome());
              }

              void applyGray() {
                  if(currentBitmap==null) return;

                  Bitmap b=Bitmap.createBitmap(
                      currentBitmap.getWidth(),
                      currentBitmap.getHeight(),
                      Bitmap.Config.ARGB_8888);

                  for(int x=0;x<currentBitmap.getWidth();x++) {
                      for(int y=0;y<currentBitmap.getHeight();y++) {
                          int c=currentBitmap.getPixel(x,y);
                          int a=Color.alpha(c);
                          int avg=(Color.red(c)+Color.green(c)+Color.blue(c))/3;
                          b.setPixel(x,y,Color.argb(a,avg,avg,avg));
                      }
                  }

                  currentBitmap=b;
                  imageView.setImageBitmap(b);
              }

              void applyWarm() {
                  if(currentBitmap==null) return;

                  Bitmap b=Bitmap.createBitmap(
                      currentBitmap.getWidth(),
                      currentBitmap.getHeight(),
                      Bitmap.Config.ARGB_8888);

                  for(int x=0;x<currentBitmap.getWidth();x++) {
                      for(int y=0;y<currentBitmap.getHeight();y++) {
                          int c=currentBitmap.getPixel(x,y);

                          int r=Math.min(255,Color.red(c)+25);
                          int g=Math.min(255,Color.green(c)+10);
                          int bl=Math.max(0,Color.blue(c)-10);

                          b.setPixel(x,y,
                              Color.rgb(r,g,bl));
                      }
                  }

                  currentBitmap=b;
                  imageView.setImageBitmap(b);
              }

              void showVideoEditor(Uri uri) {
                  base("Video Editor");

                  videoView=new VideoView(this);
                  videoView.setVideoURI(uri);
                  videoView.setMediaController(
                      new MediaController(this));
                  videoView.requestFocus();

                  root.addView(videoView,
                      new LinearLayout.LayoutParams(
                          -1,0,1));

                  Button play=button("▶ PLAY VIDEO");
                  root.addView(play,new LinearLayout.LayoutParams(-1,65));

                  play.setOnClickListener(v -> {
                      videoView.start();
                  });

                  Button pause=button("⏸ PAUSE");
                  root.addView(pause,new LinearLayout.LayoutParams(-1,60));

                  pause.setOnClickListener(v -> {
                      videoView.pause();
                  });

                  Button back=button("← BACK");
                  root.addView(back,new LinearLayout.LayoutParams(-1,60));
                  back.setOnClickListener(v -> showHome());
              }

              void showTransitions() {
                  base("Transitions");

                  TextView info=text(
                      "Video Transition Studio",
                      20);
                  info.setGravity(Gravity.CENTER);
                  root.addView(info,
                      new LinearLayout.LayoutParams(-1,80));

                  Button fade=button("🌑 FADE");
                  root.addView(fade,new LinearLayout.LayoutParams(-1,65));

                  fade.setOnClickListener(v ->
                      Toast.makeText(this,
                      "Fade transition selected",
                      Toast.LENGTH_SHORT).show());

                  Button slide=button("➡️ SLIDE");
                  root.addView(slide,new LinearLayout.LayoutParams(-1,65));

                  slide.setOnClickListener(v ->
                      Toast.makeText(this,
                      "Slide transition selected",
                      Toast.LENGTH_SHORT).show());

                  Button zoom=button("🔍 ZOOM");
                  root.addView(zoom,new LinearLayout.LayoutParams(-1,65));

                  zoom.setOnClickListener(v ->
                      Toast.makeText(this,
                      "Zoom transition selected",
                      Toast.LENGTH_SHORT).show());

                  TextView note=text(
                      "Multi-clip transition engine next update mein add hoga.",
                      14);
                  note.setGravity(Gravity.CENTER);
                  root.addView(note);

                  Button back=button("← BACK");
                  root.addView(back,new LinearLayout.LayoutParams(-1,60));
                  back.setOnClickListener(v -> showHome());
              }

              void exportPhoto() {
                  if(currentBitmap==null) {
                      Toast.makeText(this,
                          "Pehle photo select karo",
                          Toast.LENGTH_SHORT).show();
                      return;
                  }

                  try {
                      String name =
                          "RCINSTAEDIT_" +
                          System.currentTimeMillis() +
                          ".jpg";

                      android.content.ContentValues values =
                          new android.content.ContentValues();

                      values.put(
                          MediaStore.Images.Media.DISPLAY_NAME,
                          name);

                      values.p
