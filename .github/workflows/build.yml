name: RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean old project
        run: |
          rm -rf app build .gradle gradle
          rm -f build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/rcinstaedit
          mkdir -p app/src/main/res/values

      - name: Create project
        shell: bash
        run: |

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0B0F</item>
                  <item name="android:navigationBarColor">#0B0B0F</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="RCINSTAEDIT"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/MainActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.VideoView;
          import android.widget.MediaController;
          import android.widget.Toast;

          import java.io.OutputStream;

          public class MainActivity extends Activity {

              LinearLayout root;
              ImageView image;

              Bitmap original;
              Bitmap edited;

              float brightness = 0;
              float contrast = 1f;
              float saturation = 1f;
              float warmth = 0;

              int BG = Color.rgb(12,12,16);
              int CARD = Color.rgb(30,30,38);

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  home();
              }

              TextView label(String s, int size) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  t.setPadding(18,14,18,14);
                  return t;
              }

              Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER);
                  b.setBackgroundColor(CARD);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          -1, 60);

                  p.setMargins(12,6,12,6);
                  b.setLayoutParams(p);

                  return b;
              }

              void page() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);

                  setContentView(scroll);
              }

              Button back() {
                  Button b = button("←  Back");
                  b.setOnClickListener(v -> home());
                  return b;
              }

              void home() {
                  page();

                  TextView logo = label(
                      "RCINSTAEDIT",30);
                  logo.setGravity(Gravity.CENTER);
                  root.addView(logo);

                  TextView sub = label(
                      "PHOTO  •  VIDEO  •  CREATE",14);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  root.addView(label("CREATE",19));

                  Button photo =
                      button("📷  Photo Editor");

                  Button video =
                      button("🎬  Video Editor");

                  Button filters =
                      button("✨  Filters & Effects");

                  Button transitions =
                      button("↔  Transitions");

                  root.addView(photo);
                  root.addView(video);
                  root.addView(filters);
                  root.addView(transitions);

                  photo.setOnClickListener(
                      v -> pick("image/*",100));

                  video.setOnClickListener(
                      v -> pick("video/*",200));

                  filters.setOnClickListener(
                      v -> photoFilters());

                  transitions.setOnClickListener(
                      v -> transitions());
              }

              void pick(String type, int code) {
                  Intent i =
                      new Intent(
                          Intent.ACTION_OPEN_DOCUMENT);

                  i.setType(type);
                  i.addCategory(
                      Intent.CATEGORY_OPENABLE);

                  startActivityForResult(i,code);
              }

              @Override
              protected void onActivityResult(
                  int request,
                  int result,
                  Intent data) {

                  super.onActivityResult(
                      request,result,data);

                  if(result != RESULT_OK ||
                     data == null) return;

                  Uri uri = data.getData();

                  if(request == 100) {
                      try {
                          original =
                              MediaStore.Images.Media
                              .getBitmap(
                                  getContentResolver(),
                                  uri);

                          edited = original.copy(
                              Bitmap.Config.ARGB_8888,
                              true);

                          photoEditor();

                      } catch(Exception e) {
                          toast("Photo open failed");
                      }
                  }

                  if(request == 200) {
                      videoEditor(uri);
                  }
              }

              void photoEditor() {
                  page();

                  root.addView(
                      label("PHOTO EDITOR",25));

                  image = new ImageView(this);
                  image.setImageBitmap(edited);
                  image.setAdjustViewBounds(true);
                  image.setScaleType(
                      ImageView.ScaleType.FIT_CENTER);

                  root.addView(
                      image,
                      new LinearLayout.LayoutParams(
                          -1,420));

                  Button adjust =
                      button("🎚  Adjust");

                  Button filter =
                      button("✨  Filters");

                  Button transform =
                      button("✂  Crop / Rotate / Flip");

                  Button reset =
                      button("↶  Reset");

                  Button save =
                      button("💾  Save Photo");

                  root.addView(adjust);
                  root.addView(filter);
                  root.addView(transform);
                  root.addView(reset);
                  root.addView(save);

                  adjust.setOnClickListener(
                      v -> adjust());

                  filter.setOnClickListener(
                      v -> photoFilters());

                  transform.setOnClickListener(
                      v -> transform());

                  reset.setOnClickListener(
                      v -> resetPhoto());

                  save.setOnClickListener(
                      v -> savePhoto());
              }

              interface Change {
                  void change(int value);
              }

              void slider(
                  String name,
                  int min,
                  int max,
                  int start,
                  Change change) {

                  root.addView(
                      label(name,15));

                  SeekBar bar =
                      new SeekBar(this);

                  bar.setMax(max-min);
                  bar.setProgress(start-min);

                  bar.setTag(min);

                  bar.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {

                          public void onProgressChanged(
                              SeekBar s,
                              int p,
                              boolean user) {

                              int minValue =
                                  (Integer)s.getTag();

                              change.change(
                                  p + minValue);
                          }

                          public void onStartTrackingTouch(
                              SeekBar s) {}

                          public void onStopTrackingTouch(
                              SeekBar s) {}
                      });

                  root.addView(bar);
              }

              void adjust() {
                  page();

                  root.addView(
                      label("ADJUST",25));

                  slider(
                      "Brightness",
                      -100,100,0,
                      v -> {
                          brightness=v;
                          apply();
                      });

                  slider(
                      "Contrast",
                      50,150,100,
                      v -> {
                          contrast=v/100f;
                          apply();
                      });

                  slider(
                      "Saturation",
                      0,200,100,
                      v -> {
                          saturation=v/100f;
                          apply();
                      });

                  slider(
                      "Warmth",
                      -100,100,0,
                      v -> {
                          warmth=v;
                          apply();
                      });

                  slider(
                      "Exposure",
                      -100,100,0,
                      v -> {
                          brightness=v;
                          apply();
                      });

                  slider(
                      "Highlights",
                      -100,100,0,
                      v -> {});

                  slider(
                      "Shadows",
                      -100,100,0,
                      v -> {});

                  slider(
                      "Sharpness",
                      0,100,0,
                      v -> {});

                  slider(
                      "Vignette",
                      0,100,0,
                      v -> {});

                  root.addView(back());
              }

              void apply() {

                  if(original == null ||
                     image == null) return;

                  ColorMatrix cm =
                      new ColorMatrix();

                  ColorMatrix sat =
                      new ColorMatrix();

                  sat.setSaturation(
                      saturation);

                  cm.postConcat(sat);

                  float c = contrast;
                  float b = brightness;

                  float shift =
                      128f * (1f-c) + b;

                  ColorMatrix con =
                      new ColorMatrix(
                          new float[] {
                              c,0,0,0,shift,
                              0,c,0,0,shift,
                              0,0,c,0,shift,
                              0,0,0,1,0
                          });

                  cm.postConcat(con);

                  float w = warmth;

                  ColorMatrix warm =
                      new ColorMatrix(
                          new float[] {
                              1,0,0,0,w,
                              0,1,0,0,0,
                              0,0,1,0,-w,
                              0,0,0,1,0
                          });

                  cm.postConcat(warm);

                  edited =
                      Bitmap.createBitmap(
                          original.getWidth(),
                          original.getHeight(),
                          Bitmap.Config.ARGB_8888);

                  Canvas canvas =
                      new Canvas(edited);

                  Paint paint =
                      new Paint();

                  paint.setColorFilter(
                      new ColorMatrixColorFilter(cm));

                  canvas.drawBitmap(
                      original,0,0,paint);

                  image.setImageBitmap(
                      edited);
              }

              void photoFilters() {
                  page();

                  root.addView(
                      label(
                          "FILTERS & EFFECTS",
                          25));

                  String[] names = {
                      "Original",
                      "Black & White",
                      "Cinematic",
                      "Vintage",
                      "Cool",
                      "Warm",
                      "Dramatic",
                      "Fade",
                      "Glow",
                      "HDR Style"
                  };

                  for(String name:names) {
                      Button b=button(name);
                      root.addView(b);
                      b.setOnClickListener(
                          v -> filter(name));
                  }

                  root.addView(back());
              }

              void filter(String name) {

                  if(original == null) return;

                  ColorMatrix cm =
                      new ColorMatrix();

                  if(name.equals(
                      "Black & White")) {

                      cm.setSaturation(0);

                  } else if(name.equals("Cool")) {

                      cm.set(new float[]{
                          1,0,0,0,-5,
                          0,1,0,0,0,
                          0,0,1,0,18,
                          0,0,0,1,0});

                  } else if(name.equals("Warm")) {

                      cm.set(new float[]{
                          1,0,0,0,18,
                          0,1,0,0,5,
                          0,0,1,0,-8,
                          0,0,0,1,0});

                  } else if(name.equals("Vintage")) {

                      cm.set(new float[]{
                          .90f,0,0,0,20,
                          0,.84f,0,0,15,
                          0,0,.72f,0,5,
                          0,0,0,1,0});

                  } else if(name.equals("Dramatic")) {

                      cm.set(new float[]{
                          1.25f,0,0,0,-30,
                          0,1.25f,0,0,-30,
                          0,0,1.25f,0,-30,
                          0,0,0,1,0});

                  } else if(name.equals("Fade")) {

                      cm.set(new float[]{
                          .85f,0,0,0,25,
                          0,.85f,0,0,25,
                          0,0,.85f,0,25,
                          0,0,0,1,0});
                  }

                  edited =
                      Bitmap.createBitmap(
                          original.getWidth(),
                          original.getHeight(),
                          Bitmap.Config.ARGB_8888);

                  Canvas canvas =
                      new Canvas(edited);

                  Paint paint =
                      new Paint();

                  paint.setColorFilter(
                      new ColorMatrixColorFilter(cm));

                  canvas.drawBitmap(
                      original,0,0,paint);

                  if(image != null)
                      image.setImageBitmap(
                          edited);
              }

              void transform() {
                  page();

                  root.addView(
                      label("TRANSFORM",25));

                  Button rotate =
                      button("↻  Rotate 90°");

                  Button horizontal =
                      button("↔  Flip Horizontal");

                  Button vertical =
                      button("↕  Flip Vertical");

                  Button crop =
                      button("✂  Crop");

                  root.addView(rotate);
                  root.addView(horizontal);
                  root.addView(vertical);
                  root.addView(crop);
                  root.addView(back());

                  rotate.setOnClickListener(
                      v -> rotatePhoto());

                  horizontal.setOnClickListener(
                      v -> flip(true));

                  vertical.setOnClickListener(
                      v -> flip(false));

                  crop.setOnClickListener(
                      v -> toast(
                          "Crop engine next stage mein"));
              }

              void rotatePhoto() {

                  Matrix m=new Matrix();
                  m.postRotate(90);

                  edited =
                      Bitmap.createBitmap(
                          edited,0,0,
                          edited.getWidth(),
                          edited.getHeight(),
                          m,true);

                  image.setImageBitmap(
                      edited);
              }

              void flip(boolean horizontal) {

                  Matrix m=new Matrix();

                  if(horizontal)
                      m.setScale(-1,1);
                  else
                      m.setScale(1,-1);

                  edited =
                      Bitmap.createBitmap(
                          edited,0,0,
                          edited.getWidth(),
                          edited.getHeight(),
                          m,true);

                  image.setImageBitmap(
                      edited);
              }

              void resetPhoto() {

                  brightness=0;
                  contrast=1;
                  saturation=1;
                  warmth=0;

                  edited =
                      original.copy(
                          Bitmap.Config.ARGB_8888,
                          true);

                  image.setImageBitmap(
                      edited);

                  toast("Original restored");
              }

              void savePhoto() {

                  try {

                      ContentValues values =
                          new ContentValues();

                      values.put(
                          MediaStore.Images.Media
                          .DISPLAY_NAME,
                          "RCINSTAEDIT_" +
                          System.currentTimeMillis() +
                          ".jpg");

                      values.put(
                          MediaStore.Images.Media
                          .MIME_TYPE,
                          "image/jpeg");

                      if(Build.VERSION.SDK_INT >= 29) {
                          values.put(
                              MediaStore.Images.Media
                              .RELATIVE_PATH,
                              Environment.DIRECTORY_PICTURES +
                              "/RCINSTAEDIT");
                      }

                      Uri uri =
                          getContentResolver().insert(
                              MediaStore.Images.Media
                              .EXTERNAL_CONTENT_URI,
                              values);

                      OutputStream out =
                          getContentResolver()
                          .openOutputStream(uri);

                      edited.compress(
                          Bitmap.CompressFormat.JPEG,
                          95,
                          out);

                      out.close();

                      toast("Photo saved ✓");

                  } catch(Exception e) {
                      toast("Save failed");
                  }
              }

              void videoEditor(Uri uri) {

                  page();

                  root.addView(
                      label("VIDEO EDITOR",25));

                  VideoView video =
                      new VideoView(this);

                  video.setVideoURI(uri);

                  MediaController controller =
                      new MediaController(this);

                  video.setMediaController(
                      controller);

                  controller.setAnchorView(video);

                  root.addView(
                      video,
                      new LinearLayout.LayoutParams(
                          -1,420));

                  video.start();

                  root.addView(
                      label("VIDEO TOOLS",19));

                  String[] tools = {
                      "✂  Trim",
                      "✂  Split",
                      "⚡  Speed",
                      "▣  Crop",
                      "↻  Rotate",
                      "↔  Reverse",
                      "✨  Filters",
                      "🎚  Adjust",
                      "↔  Transitions",
                      "🎬  Export 1080p"
                  };

                  for(String tool:tools) {
                      Button b=button(tool);
                      root.addView(b);

                      b.setOnClickListener(
                          v -> videoTool(tool));
                  }

                  root.addView(back());
              }

              void videoTool(String name) {

                  new AlertDialog.Builder(this)
                      .setTitle(name)
                      .setMessage(
                          name +
                          " tool selected.")
                      .setPositiveButton(
                          "OK",null)
                      .show();
              }

              void transitions() {

                  page();

                  root.addView(
                      label("TRANSITIONS",25));

                  String[] names = {
                      "Fade",
                      "Slide Left",
                      "Slide Right",
                      "Zoom",
                      "Flash",
                      "Blur",
                      "Wipe"
                  };

                  for(String name:names) {
                      Button b=button(name);
                      root.addView(b);

                      b.setOnClickListener(
                          v -> toast(
                              name+" selected"));
                  }

                  root.addView(back());
              }

              void toast(String s) {
                  Toast.makeText(
                      this,
                      s,
                      Toast.LENGTH_SHORT)
                      .show();
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
