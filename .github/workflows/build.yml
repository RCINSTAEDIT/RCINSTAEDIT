              void rotate(){

                  if(original==null)return;

                  pushUndo();

                  Matrix m=new Matrix();
                  m.postRotate(90);

                  Bitmap old=original;

                  original=
                      Bitmap.createBitmap(
                          old,
                          0,0,
                          old.getWidth(),
                          old.getHeight(),
                          m,true
                      );

                  if(old!=original &&
                     !old.isRecycled())
                      old.recycle();

                  render();
              }

              void flip(){

                  if(original==null)return;

                  pushUndo();

                  Matrix m=new Matrix();
                  m.postScale(-1,1);

                  Bitmap old=original;

                  original=
                      Bitmap.createBitmap(
                          old,
                          0,0,
                          old.getWidth(),
                          old.getHeight(),
                          m,true
                      );

                  if(old!=original &&
                     !old.isRecycled())
                      old.recycle();

                  render();
              }

              void crop(){

                  if(original==null)return;

                  pushUndo();

                  int w=original.getWidth();
                  int h=original.getHeight();

                  int side=Math.min(w,h);

                  Bitmap old=original;

                  original=
                      Bitmap.createBitmap(
                          old,
                          (w-side)/2,
                          (h-side)/2,
                          side,
                          side
                      );

                  if(old!=original &&
                     !old.isRecycled())
                      old.recycle();

                  render();
              }

