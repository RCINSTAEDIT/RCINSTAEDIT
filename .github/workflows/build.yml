                          new SliderCallback() {
                              @Override
                              public void onChanged(int value) {
                                  highlights = value;
                                  updatePreview();
                              }
                          }
                  );

                  addSlider(
                          controls,
                          "Shadows",
                          -100,
                          100,
                          shadows,
                          new SliderCallback() {
                              @Override
                              public void onChanged(int value) {
                                  shadows = value;
                                  updatePreview();
                              }
                          }
                  );

                  addSlider(
                          controls,
                          "Black Point",
                          -100,
                          100,
                          blackPoint,
                          new SliderCallback() {
                              @Override
                              public void onChanged(int value) {
                                  blackPoint = value;
                                  updatePreview();
                              }
                          }
                  );

                  addSection(
                          controls,
                          "COLOR"
                  );

                  addSlider(
                          controls,
                          "Saturation",
                          -100,
                          100,
                          saturation,
                          new SliderCallback() {
                              @Override
                              public void onChanged(int value) {
