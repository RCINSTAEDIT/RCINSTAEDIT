                              0,1,0,0,0,
                              0,0,1,0,-warm+tint,
                              0,0,0,1,0
                          }
                      )
                  );

                  float shadow =
                      vals[5]/250f;

                  float black =
                      vals[6]/300f;

                  if(
                      vals[5]!=0 ||
