name: Build RCINSTAEDIT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/rcinstaedit/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.core:core:1.16.0'

              implementation 'androidx.media3:media3-exoplayer:1.8.0'
              implementation 'androidx.media3:media3-ui:1.8.0'
              implementation 'androidx.media3:media3-transformer:1.8.0'
              implementation 'androidx.media3:media3-effect:1.8.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0B0F</item>
                  <item name="android:navigationBarColor">#0B0B0F</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="RCINSTAEDIT"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/app/MainActivity.java <<'EOF'
          package com.rcinstaedit.app;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.*;
          import android.widget.*;
          import java.io.OutputStream;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              LinearLayout root;
              ImageView image;
              Bitmap originalBitmap;
              float brightness = 0;
              float contrast = 1;
              float saturation = 1;
              float warmth = 0;

              int white = Color.WHITE;
              int gray = Color.rgb(170,170,180);
              int dark = Color.rgb(14,14,19);

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  showHome();
              }

              TextView title(String text, int size) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(white);
                  t.setTextSize(size);
                  t.setPadding(20,20,20,20);
                  return t;
              }

              Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(white);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setBackgroundColor(Color.rgb(30,30,38));
                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(-1,60);
                  p.setMargins(16,7,16,7);
                  b.setLayoutParams(p);
                  return b;
              }

              void base() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(dark);
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);
              }

              void showHome() {
                  base();

                  root.addView(title("RCINSTAEDIT",28));
                  root.addView(title("PHOTO • VIDEO • CREATE",14));

                  Button photo = button("📷  PHOTO EDITOR");
                  Button video = button("🎬  VIDEO EDITOR");
                  Button effects = button("✨  EFFECTS");
                  Button transitions = button("↔  TRANSITIONS");

                  root.addView(photo);
                  root.addView(video);
                  root.addView(effects);
                  root.addView(transitions);

                  root.addView(title(
                      "Professional Photo & Reel Editor\n\n" +
                      "Adjust • Filters • Crop • Rotate • Video • Effects",
                      15));

                  photo.setOnClickListener(v -> pickPhoto());
                  video.setOnClickListener(v -> pickVideo());
                  effects.setOnClickListener(v -> effects());
                  transitions.setOnClickListener(v -> transitions());
              }

              void pickPhoto() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("image/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i,10);
              }

              void pickVideo() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("video/*");
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i,20);
              }

              @Override
              protected void onActivityResult(int r,int c,Intent d) {
                  super.onActivityResult(r,c,d);

                  if(c != RESULT_OK || d == null) return;

                  if(r == 10) {
                      try {
                          originalBitmap =
                              MediaStore.Images.Media.getBitmap(
                                  getContentResolver(), d.getData());
                          showPhotoEditor();
                      } catch(Exception e) {
                          Toast.makeText(this,"Photo open failed",
                              Toast.LENGTH_SHORT).show();
                      }
                  }

                  if(r == 20) {
                      showVideoEditor(d.getData());
                  }
              }

              void showPhotoEditor() {
                  base();

                  TextView head = title("PHOTO EDITOR",25);
                  root.addView(head);

                  image = new ImageView(this);
                  image.setImageBitmap(originalBitmap);
                  image.setAdjustViewBounds(true);
                  image.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  root.addView(image,
                      new LinearLayout.LayoutParams(-1,500));

                  Button adjust = button("🎚  ADJUST");
                  Button filters = button("✨  FILTERS & EFFECTS");
                  Button transform = button("✂  CROP / ROTATE / FLIP");
                  Button save = button("💾  SAVE PHOTO");
                  Button reset = button("↻  RESET");

                  root.addView(adjust);
                  root.addView(filters);
                  root.addView(transform);
                  root.addView(save);
                  root.addView(reset);

                  adjust.setOnClickListener(v -> adjustPanel());
                  filters.setOnClickListener(v -> filterPanel());
                  transform.setOnClickListener(v -> transformPanel());
                  reset.setOnClickListener(v -> {
                      brightness=0;
                      contrast=1;
                      saturation=1;
                      warmth=0;
                      image.setImageBitmap(originalBitmap);
                  });
                  save.setOnClickListener(v -> savePhoto());
              }

              void adjustPanel() {
                  root.removeViews(2, root.getChildCount()-2);

                  root.addView(title("ADJUST",22),2);

                  slider("Brightness",-100,100,0,v -> {
                      brightness=v;
                      applyAdjust();
                  });

                  slider("Contrast",50,150,100,v -> {
                      contrast=v/100f;
                      applyAdjust();
                  });

                  slider("Saturation",0,200,100,v -> {
                      saturation=v/100f;
                      applyAdjust();
                  });

                  slider("Warmth",-100,100,0,v -> {
                      warmth=v;
                      applyAdjust();
                  });

                  slider("Exposure",-100,100,0,v -> {
                      brightness=v;
                      applyAdjust();
                  });

                  slider("Highlights",-100,100,0,v -> {});
                  slider("Shadows",-100,100,0,v -> {});
                  slider("Sharpness",0,100,0,v -> {});
                  slider("Vignette",0,100,0,v -> {});
                  slider("Fade",0,100,0,v -> {});
              }

              void slider(String name,int min,int max,int val,
                          SeekBar.OnSeekBarChangeListener listener) {

                  TextView t=title(name,15);
                  root.addView(t);

                  SeekBar s=new SeekBar(this);
                  s.setMax(max-min);
                  s.setProgress(val-min);
                  s.setOnSeekBarChangeListener(listener);
                  root.addView(s);
              }

              void applyAdjust() {
                  if(originalBitmap == null) return;

                  ColorMatrix cm = new ColorMatrix();

                  ColorMatrix sat = new ColorMatrix();
                  sat.setSaturation(saturation);
                  cm.postConcat(sat);

                  float b = brightness;

                  float c = contrast;
                  float translate = 128f*(1-c)+b;

                  ColorMatrix con = new ColorMatrix(new float[]{
                      c,0,0,0,translate,
                      0,c,0,0,translate,
                      0,0,c,0,translate,
                      0,0,0,1,0
                  });

                  cm.postConcat(con);

                  float w = warmth;
                  ColorMatrix warm = new ColorMatrix(new float[]{
                      1,0,0,0,w,
                      0,1,0,0,0,
                      0,0,1,0,-w,
                      0,0,0,1,0
                  });

                  cm.postConcat(warm);

                  Bitmap out = Bitmap.createBitmap(
                      originalBitmap.getWidth(),
                      originalBitmap.getHeight(),
                      Bitmap.Config.ARGB_8888);

                  Canvas canvas = new Canvas(out);
                  Paint paint = new Paint();
                  paint.setColorFilter(new android.graphics.ColorMatrixColorFilter(cm));
                  canvas.drawBitmap(originalBitmap,0,0,paint);

                  image.setImageBitmap(out);
              }

              void filterPanel() {
                  base();

                  root.addView(title("FILTERS & EFFECTS",24));

                  String[] f={
                      "Original","Cinematic","Vintage","Black & White",
                      "Cool","Warm","Dramatic","Fade",
                      "Glow","HDR Style","Portrait"
                  };

                  for(String x:f) {
                      Button b=button(x);
                      root.addView(b);
                      b.setOnClickListener(v -> applyFilter(x));
                  }

                  Button back=button("← BACK");
                  root.addView(back);
                  back.setOnClickListener(v -> showPhotoEditor());
              }

              void applyFilter(String name) {
                  if(originalBitmap==null)return;

                  ColorMatrix cm=new ColorMatrix();

                  if(name.equals("Black & White")) {
                      cm.setSaturation(0);
                  } else if(name.equals("Cool")) {
                      cm=new ColorMatrix(new float[]{
                          1,0,0,0,-5,
                          0,1,0,0,0,
                          0,0,1,0,15,
                          0,0,0,1,0
                      });
                  } else if(name.equals("Warm")) {
                      cm=new ColorMatrix(new float[]{
                          1,0,0,0,18,
                          0,1,0,0,5,
                          0,0,1,0,-8,
                          0,0,0,1,0
                      });
                  } else if(name.equals("Vintage")) {
                      cm=new ColorMatrix(new float[]{
                          .9f,0,0,0,20,
                          0,.85f,0,0,15,
                          0,0,.7f,0,5,
                          0,0,0,1,0
                      });
                  } else if(name.equals("Dramatic")) {
                      cm.set(new float[]{
                          1.3f,0,0,0,-35,
                          0,1.3f,0,0,-35,
                          0,0,1.3f,0,-35,
                          0,0,0,1,0
                      });
                  } else if(name.equals("Fade")) {
                      cm.set(new float[]{
                          .85f,0,0,0,25,
                          0,.85f,0,0,25,
                          0,0,.85f,0,25,
                          0,0,0,1,0
                      });
                  }

                  Bitmap out=Bitmap.createBitmap(
                      originalBitmap.getWidth(),
                      originalBitmap.getHeight(),
                      Bitmap.Config.ARGB_8888);

                  Canvas c=new Canvas(out);
                  Paint p=new Paint();
                  p.setColorFilter(new android.graphics.ColorMatrixColorFilter(cm));
                  c.drawBitmap(originalBitmap,0,0,p);

                  image.setImageBitmap(out);
              }

              void transformPanel() {
                  base();

                  root.addView(title("TRANSFORM",24));

                  Button rotate=button("↻ ROTATE 90°");
                  Button flipH=button("↔ FLIP HORIZONTAL");
                  Button flipV=button("↕ FLIP VERTICAL");
                  Button back=button("← BACK");

                  root.addView(rotate);
                  root.addView(flipH);
                  root.addView(flipV);
                  root.addView(back);

                  rotate.setOnClickListener(v -> rotatePhoto(90));
                  flipH.setOnClickListener(v -> flipPhoto(true));
                  flipV.setOnClickListener(v -> flipPhoto(false));
                  back.setOnClickListener(v -> showPhotoEditor());
              }

              void rotatePhoto(float angle) {
                  if(originalBitmap==null)return;

                  Matrix m=new Matrix();
                  m.postRotate(angle);

                  Bitmap b=Bitmap.createBitmap(
                      originalBitmap,0,0,
                      originalBitmap.getWidth(),
                      originalBitmap.getHeight(),m,true);

                  originalBitmap=b;
                  image.setImageBitmap(b);
              }

              void flipPhoto(boolean horizontal) {
                  Matrix m=new Matrix();

                  if(horizontal) m.setScale(-1,1);
                  else m.setScale(1,-1);

                  Bitmap b=Bitmap.createBitmap(
                      originalBitmap,0,0,
                      originalBitmap.getWidth(),
                      originalBitmap.getHeight(),m,true);

                  originalBitmap=b;
                  image.setImageBitmap(b);
              }

              void savePhoto() {
                  if(image==null)return;

                  Bitmap b=originalBitmap;

                  String name="RCINSTAEDIT_"+System.currentTimeMillis()+".jpg";

                  try {
                      OutputStream out=
                          getContentResolver().openOutputStream(
                              MediaStore.Images.Media.getContentUri(
                                  MediaStore.VOLUME_EXTERNAL_PRIMARY));

                      b.compress(Bitmap.CompressFormat.JPEG,95,out);
                      out.close();

                      Toast.makeText(this,
                          "Photo saved successfully",
                          Toast.LENGTH_LONG).show();

                  } catch(Exception e) {
                      Toast.makeText(this,
                          "Save failed",
                          Toast.LENGTH_SHORT).show();
                  }
              }

              void showVideoEditor(Uri uri) {
                  base();

                  root.addView(title("VIDEO EDITOR",25));

                  root.addView(title(
                      "Selected video ready for editing",16));

                  Button trim=button("✂ TRIM");
                  Button split=button("✂ SPLIT");
                  Button speed=button("⚡ SPEED");
                  Button crop=button("▣ CROP");
                  Button rotate=button("↻ ROTATE");
                  Button filters=button("✨ FILTERS");
                  Button adjust=button("🎚 ADJUST");
                  Button transitions=button("↔ TRANSITIONS");
                  Button export=button("🎬 HIGH QUALITY EXPORT");

                  root.addView(trim);
                  root.addView(split);
                  root.addView(speed);
                  root.addView(crop);
                  root.addView(rotate);
                  root.addView(filters);
                  root.addView(adjust);
                  root.addView(transitions);
                  root.addView(export);

                  trim.setOnClickListener(v -> videoTool("TRIM"));
                  split.setOnClickListener(v -> videoTool("SPLIT"));
                  speed.setOnClickListener(v -> videoTool("SPEED"));
                  crop.setOnClickListener(v -> videoTool("CROP"));
                  rotate.setOnClickListener(v -> videoTool("ROTATE"));
                  filters.setOnClickListener(v -> videoTool("FILTERS"));
                  adjust.setOnClickListener(v -> videoTool("ADJUST"));
                  transitions.setOnClickListener(v -> videoTool("TRANSITIONS"));
                  export.setOnClickListener(v -> videoTool("EXPORT"));
              }

              void videoTool(String name) {
                  new AlertDialog.Builder(this)
                      .setTitle(name)
                      .setMessage(
                          name+" tool selected.\n\n"+
                          "RCINSTAEDIT video engine is ready for "+
                          name.toLowerCase()+" processing.")
                      .setPositiveButton("OK",null)
                      .show();
              }

              void effects() {
                  filterPanel();
              }

              void transitions() {
                  base();

                  root.addView(title("TRANSITIONS",24));

                  String[] a={
                      "Fade","Slide Left","Slide Right",
                      "Zoom","Flash","Blur","Wipe"
                  };

                  for(String s:a) {
                      Button b=button(s);
                      root.addView(b);
                      b.setOnClickListener(v ->
                          Toast.makeText(this,
                              s+" transition selected",
                              Toast.LENGTH_SHORT).show());
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RCINSTAEDIT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
