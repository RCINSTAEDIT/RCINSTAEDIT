name: RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf app build .gradle gradle
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/rcinstaedit
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "5.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#0E0F14</item>
                  <item name="android:navigationBarColor">#0E0F14</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:colorAccent">#7C4DFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="RCINSTAEDIT"
                  android:theme="@style/AppTheme"
                  android:enableOnBackInvokedCallback="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/MainActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.content.ContentValues;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.window.OnBackInvokedCallback;
          import android.window.OnBackInvokedDispatcher;

          import java.io.OutputStream;
          import java.util.ArrayDeque;

          public class MainActivity extends Activity {

              private static final int PICK_IMAGE = 1001;
              private static final int PICK_AUDIO = 1002;

              private final ArrayDeque<String> screenStack =
                      new ArrayDeque<>();

              private String currentScreen = "home";

              private Bitmap originalBitmap;
              private Bitmap editedBitmap;

              private ImageView previewImage;
              private VignetteView vignetteView;

              private float zoom = 1f;
              private float dragX = 0f;
              private float dragY = 0f;
              private float lastX;
              private float lastY;

              private boolean beforePressed = false;

              private String selectedFilter = "Original";
              private int filterIntensity = 100;

              private int brightness = 0;
              private int exposure = 0;
              private int brilliance = 0;
              private int contrast = 0;
              private int highlights = 0;
              private int shadows = 0;
              private int blackPoint = 0;
              private int saturation = 0;
              private int vibrance = 0;
              private int warmth = 0;
              private int tint = 0;
              private int sharpness = 0;
              private int definition = 0;
              private int noiseReduction = 0;
              private int fade = 0;
              private int vignette = 0;
              private int hue = 0;

              interface SliderCallback {
                  void onChanged(int value);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  window.setStatusBarColor(
                          Color.rgb(14, 15, 20)
                  );

                  window.setNavigationBarColor(
                          Color.rgb(14, 15, 20)
                  );

                  if (Build.VERSION.SDK_INT >= 33) {

                      getOnBackInvokedDispatcher()
                              .registerOnBackInvokedCallback(
                                      OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                                      new OnBackInvokedCallback() {
                                          @Override
                                          public void onBackInvoked() {
                                              goBack();
                                          }
                                      }
                              );
                  }

                  renderScreen();
              }

              @Override
              public void onBackPressed() {

                  if (Build.VERSION.SDK_INT < 33) {
                      goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private void goBack() {

                  if (!screenStack.isEmpty()) {

                      currentScreen =
                              screenStack.pop();

                      renderScreen();

                  } else {

                      finish();
                  }
              }

              private void openScreen(String screen) {

                  screenStack.push(
                          currentScreen
                  );

                  currentScreen = screen;

                  renderScreen();
              }

              private void renderScreen() {

                  if ("home".equals(currentScreen)) {

                      showHome();

                  } else if ("photo".equals(currentScreen)) {

                      showPhotoEditor();

                  } else if ("adjust".equals(currentScreen)) {

                      showAdjust();

                  } else if ("filters".equals(currentScreen)) {

                      showFilters();
                  }
              }

              private void showHome() {

                  LinearLayout root =
                          baseColumn();

                  TextView logo =
                          text(
                                  "RCINSTAEDIT",
                                  30,
                                  Color.WHITE
                          );

                  logo.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(
                          logo,
                          lp(-1, 70)
                  );

                  TextView sub =
                          text(
                                  "Photo & Reel Editor",
                                  16,
                                  Color.LTGRAY
                          );

                  sub.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(
                          sub,
                          lp(-1, 45)
                  );

                  addSpace(
                          root,
                          20
                  );

                  addTool(
                          root,
                          "📷  PHOTO EDITOR",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  openScreen("photo");
                              }
                          }
                  );

                  addTool(
                          root,
                          "🎬  VIDEO EDITOR",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  toast(
                                          "Video editor next stage mein"
                                  );
                              }
                          }
                  );

                  addTool(
                          root,
                          "🎵  ADD AUDIO FROM PHONE",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  pickAudio();
                              }
                          }
                  );

                  addTool(
                          root,
                          "✨  HIGH QUALITY EXPORT",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  toast(
                                          "Photo Editor → Save Photo"
                                  );
                              }
                          }
                  );

                  setContentViewWithInsets(root);
              }

              private void showPhotoEditor() {

                  LinearLayout root =
                          baseColumn();

                  root.addView(
                          topBar("Photo Editor")
                  );

                  FrameLayout previewBox =
                          new FrameLayout(this);

                  previewBox.setBackgroundColor(
                          Color.BLACK
                  );

                  previewImage =
                          new ImageView(this);

                  previewImage.setScaleType(
                          ImageView.ScaleType.FIT_CENTER
                  );

                  previewImage.setBackgroundColor(
                          Color.BLACK
                  );

                  previewBox.addView(
                          previewImage,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );

                  vignetteView =
                          new VignetteView(this);

                  vignetteView.setStrength(
                          vignette
                  );

                  previewBox.addView(
                          vignetteView,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1
                          )
                  );

                  root.addView(
                          previewBox,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(285)
                          )
                  );

                  setupPreviewTouch();

                  TextView photoButton;

                  if (originalBitmap == null) {

                      photoButton =
                              makeButton(
                                      "📷  CHOOSE PHOTO"
                              );

                  } else {

                      photoButton =
                              makeButton(
                                      "🔄  CHANGE PHOTO"
                              );
                  }

                  photoButton.setOnClickListener(
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  pickImage();
                              }
                          }
                  );

                  root.addView(
                          photoButton
                  );

                  LinearLayout quick =
                          new LinearLayout(this);

                  quick.setGravity(
                          Gravity.CENTER
                  );

                  addSmallButton(
                          quick,
                          "FIT",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {

                                  zoom = 1f;
                                  dragX = 0f;
                                  dragY = 0f;

                                  updatePreview();
                              }
                          }
                  );

                  addSmallButton(
                          quick,
                          "1:1",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {

                                  zoom = 2f;

                                  updatePreview();
                              }
                          }
                  );

                  TextView before =
                          makeButton(
                                  "HOLD: BEFORE"
                          );

                  before.setTextSize(13);

                  before.setOnTouchListener(
                          new View.OnTouchListener() {

                              @Override
                              public boolean onTouch(
                                      View v,
                                      MotionEvent e
                              ) {

                                  if (e.getAction() ==
                                          MotionEvent.ACTION_DOWN) {

                                      beforePressed =
                                              true;

                                      showBefore();

                                      return true;
                                  }

                                  if (e.getAction() ==
                                          MotionEvent.ACTION_UP ||
                                          e.getAction() ==
                                                  MotionEvent.ACTION_CANCEL) {

                                      beforePressed =
                                              false;

                                      updatePreview();

                                      return true;
                                  }

                                  return true;
                              }
                          }
                  );

                  quick.addView(
                          before,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(48),
                                  1
                          )
                  );

                  root.addView(
                          quick,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(58)
                          )
                  );

                  ScrollView scroll =
                          new ScrollView(this);

                  LinearLayout tools =
                          new LinearLayout(this);

                  tools.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  tools.setPadding(
                          dp(12),
                          dp(4),
                          dp(12),
                          dp(25)
                  );

                  addTool(
                          tools,
                          "🎚  ADJUST",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {

                                  if (hasPhoto()) {
                                      openScreen("adjust");
                                  }
                              }
                          }
                  );

                  addTool(
                          tools,
                          "🎨  FILTERS",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {

                                  if (hasPhoto()) {
                                      openScreen("filters");
                                  }
                              }
                          }
                  );

                  addTool(
                          tools,
                          "↪  ROTATE 90°",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  rotate90();
                              }
                          }
                  );

                  addTool(
                          tools,
                          "↔  FLIP HORIZONTAL",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  flipHorizontal();
                              }
                          }
                  );

                  addTool(
                          tools,
                          "↕  FLIP VERTICAL",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  flipVertical();
                              }
                          }
                  );

                  addTool(
                          tools,
                          "✂  CENTER CROP",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  centerCrop();
                              }
                          }
                  );

                  addTool(
                          tools,
                          "↺  RESET",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  resetPhoto();
                              }
                          }
                  );

                  addTool(
                          tools,
                          "💾  SAVE PHOTO",
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  savePhoto();
                              }
                          }
                  );

                  scroll.addView(
                          tools
                  );

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  updatePreview();

                  setContentViewWithInsets(
                          root
                  );
              }

              private void showAdjust() {

