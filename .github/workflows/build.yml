name: RCINSTAEDIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/rcinstaedit
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RCINSTAEDIT"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rcinstaedit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.rcinstaedit'
                  minSdk 23
                  targetSdk 35
                  versionCode 8
                  versionName '1.0.8'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">RCINSTAEDIT</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#08080D</item>
                  <item name="android:navigationBarColor">#08080D</item>

              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="RCINSTAEDIT"
                  android:theme="@style/AppTheme"
                  android:enableOnBackInvokedCallback="true">

                  <activity
                      android:name=".VideoEditorActivity"
                      android:screenOrientation="portrait"
                      android:exported="false" />

                  <activity
                      android:name=".PhotoEditorActivity"
                      android:screenOrientation="portrait"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/rcinstaedit/MainActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowInsets;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private int dp(int v) {
                  return (int)(v *
                          getResources()
                                  .getDisplayMetrics()
                                  .density + .5f);
              }

              private TextView text(
                      String s,
                      int size,
                      int color) {

                  TextView t = new TextView(this);

                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  t.setIncludeFontPadding(true);

                  return t;
              }

              private void applyInsets(View v) {

                  if (Build.VERSION.SDK_INT >= 30) {

                      v.setOnApplyWindowInsetsListener(
                              (view, insets) -> {

                                  android.graphics.Insets bars =
                                          insets.getInsets(
                                                  WindowInsets.Type.systemBars());

                                  view.setPadding(
                                          view.getPaddingLeft(),
                                          bars.top,
                                          view.getPaddingRight(),
                                          bars.bottom);

                                  return insets;
                              });
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  home();
              }

              private void home() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setBackgroundColor(
                          Color.rgb(8,8,13));

                  applyInsets(root);

                  setContentView(root);

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setFillViewport(true);

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL);

                  box.setPadding(
                          dp(16),
                          dp(16),
                          dp(16),
                          dp(30));

                  scroll.addView(box);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,0,1));

                  TextView title =
                          text(
                                  "RCINSTAEDIT",
                                  28,
                                  Color.WHITE);

                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD);

                  box.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  -1,dp(72)));

                  TextView sub =
                          text(
                                  "Edit • Create • Inspire",
                                  15,
                                  Color.rgb(170,145,255));

                  sub.setGravity(Gravity.CENTER);

                  box.addView(
                          sub,
                          new LinearLayout.LayoutParams(
                                  -1,dp(45)));

                  section(box,"EDITORS");

                  card(
                          box,
                          "📷  PHOTO EDITOR",
                          "Professional photo editing tools",
                          v -> startActivity(
                                  new Intent(
                                          this,
                                          PhotoEditorActivity.class)));

                  card(
                          box,
                          "🎬  VIDEO EDITOR",
                          "Trim • Speed • Rotate • Mute • Export",
                          v -> startActivity(
                                  new Intent(
                                          this,
                                          VideoEditorActivity.class)));

                  section(box,"TOOLS");

                  card(
                          box,
                          "✨  EFFECTS",
                          "Creative effects and looks",
                          v -> toast(
                                  "Effects next stage mein"));

                  card(
                          box,
                          "🔀  TRANSITIONS",
                          "Smooth reel transitions",
                          v -> toast(
                                  "Transitions next stage mein"));

                  card(
                          box,
                          "🎵  ADD AUDIO FROM PHONE",
                          "Use your own audio files",
                          v -> toast(
                                  "Audio tool next stage mein"));

                  card(
                          box,
                          "💾  HIGH QUALITY EXPORT",
                          "Export your edited photos and videos",
                          v -> toast(
                                  "Editor ke andar Export use karo"));
              }

              private void section(
                      LinearLayout parent,
                      String s) {

                  TextView t =
                          text(
                                  s,
                                  14,
                                  Color.rgb(170,145,255));

                  t.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD);

                  t.setIncludeFontPadding(true);
                  t.setGravity(Gravity.CENTER_VERTICAL);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52));

                  p.setMargins(
                          0,
                          dp(18),
                          0,
                          dp(5));

                  parent.addView(t,p);
              }

              private void card(
                      LinearLayout parent,
                      String title,
                      String subtitle,
                      View.OnClickListener click) {

                  LinearLayout c =
                          new LinearLayout(this);

                  c.setOrientation(
                          LinearLayout.VERTICAL);

                  c.setGravity(
                          Gravity.CENTER_VERTICAL);

                  c.setPadding(
                          dp(18),
                          dp(10),
                          dp(18),
                          dp(10));

                  c.setBackgroundColor(
                          Color.rgb(20,19,27));

                  TextView a =
                          text(
                                  title,
                                  17,
                                  Color.WHITE);

                  a.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD);

                  TextView b =
                          text(
                                  subtitle,
                                  13,
                                  Color.rgb(190,190,200));

                  b.setSingleLine(false);
                  b.setMaxLines(2);

                  c.addView(
                          a,
                          new LinearLayout.LayoutParams(
                                  -1,dp(34)));

                  c.addView(
                          b,
                          new LinearLayout.LayoutParams(
                                  -1,dp(42)));

                  c.setOnClickListener(click);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(92));

                  p.setMargins(
                          0,
                          dp(6),
                          0,
                          dp(6));

                  parent.addView(c,p);
              }

              private void toast(String s) {
                  android.widget.Toast.makeText(
                          this,
                          s,
                          android.widget.Toast.LENGTH_SHORT
                  ).show();
              }
          }
          EOF

          cat > app/src/main/java/com/rcinstaedit/PhotoEditorActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.ColorMatrix;
          import android.graphics.ColorMatrixColorFilter;
          import android.graphics.Matrix;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowInsets;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.InputStream;
          import java.io.OutputStream;

          public class PhotoEditorActivity extends Activity {

              private LinearLayout root;
              private ImageView preview;
              private Uri photoUri;
              private Bitmap previewBitmap;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private Runnable renderJob;

              private float brightness;
              private float contrast;
              private float saturation;
              private float warmth;
              private float fade;
              private float vignette;

              private int rotation;
              private boolean flipH;
              private boolean flipV;

              private int dp(int v) {
                  return (int)(v *
                          getResources()
                                  .getDisplayMetrics()
                                  .density + .5f);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  build();
              }

              private TextView text(
                      String s,
                      int size,
                      int color) {

                  TextView t =
                          new TextView(this);

                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(
                          Gravity.CENTER_VERTICAL);
                  t.setIncludeFontPadding(true);

                  return t;
              }

              private void build() {

                  root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setBackgroundColor(
                          Color.rgb(8,8,13));

                  setContentView(root);

                  if(Build.VERSION.SDK_INT>=30) {

                      root.setOnApplyWindowInsetsListener(
                              (v,insets)->{

                                  android.graphics.Insets bars =
                                          insets.getInsets(
                                                  WindowInsets.Type.systemBars());

                                  v.setPadding(
                                          0,
                                          bars.top,
                                          0,
                                          bars.bottom);

                                  return insets;
                              });
                  }

                  LinearLayout top =
                          new LinearLayout(this);

                  top.setGravity(
                          Gravity.CENTER_VERTICAL);

                  Button back =
                          new Button(this);

                  back.setText("‹ Back");

                  back.setOnClickListener(
                          v -> finish());

                  TextView title =
                          text(
                                  "Photo Editor",
                                  20,
                                  Color.WHITE);

                  title.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD);

                  top.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  dp(85),dp(54)));

                  top.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,dp(54),1));

                  root.addView(top);

                  Button choose =
                          new Button(this);

                  choose.setText(
                          "📷  CHOOSE PHOTO");

                  choose.setOnClickListener(
                          v -> choosePhoto());

                  root.addView(
                          choose,
                          new LinearLayout.LayoutParams(
                                  -1,dp(52)));

                  /*
                   * FIXED PREVIEW:
                   * This ImageView is OUTSIDE the ScrollView.
                   * Therefore it never scrolls away.
                   */
                  preview =
                          new ImageView(this);

                  preview.setBackgroundColor(
                          Color.BLACK);

                  preview.setScaleType(
                          ImageView.ScaleType.FIT_CENTER);

                  root.addView(
                          preview,
                          new LinearLayout.LayoutParams(
                                  -1,dp(270)));

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setFillViewport(false);

                  LinearLayout controls =
                          new LinearLayout(this);

                  controls.setOrientation(
                          LinearLayout.VERTICAL);

                  controls.setPadding(
                          dp(16),
                          dp(8),
                          dp(16),
                          dp(25));

                  scroll.addView(controls);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,0,1));

                  section(
                          controls,
                          "ADJUST");

                  slider(
                          controls,
                          "Brightness",
                          -100,100,
                          v -> {
                              brightness=v;
                              requestRender();
                          });

                  slider(
                          controls,
                          "Contrast",
                          -100,100,
                          v -> {
                              contrast=v;
                              requestRender();
                          });

                  slider(
                          controls,
                          "Saturation",
                          -100,100,
                          v -> {
                              saturation=v;
                              requestRender();
                          });

                  slider(
                          controls,
                          "Warmth",
                          -100,100,
                          v -> {
                              warmth=v;
                              requestRender();
                          });

                  slider(
                          controls,
                          "Fade",
                          0,100,
                          v -> {
                              fade=v;
                              requestRender();
                          });

                  slider(
                          controls,
                          "Vignette",
                          0,100,
                          v -> {
                              vignette=v;
                              requestRender();
                          });

                  section(
                          controls,
                          "TOOLS");

                  Button rotate =
                          new Button(this);

                  rotate.setText(
                          "⟳  ROTATE 90°");

                  rotate.setOnClickListener(
                          v -> {
                              rotation =
                                      (rotation+90)%360;
                              requestRender();
                          });

                  controls.addView(
                          rotate,
                          new LinearLayout.LayoutParams(
                                  -1,dp(52)));

                  Button flip =
                          new Button(this);

                  flip.setText(
                          "↔  FLIP HORIZONTAL");

                  flip.setOnClickListener(
                          v -> {
                              flipH=!flipH;
                              requestRender();
                          });

                  controls.addView(
                          flip,
                          new LinearLayout.LayoutParams(
                                  -1,dp(52)));

                  Button reset =
                          new Button(this);

                  reset.setText(
                          "RESET");

                  reset.setOnClickListener(
                          v -> {
                              brightness=0;
                              contrast=0;
                              saturation=0;
                              warmth=0;
                              fade=0;
                              vignette=0;
                              rotation=0;
                              flipH=false;
                              flipV=false;
                              requestRender();
                          });

                  controls.addView(
                          reset,
                          new LinearLayout.LayoutParams(
                                  -1,dp(52)));

                  Button save =
                          new Button(this);

                  save.setText(
                          "💾  SAVE PHOTO");

                  save.setOnClickListener(
                          v -> savePhoto());

                  controls.addView(
                          save,
                          new LinearLayout.LayoutParams(
                                  -1,dp(58)));
              }

              private void section(
                      LinearLayout p,
                      String s) {

                  TextView t =
                          text(
                                  s,
                                  14,
                                  Color.rgb(170,145,255));

                  t.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD);

                  t.setGravity(
                          Gravity.CENTER_VERTICAL);

                  t.setIncludeFontPadding(true);

                  t.setPadding(
                          0,dp(4),0,dp(4));

                  LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                                  -1,dp(52));

                  lp.setMargins(
                          0,dp(14),0,dp(3));

                  p.addView(t,lp);
              }

              private void slider(
                      LinearLayout p,
                      String label,
                      int min,
                      int max,
                      Change change) {

                  TextView value =
                          text(
                                  label+"  0",
                                  14,
                                  Color.WHITE);

                  SeekBar bar =
                          new SeekBar(this);

                  bar.setMax(max-min);

                  bar.setProgress(-min);

                  bar.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar s,
                                      int x,
                                      boolean fromUser) {

                                  int val=x+min;

                                  value.setText(
                                          label+"  "+val);

                                  change.onChange(val);
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar s) {}

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar s) {}
                          });

                  p.addView(
                          value,
                          new LinearLayout.LayoutParams(
                                  -1,dp(32)));

                  p.addView(
                          bar,
                          new LinearLayout.LayoutParams(
                                  -1,dp(48)));
              }

              private interface Change {
                  void onChange(int value);
              }

              private void choosePhoto() {

                  Intent i =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT);

                  i.setType("image/*");

                  i.addCategory(
                          Intent.CATEGORY_OPENABLE);

                  startActivityForResult(i,100);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data);

                  if(
                          requestCode!=100 ||
                          resultCode!=RESULT_OK ||
                          data==null)
                      return;

                  photoUri=data.getData();

                  loadPreview();

                  Button b =
                          findButton(root);

                  if(b!=null)
                      b.setText(
                              "🔄  CHANGE PHOTO");
              }

              private Button findButton(View v) {

                  if(v instanceof Button)
                      return (Button)v;

                  if(v instanceof LinearLayout) {

                      LinearLayout l=
                              (LinearLayout)v;

                      for(int i=0;i<l.getChildCount();i++) {

                          Button b=
                                  findButton(
                                          l.getChildAt(i));

                          if(b!=null)
                              return b;
                      }
                  }

                  return null;
              }

              private void loadPreview() {

                  try {

                      InputStream a =
                              getContentResolver()
                                      .openInputStream(
                                              photoUri);

                      BitmapFactory.Options bounds =
                              new BitmapFactory.Options();

                      bounds.inJustDecodeBounds=true;

                      BitmapFactory.decodeStream(
                              a,
                              null,
                              bounds);

                      if(a!=null)
                          a.close();

                      int largest =
                              Math.max(
                                      bounds.outWidth,
                                      bounds.outHeight);

                      int sample=1;

                      while(
                              largest/sample>1400)
                          sample*=2;

                      BitmapFactory.Options opt =
                              new BitmapFactory.Options();

                      opt.inSampleSize=sample;
                      opt.inPreferredConfig =
                              Bitmap.Config.ARGB_8888;

                      InputStream b =
                              getContentResolver()
                                      .openInputStream(
                                              photoUri);

                      previewBitmap =
                              BitmapFactory.decodeStream(
                                      b,
                                      null,
                                      opt);

                      if(b!=null)
                          b.close();

                      resetValues();
                      render();

                  } catch(Exception e) {

                      toast("Photo load nahi hui");
                  }
              }

              private void resetValues() {

                  brightness=0;
                  contrast=0;
                  saturation=0;
                  warmth=0;
                  fade=0;
                  vignette=0;
                  rotation=0;
                  flipH=false;
                  flipV=false;
              }

              private void requestRender() {

                  if(previewBitmap==null)
                      return;

                  if(renderJob!=null)
                      handler.removeCallbacks(
                              renderJob);

                  renderJob =
                          () -> render();

                  /*
                   * 50ms debounce:
                   * slider ko rapidly move karne par
                   * har frame par bitmap recreate nahi hota.
                   */
                  handler.postDelayed(
                          renderJob,
                          50);
              }

              private void render() {

                  if(
                          previewBitmap==null ||
                          preview==null)
                      return;

                  Matrix m =
                          new Matrix();

                  m.postScale(
                          flipH ? -1f : 1f,
                          flipV ? -1f : 1f);

                  m.postRotate(rotation);

                  Bitmap transformed;

                  try {

                      transformed =
                              Bitmap.createBitmap(
                                      previewBitmap,
                                      0,
                                      0,
                                      previewBitmap.getWidth(),
                                      previewBitmap.getHeight(),
                                      m,
                                      true);

                  } catch(Exception e) {

                      transformed=previewBitmap;
                  }

                  ColorMatrix cm =
                          new ColorMatrix();

                  float c =
                          1f+contrast/100f;

                  float bright =
                          brightness*2.2f;

                  cm.setSaturation(
                          Math.max(
                                  0f,
                                  1f+saturation/100f));

                  cm.postConcat(
                          new ColorMatrix(
                                  new float[]{
                                          c,0,0,0,bright,
                                          0,c,0,0,bright,
                                          0,0,c,0,bright,
                                          0,0,0,1,0
                                  }));

                  if(warmth!=0) {

                      float w=
                              warmth*.7f;

                      cm.postConcat(
                              new ColorMatrix(
                                      new float[]{
                                              1,0,0,0,w,
                                              0,1,0,0,0,
                                              0,0,1,0,-w,
                                              0,0,0,1,0
                                      }));
                  }

                  if(fade>0) {

                      float f=
                              fade/100f;

                      cm.postConcat(
                              new ColorMatrix(
                                      new float[]{
                                              1-f,0,0,0,128*f,
                                              0,1-f,0,0,128*f,
                                              0,0,1-f,0,128*f,
                                              0,0,0,1,0
                                      }));
                  }

                  preview.setImageBitmap(
                          transformed);

                  preview.setColorFilter(
                          new ColorMatrixColorFilter(
                                  cm));
              }

              private void savePhoto() {

                  if(photoUri==null) {

                      toast(
                              "Pehle photo choose karo");
                      return;
                  }

                  toast(
                          "Saving photo...");

                  new Thread(
                          () -> {

                              try {

                                  InputStream in =
                                          getContentResolver()
                                                  .openInputStream(
                                                          photoUri);

                                  Bitmap source =
                                          BitmapFactory
                                                  .decodeStream(in);

                                  if(in!=null)
                                      in.close();

                                  Matrix m =
                                          new Matrix();

                                  m.postScale(
                                          flipH?-1:1,
                                          flipV?-1:1);

                                  m.postRotate(rotation);

                                  Bitmap out =
                                          Bitmap.createBitmap(
                                                  source,
                                                  0,
                                                  0,
                                                  source.getWidth(),
                                                  source.getHeight(),
                                                  m,
                                                  true);

                                  ContentValues values =
                                          new ContentValues();

                                  values.put(
                                          MediaStore.Images.Media.DISPLAY_NAME,
                                          "RCINSTAEDIT_"+
                                          System.currentTimeMillis()+
                                          ".jpg");

                                  values.put(
                                          MediaStore.Images.Media.MIME_TYPE,
                                          "image/jpeg");

                                  if(Build.VERSION.SDK_INT>=29) {

                                      values.put(
                                              MediaStore.Images.Media.RELATIVE_PATH,
                                              "Pictures/RCINSTAEDIT");
                                  }

                                  Uri uri =
                                          getContentResolver()
                                                  .insert(
                                                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                                          values);

                                  if(uri==null)
                                      throw new Exception();

                                  OutputStream os =
                                          getContentResolver()
                                                  .openOutputStream(
                                                          uri);

                                  out.compress(
                                          Bitmap.CompressFormat.JPEG,
                                          96,
                                          os);

                                  if(os!=null)
                                      os.close();

                                  source.recycle();

                                  runOnUiThread(
                                          () -> toast(
                                                  "Photo saved"));

                              } catch(OutOfMemoryError e) {

                                  runOnUiThread(
                                          () -> toast(
                                                  "Photo bahut badi hai"));

                              } catch(Exception e) {

                                  runOnUiThread(
                                          () -> toast(
                                                  "Save failed"));
                              }

                          }).start();
              }

              private void toast(String s) {

                  Toast.makeText(
                          this,
                          s,
                          Toast.LENGTH_SHORT).show();
              }

              @Override
              protected void onDestroy() {

                  if(renderJob!=null)
                      handler.removeCallbacks(
                              renderJob);

                  if(
                          previewBitmap!=null &&
                          !previewBitmap.isRecycled())
                      previewBitmap.recycle();

                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/rcinstaedit/VideoEditorActivity.java <<'EOF'
          package com.rcinstaedit;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.WindowInsets;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.VideoView;
          import android.widget.Toast;

          public class VideoEditorActivity extends Activity {

              private VideoView video;
              private TextView time;

              private int duration;

              private int dp(int v) {
                  return (int)(v *
                          getResources()
                                  .getDisplayMetrics()
                                  .density + .5f);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  build();
              }

              private TextView text(
                      String s,
                      int size) {

                  TextView t =
                          new TextView(this);

                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setGravity(
                          Gravity.CENTER_VERTICAL);
                  t.setIncludeFontPadding(true);

                  return t;
              }

              private void build() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setBackgroundColor(
                          Color.rgb(8,8,13));

                  setContentView(root);

                  if(Build.VERSION.SDK_INT>=30) {

                      root.setOnApplyWindowInsetsListener(
                              (v,insets)->{

                                  android.graphics.Insets bars =
                                          insets.getInsets(
                                                  WindowInsets.Type.systemBars());

                                  v.setPadding(
                                          0,
                                          bars.top,
                                          0,
                                          bars.bottom);

                                  return insets;
                              });
                  }

                  LinearLayout top =
                          new LinearLayout(this);

                  top.setGravity(
                          Gravity.CENTER_VERTICAL);

                  Button back =
                          new Button(this);

                  back.setText("‹ Back");

                  back.setOnClickListener(
                          v -> finish());

                  top.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  dp(85),dp(54)));

                  top.addView(
                          text(
                                  "Video Editor",
                                  20),
                          new LinearLayout.LayoutParams(
                                  0,dp(54),1));

                  root.addView(top);

                  Button choose =
                          new Button(this);

                  choose.setText(
                          "🎬  CHOOSE VIDEO");

                  choose.setOnClickListener(
                          v -> choose());

                  root.addView(
                          choose,
                          new LinearLayout.LayoutParams(
                                  -1,dp(52)));

                  video =
                          new VideoView(this);

                  video.setBackgroundColor(
                          Color.BLACK);

                  root.addView(
                          video,
                          new LinearLayout.LayoutParams(
                                  -1,dp(300)));

                  Button play =
                          new Button(this);

                  play.setText(
                          "▶  PLAY / PAUSE");

                  play.setOnClickListener(
                          v -> {

                              if(video.isPlaying())
                                  video.pause();
                              else
                                  video.start();
                          });

                  root.addView(
                          play,
                          new LinearLayout.LayoutParams(
                                  -1,dp(52)));

                  time =
                          text(
                                  "00:00 / 00:00",
                                  14);

                  time.setGravity(
                          Gravity.CENTER);

                  root.addView(
                          time,
                          new LinearLayout.LayoutParams(
                                  -1,dp(38)));

                  SeekBar seek =
                          new SeekBar(this);

                  seek.setMax(1000);

                  seek.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              @Override
                              public void onProgressChanged(
                                      SeekBar s,
                                      int p,
                                      boolean fromUser) {

                                  if(
                                          fromUser &&
                                          duration>0) {

                                      video.seekTo(
                                              duration*p/1000);
                                  }

                                  updateTime();
                              }

                              @Override
                              public void onStartTrackingTouch(
                                      SeekBar s) {}

                              @Override
                              public void onStopTrackingTouch(
                                      SeekBar s) {}
                          });

                  root.addView(
                          seek,
                          new LinearLayout.LayoutParams(
                                  -1,dp(48)));

                  Button rotate =
                          new Button(this);

                  rotate.setText(
                          "⟳  ROTATE 90°");

                  rotate.setOnClickListener(
                          v -> video.setRotation(
                                  video.getRotation()+90));

                  root.addView(
                          rotate,
                          new LinearLayout.LayoutParams(
                                  -1,dp(52)));

                  Button trim =
                          new Button(this);

                  trim.setText(
                          "✂  TRIM / EXPORT");

                  trim.setOnClickListener(
                          v -> toast(
                                  "Video export next processing stage mein"));

                  root.addView(
                          trim,
                          new LinearLayout.LayoutParams(
                                  -1,dp(56)));

                  video.setOnPreparedListener(
                          mp -> {

                              duration=
                                      mp.getDuration();

                              updateTime();
                          });
              }

              private void choose() {

                  Intent i =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT);

                  i.setType("video/*");

                  i.addCategory(
                          Intent.CATEGORY_OPENABLE);

                  startActivityForResult(i,200);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data);

                  if(
                          requestCode==200 &&
                          resultCode==RESULT_OK &&
                          data!=null) {

                      video.setVideoURI(
                              data.getData());

                      video.start();
                  }
              }

              private void updateTime() {

                  if(duration<=0)
                      return;

                  int p=
                          video.getCurrentPosition();

                  time.setText(
                          format(p)+
                          " / "+
                          format(duration));
              }

              private String format(int ms) {

                  int sec=ms/1000;

                  return String.format(
                          "%02d:%02d",
                          sec/60,
                          sec%60);
              }

              private void toast(String s) {

                  Toast.makeText(
                          this,
                          s,
                          Toast.LENGTH_SHORT).show();
              }
          }
