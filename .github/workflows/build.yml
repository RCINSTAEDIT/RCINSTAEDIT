              void slider(
                      int index,
                      int min,
                      int max
              ) {

                  LinearLayout row =
                          new LinearLayout(this);

                  row.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  TextView label =
                          text(
                                  names[index]
                                          + "  0",
                                  14,
                                  Color.WHITE
                          );

                  SeekBar seek =
                          new SeekBar(this);

                  seek.setMax(
                          max - min
                  );

                  seek.setProgress(
                          -min
                  );

                  seek.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar b,
                                      int p,
                                      boolean user
                              ) {

                                  values[index] =
                                          p + min;

                                  label.setText(
                                          names[index]
                                                  + "  "
                                                  + Math.round(
                                                          values[index]
                                                  )
                                  );

                                  schedule();
                              }

                              public void onStartTrackingTouch(
                                      SeekBar b
                              ) {

                                  push();
                              }

                              public void onStopTrackingTouch(
                                      SeekBar b
                              ) {
                              }
                          }
                  );

                  row.addView(
                          label,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(32)
                          )
                  );

                  row.addView(
                          seek,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(46)
                          )
                  );

                  controls.addView(row);
              }

              void filters() {

                  String[] names = {

                          "Original",
                          "Vivid",
                          "Vivid Warm",
                          "Vivid Cool",
                          "Dramatic",
                          "Dramatic Warm",
                          "Dramatic Cool",
                          "Mono",
                          "Silvertone",
                          "Noir",
                          "Warm",
                          "Cool",
                          "Fade"
                  };

                  for (
                          int i = 0;
                          i < names.length;
                          i++
                  ) {

                      final int x = i;

                      Button b =
                              button(
                                      names[i]
                              );

                      b.setOnClickListener(
                              v -> {

                                  push();

                                  filter = x;

                                  schedule();
                              }
                      );

                      controls.addView(
                              b,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(48)
                              )
                      );
                  }

                  TextView label =
                          text(
                                  "Filter Intensity  "
                                          + intensity,
                                  14,
                                  Color.WHITE
                          );

                  SeekBar seek =
                          new SeekBar(this);

                  seek.setMax(100);

                  seek.setProgress(
                          intensity
                  );

                  seek.setOnSeekBarChangeListener(
                          new SeekBar.OnSeekBarChangeListener() {

                              public void onProgressChanged(
                                      SeekBar b,
                                      int p,
                                      boolean user
                              ) {

                                  intensity = p;

                                  label.setText(
                                          "Filter Intensity  "
                                                  + p
                                  );

                                  schedule();
                              }

                              public void onStartTrackingTouch(
                                      SeekBar b
                              ) {

                                  push();
                              }

                              public void onStopTrackingTouch(
                                      SeekBar b
                              ) {
                              }
                          }
                  );

                  controls.addView(
                          label,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(32)
                          )
                  );

                  controls.addView(
                          seek,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(46)
                          )
                  );
              }

              void choosePhoto() {

                  Intent i =
                          new Intent(
                                  Intent.ACTION_OPEN_DOCUMENT
                          );

                  i.setType(
                          "image/*"
                  );

                  i.addCategory(
                          Intent.CATEGORY_OPENABLE
                  );

                  startActivityForResult(
                          i,
                          100
                  );
              }

              @Override
              protected void onActivityResult(
                      int request,
                      int result,
                      Intent data
              ) {

                  super.onActivityResult(
                          request,
                          result,
                          data
                  );

                  if (
                          request == 100
                          && result == RESULT_OK
                          && data != null
                          && data.getData() != null
                  ) {

                      photoUri =
